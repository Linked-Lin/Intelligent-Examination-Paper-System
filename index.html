  /* ---------- PDF 版面清洗：页眉页脚 / 页码 / 断行合并 ---------- */

  function isPdfPageNumberLine(s) {
    var t = String(s == null ? '' : s).trim();
    if (!t) return false;
    if (/^[-—–]?\s*第\s*\d{1,4}\s*页\s*[，,、]?\s*(?:共\s*\d{1,4}\s*页)?\s*[-—–]?$/.test(t)) return true;
    if (/^共\s*\d{1,4}\s*页\s*[，,、]?\s*第\s*\d{1,4}\s*页$/.test(t)) return true;
    if (/^page\s*\d{1,4}\s*(?:\/\s*\d{1,4}|of\s*\d{1,4})?$/i.test(t)) return true;
    if (/^\d{1,4}\s*\/\s*\d{1,4}$/.test(t)) return true;
    if (/^[-—–]\s*\d{1,4}\s*[-—–]$/.test(t)) return true;
    if (/^第\s*\d{1,4}\s*页$/.test(t)) return true;
    return false;
  }

  function pdfHeaderKey(s) {
    return String(s == null ? '' : s).replace(/\d+/g, '#').replace(/\s+/g, '').trim();
  }

  function pdfCleanPages(pages) {
    var cleaned = pages.map(function (pl) {
      return (pl || []).map(function (t) { return String(t == null ? '' : t); }).filter(function (t) { return t.trim() !== ''; });
    });
    var i;
    for (i = 0; i < cleaned.length; i++) {
      var pl = cleaned[i];
      cleaned[i] = pl.filter(function (t, idx) {
        if (isPdfPageNumberLine(t)) return false;
        if (cleaned.length >= 2 && (idx <= 1 || idx >= pl.length - 2) && /^\d{1,4}$/.test(t.trim())) return false;
        return true;
      });
    }
    if (cleaned.length >= 2) {
      var counts = {};
      cleaned.forEach(function (page) {
        var cand = [];
        for (var k = 0; k < Math.min(2, page.length); k++) cand.push('H|' + pdfHeaderKey(page[k]));
        for (var k2 = Math.max(0, page.length - 2); k2 < page.length; k2++) cand.push('F|' + pdfHeaderKey(page[k2]));
        cand.forEach(function (key) {
          if (!key || key === 'H|' || key === 'F|') return;
          counts[key] = (counts[key] || 0) + 1;
        });
      });
      var repeated = {};
      var threshold = cleaned.length === 2 ? 2 : Math.max(3, Math.ceil(cleaned.length * 0.6));
      Object.keys(counts).forEach(function (key) { if (counts[key] >= threshold) repeated[key] = 1; });
      cleaned = cleaned.map(function (page) {
        return page.filter(function (t, idx) {
          var inTop = idx < 2, inBottom = idx >= page.length - 2;
          if (!inTop && !inBottom) return true;
          var key = (inTop ? 'H|' : 'F|') + pdfHeaderKey(t);
          return !repeated[key];
        });
      });
    }
    return cleaned;
  }

  function pdfLooksStructuralLine(s) {
    var t = String(s == null ? '' : s).trim();
    if (!t) return true;
    if (/^(?:\d{1,3}\s*[.．、)）]|[（(]\s*\d{1,3}\s*[)）])/.test(t)) return true;
    if (/^[A-Ha-h]\s*[.．、)）:：]/.test(t)) return true;
    if (/^[（(]\s*[A-Ha-h]\s*[)）]/.test(t)) return true;
    if (matchFieldLine(t)) return true;
    if (parseSectionHeading(t)) return true;
    if (/^[•·▪◦\-*]\s/.test(t)) return true;
    return false;
  }

  function pdfShouldMerge(prev, cur) {
    if (!prev || !cur) return false;
    var a = String(prev).trim(), b = String(cur).trim();
    if (!a || !b) return false;
    if (b.length > 100) return false;
    if (pdfLooksStructuralLine(b)) return false;
    if (/[。！？!?；;：:…]$/.test(a)) return false;
    return true;
  }

  function pdfJoinLine(prev, cur) {
    var a = String(prev || '').trim(), b = String(cur || '').trim();
    if (!a) return b;
    if (/[A-Za-z0-9]$/.test(a) && /^[A-Za-z0-9]/.test(b)) return a + ' ' + b;
    return a + b;
  }

  function pdfMergeBrokenLines(lines) {
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var t = String(lines[i] == null ? '' : lines[i]).trim();
      if (!t) continue;
      if (out.length && pdfShouldMerge(out[out.length - 1], t)) {
        out[out.length - 1] = pdfJoinLine(out[out.length - 1], t);
        continue;
      }
      out.push(t);
    }
    return out;
  }

  async function extractPdf(bytes, warnings) {
    var ctx = { bytes: bytes };
    var scan = pdfScanObjects(bytes);
    ctx.raw = scan.raw;
    ctx.objects = scan.objects;
    if (!ctx.objects.size) throw new Error('PDF 结构无法识别（可能是损坏或加密文件）');

    var rawTail = ctx.raw;
    if (/\/Encrypt\s*(?:\d+\s+\d+\s+R|<<)/.test(rawTail)) {
      warnings.push('PDF 文件已加密，无法提取文字。请先用 PDF 工具解除密码保护，或复制文本后粘贴导入。');
      return [];
    }

    await pdfExpandObjectStreams(ctx, warnings);

    var pageNums = pdfPageList(ctx, warnings);
    if (!pageNums.length) {
      warnings.push('PDF 中没有找到页面内容，无法提取文字。请复制文本后粘贴导入。');
      return [];
    }

    var fontCache = new Map();
    var pageTexts = [];
    for (var p = 0; p < pageNums.length; p++) {
      var pageObj = ctx.objects.get(pageNums[p]);
      if (!pageObj) continue;
      var dict = pageObj.dictText || '';
      var fonts;
      try { fonts = await pdfCollectFonts(dict, ctx, warnings, fontCache); }
      catch (e) { fonts = {}; }
      var contentsKey = pdfFindKey(dict, 'Contents');
      var refs = [];
      if (contentsKey) {
        if (contentsKey.type === 'ref') refs = [contentsKey.num];
        else if (contentsKey.type === 'array') refs = pdfRefsIn(contentsKey.text);
      }
      var contentText = '';
      for (var c = 0; c < refs.length; c++) {
        var co = ctx.objects.get(refs[c]);
        if (!co || !co.stream) continue;
        var data = null;
        try { data = await pdfDecodeStream(co, bytes, warnings); } catch (e) { data = null; }
        if (data) contentText += pdfLatin1(data) + '\n';
      }
      if (!contentText.trim()) { pageTexts.push([]); continue; }
      pageTexts.push(pdfExtractPageLines(contentText, fonts, warnings));
    }

    // 版面清洗：页码/页眉页脚、断行合并
    var cleanedPages = pdfCleanPages(pageTexts);
    var lines = [];
    for (var pg = 0; pg < cleanedPages.length; pg++) {
      var merged = pdfMergeBrokenLines(cleanedPages[pg]);
      for (var q = 0; q < merged.length; q++) lines.push(merged[q]);
    }

    var joined = lines.join('').replace(/\s/g, '');
    if (joined.length < 8) {
      warnings.push('未能从该 PDF 提取到文字（可能是扫描件/图片型 PDF，或字体编码不受支持）。请改用 Word 导入，或把题目文本复制后粘贴到「粘贴文本」中导入。');
      return [];
    }
    return lines.map(function (t) { return { text: t, images: [] }; });
  }

  /* ==================== 7. 文本 / CSV ==================== */

  function parseCSV(text) {
    var s = String(text || '').replace(/^\uFEFF/, '');
    var rows = [], row = [], field = '', inQ = false, i = 0;
    while (i < s.length) {
      var ch = s.charAt(i);
      if (inQ) {
        if (ch === '"') {
          if (s.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === ',') { row.push(field); field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += ch; i++;
    }
    row.push(field);
    rows.push(row);
    return rows.filter(function (r) {
      return r.length > 1 || String(r[0] || '').trim() !== '';
    });
  }

  function detectTextEncoding(bytes, fileName, warnings) {
    var i;
    if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
      return decodeWith(bytes.subarray(3), 'utf-8') || '';
    }
    if (bytes.length >= 2 && bytes[0] === 0xff && bytes[1] === 0xfe) {
      return decodeWith(bytes.subarray(2), 'utf-16le') || '';
    }
    if (bytes.length >= 2 && bytes[0] === 0xfe && bytes[1] === 0xff) {
      return decodeWith(bytes.subarray(2), 'utf-16be') || '';
    }
    var utf8 = decodeWith(bytes, 'utf-8', true);
    if (utf8 != null) return utf8;
    var gbk = decodeWith(bytes, 'gbk');
    if (gbk != null && gbk !== '') {
      warnings.push('文件「' + fileName + '」不是 UTF-8 编码，已按 GBK 解码；如出现乱码请另存为 UTF-8 后重试');
      return gbk;
    }
    warnings.push('文件「' + fileName + '」编码无法识别，已按 UTF-8 尽力解码；如出现乱码请另存为 UTF-8 后重试');
    return decodeUtf8(bytes);
  }

  function textBlocksFromContent(text, warnings) {
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var i;
    for (i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/^\uFEFF/, '').replace(/^\s{0,3}#{1,6}\s*/, '');
      out.push({ text: line, images: [] });
    }
    while (out.length && !String(out[out.length - 1].text).trim()) out.pop();
    return out;
  }

  /* ==================== 8. 统一入口 extractFile ==================== */

  function getFileReaderCtor() {
    try {
      if (typeof FileReader !== 'undefined' && typeof FileReader === 'function') return FileReader;
    } catch (e) { /* noop */ }
    try {
      if (typeof window !== 'undefined' && window && typeof window.FileReader === 'function') return window.FileReader;
    } catch (e2) { /* noop */ }
    return null;
  }

  async function readFileBytes(file) {
    if (file && typeof file.arrayBuffer === 'function') {
      var ab = await file.arrayBuffer();
      return new Uint8Array(ab);
    }
    if (file && typeof file.text === 'function') {
      var t = await file.text();
      return new TextEncoder().encode(t);
    }
    return await new Promise(function (resolve, reject) {
      var Reader = getFileReaderCtor();
      if (!Reader) { reject(new Error('当前环境不支持读取本地文件')); return; }
      var fr = new Reader();
      fr.onload = function () { resolve(new Uint8Array(fr.result)); };
      fr.onerror = function () { reject(fr.error || new Error('读取文件失败')); };
      fr.readAsArrayBuffer(file);
    });
  }

  function isZipBytes(b) {
    return b && b.length > 4 && b[0] === 0x50 && b[1] === 0x4b &&
      ((b[2] === 0x03 && b[3] === 0x04) || (b[2] === 0x05 && b[3] === 0x06) || (b[2] === 0x07 && b[3] === 0x08));
  }
  function isPdfBytes(b) {
    return b && b.length > 8 && b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46;
  }
  function isCfbBytes(b) {
    return b && b.length > 8 && b[0] === 0xd0 && b[1] === 0xcf && b[2] === 0x11 && b[3] === 0xe0 &&
      b[4] === 0xa1 && b[5] === 0xb1 && b[6] === 0x1a && b[7] === 0xe1;
  }

  function kindLabel(kind) {
    return kind === 'docx' ? 'Word' : kind === 'xlsx' ? 'Excel' : kind === 'pdf' ? 'PDF' : '文本';
  }

  async function extractFile(file, onProgress) {
    var fileName = (file && file.name) ? String(file.name) : '未命名文件';
    var ext = extOf(fileName);
    var result = { fileName: fileName, kind: 'text', blocks: [], warnings: [] };
    function progress(ratio, msg) {
      if (typeof onProgress === 'function') {
        try { onProgress(ratio, msg); } catch (e) { /* 忽略进度回调异常 */ }
      }
    }
    var bytes;
    try {
      progress(0.02, '读取文件…');
      bytes = await readFileBytes(file);
    } catch (e) {
      result.warnings.push('无法读取文件「' + fileName + '」：' + (e && e.message ? e.message : e) + '。请重试或改用粘贴文本。');
      return result;
    }
    if (!bytes || !bytes.length) {
      result.warnings.push('文件「' + fileName + '」内容为空');
      return result;
    }

    // 旧版 Office 二进制格式：明确抛出可读错误（调用方/弹窗会显示具体原因与下一步）
    if (isCfbBytes(bytes)) {
      if (ext === 'doc') {
        throw new Error('检测到 .doc 旧版 Word 二进制格式，浏览器无法解析。请用 Word/WPS 另存为 .docx 后重新导入，或复制题目文本粘贴导入。');
      }
      if (ext === 'xls' || ext === 'xlsb') {
        throw new Error('检测到 .xls 旧版 Excel 二进制格式，浏览器无法解析。请用 Excel/WPS 另存为 .xlsx 后重新导入，或复制题目文本粘贴导入。');
      }
      throw new Error('该文件是旧版 Office 二进制格式（OLE），浏览器无法解析。请另存为 .docx/.xlsx 后重新导入，或复制题目文本粘贴导入。');
    }

    try {
      if (isPdfBytes(bytes)) {
        result.kind = 'pdf';
        progress(0.2, '解析 PDF…');
        result.blocks = await extractPdf(bytes, result.warnings);
      } else if (isZipBytes(bytes)) {
        var zip;
        try { zip = openZip(bytes); } catch (e) {
          result.kind = ext === 'xlsx' || ext === 'xls' || ext === 'xlsm' ? 'xlsx' : (ext === 'docx' || ext === 'doc' ? 'docx' : 'text');
          result.warnings.push('ZIP 结构无法读取：' + (e && e.message ? e.message : e) + '。文件可能已损坏，或不是有效的 Office 文档');
          return result;
        }
        var hasDoc = !!zip.find('word/document.xml');
        var hasXls = !!zip.find('xl/workbook.xml') || zip.names().some(function (n) { return /^xl\/worksheets\/sheet\d+\.xml$/i.test(n); });
        if (hasDoc && (!hasXls || ext === 'docx')) {
          result.kind = 'docx';
          progress(0.2, '解析 Word 文档…');
          result.blocks = await extractDocx(bytes, result.warnings);
        } else if (hasXls) {
          result.kind = 'xlsx';
          progress(0.2, '解析 Excel 工作簿…');
          result.blocks = await extractXlsx(bytes, result.warnings);
        } else {
          result.kind = ext === 'xlsx' ? 'xlsx' : 'docx';
          result.warnings.push('ZIP 文件中没有找到 Word 或 Excel 文档结构，无法解析。请确认文件格式。');
        }
      } else {
        result.kind = 'text';
        progress(0.2, '读取文本…');
        var text = detectTextEncoding(bytes, fileName, result.warnings);
        if (ext === 'csv') {
          var rows = parseCSV(text);
          var maxCols = 0, i;
          rows.forEach(function (r) { if (r.length > maxCols) maxCols = r.length; });
          if (!rows.length) result.warnings.push('CSV 文件为空');
          rows.forEach(function (r) {
            while (r.length < maxCols) r.push('');
            result.blocks.push({
              text: r.map(function (cell) { return String(cell == null ? '' : cell).replace(/\t/g, '  '); }).join('\t'),
              images: []
            });
          });
        } else {
          result.blocks = textBlocksFromContent(text, result.warnings);
        }
        if (!result.blocks.length) result.warnings.push('文本文件中没有内容');
      }
    } catch (e) {
      result.blocks = [];
      var msg = e && e.message ? e.message : String(e);
      if (!/粘贴导入/.test(msg)) msg += '。可尝试复制文本后粘贴导入。';
      result.warnings.push('解析失败：' + msg);
    }
    progress(1, '完成');
    return result;
  }

  /* ==================== 9. 题目文本解析 ==================== */

  var TYPE_LABEL = { single: '单选题', multiple: '多选题', judge: '判断题', fill: '填空题', short: '简答题' };
  var TYPE_WORDS = {
    '单选': 'single', '单选题': 'single', '单项选择': 'single', '单项选择题': 'single', '选择题': 'single', '选择': 'single', 'single': 'single', 'singlechoice': 'single',
    '多选': 'multiple', '多选题': 'multiple', '多项选择': 'multiple', '多项选择题': 'multiple', 'multiple': 'multiple', 'multiplechoice': 'multiple',
    '判断': 'judge', '判断题': 'judge', '正误题': 'judge', 'judge': 'judge', 'truefalse': 'judge', 'boolean': 'judge',
    '填空': 'fill', '填空题': 'fill', 'fill': 'fill', 'fillblank': 'fill', 'blank': 'fill',
    '简答': 'short', '简答题': 'short', '问答': 'short', '问答题': 'short', '论述': 'short', '论述题': 'short', '名词解释': 'short',
    'short': 'short', 'essay': 'short', 'shortanswer': 'short'
  };

  function normLabel(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[\s\u3000:：.。、,，()（）\[\]【】]/g, '');
  }

  function typeFromLabel(s) {
    var n = normLabel(s);
    if (!n) return null;
    if (TYPE_WORDS[n]) return TYPE_WORDS[n];
    var keys = Object.keys(TYPE_WORDS).sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < keys.length; i++) {
      if (n.indexOf(keys[i]) >= 0) return TYPE_WORDS[keys[i]];
    }
    return null;
  }

  var JUDGE_TRUE = ['对', '正确', '√', '✓', '是', 't', 'true', 'y', 'yes', '1'];
  var JUDGE_FALSE = ['错', '错误', '×', '✗', 'x', '否', 'f', 'false', 'n', 'no', '0'];

  function judgeValue(raw) {
    var s = String(raw == null ? '' : raw).trim().toLowerCase();
    s = s.replace(/[\s。，,．.、;；:：()（）]/g, '');
    if (!s) return null;
    if (JUDGE_TRUE.indexOf(s) >= 0) return true;
    if (JUDGE_FALSE.indexOf(s) >= 0) return false;
    return null;
  }

  /* ---------- 字段标记（兼容【答案】/[答案]/答案】/正确答案是/故选/Answer/ANS 等） ---------- */

  var FIELD_LABEL_MAP = (function () {
    var map = {};
    function add(kind, names) {
      names.forEach(function (n) { map[normLabel(n)] = kind; });
    }
    add('type', ['题型', '类型', '题目类型', 'type']);
    add('ana', ['答案解析', '试题解析', '题目解析', '解析', '分析', 'explanation', 'analysis']);
    add('ans', ['正确答案', '参考答案', '标准答案', '答案', 'answer', 'ans', 'correct answer', 'correctanswer', 'correct']);
    add('score', ['分值', '分数', 'score', 'points', 'point']);
    add('difficulty', ['难度', 'difficulty', 'level']);
    add('category', ['知识点', '分类', '类别', '章节', 'category', 'knowledge', 'topic']);
    add('tags', ['标签', 'tags', 'tag', 'labels', 'label']);
    return map;
  })();

  function fieldLabelKey(text) {
    var n = normLabel(text);
    if (!n) return null;
    return FIELD_LABEL_MAP[n] || null;
  }

  function stripTrailingBracket(text) {
    var t = String(text == null ? '' : text).trim();
    if (!/[】\]）)\]」』]$/.test(t)) return t;
    var open = (t.match(/[【\[（(「『]/g) || []).length;
    var close = (t.match(/[】\]）)\]」』]/g) || []).length;
    if (close > open) t = t.replace(/\s*[】\]）)\]」』]\s*$/, '');
    return t.trim();
  }

  function matchFieldLine(line) {
    var s = String(line == null ? '' : line).trim();
    if (!s) return null;
    var m, key;
    // 0) 整行被括号包住（「分值：6」/（答案：B））
    if (/^[【\[（(「『]/.test(s) && /[】\]）)」』]$/.test(s)) {
      var inner = s.slice(1, -1).trim();
      var r = matchFieldLine(inner);
      if (r) return { key: r.key, rest: r.rest };
    }
    // 1) 标签被括号包住：【答案】B / [解析] xxx
    m = /^[【\[（(「『]\s*([^】\]）)」』]{1,12})\s*[】\]）)」』]\s*(?:是|为)?\s*[:：]?\s*([\s\S]*)$/.exec(s);
    if (m) { key = fieldLabelKey(m[1]); if (key) return { key: key, rest: stripTrailingBracket(m[2]) }; }
    // 2) 只有右侧括号：答案】B
    m = /^([^】\]）)」』:：]{1,12})\s*[】\]）)」』]\s*(?:是|为)?\s*[:：]?\s*([\s\S]*)$/.exec(s);
    if (m) { key = fieldLabelKey(m[1]); if (key) return { key: key, rest: stripTrailingBracket(m[2]) }; }
    // 3) 标签 + 冒号 / 是 / 为
    m = /^([^:：]{1,16}?)\s*(?:[:：]|是|为)\s*([\s\S]*)$/.exec(s);
    if (m) { key = fieldLabelKey(m[1]); if (key) return { key: key, rest: stripTrailingBracket(m[2]) }; }
    // 4) 标签 + 空格 + 值（仅少数允许字段，避免「分析……」「解析几何……」被误认）
    m = /^([^\s:：]{1,16})\s+([\s\S]+)$/.exec(s);
    if (m) {
      key = fieldLabelKey(m[1]);
      var v = m[2].trim();
      if (key === 'ans' && /^(?:[A-Ha-h]{1,8}|对|错|正确|错误|√|×)$/.test(v)) return { key: 'ans', rest: v };
      if (key === 'score' && /^\d+(?:\.\d+)?\s*分?$/.test(v)) return { key: 'score', rest: v };
      if (key === 'difficulty' && /^[1-5]$/.test(v)) return { key: 'difficulty', rest: v };
      if (key === 'type' && typeFromLabel(v)) return { key: 'type', rest: v };
      if (key === 'category' && v.length <= 24) return { key: 'category', rest: v };
      if (key === 'tags' && v.length <= 40) return { key: 'tags', rest: v };
    }

      else if (t === 'ans') cur.ansImgs = cur.ansImgs.concat(imgs);
      else if (t && typeof t === 'object') t.imgs = (t.imgs || []).concat(imgs);
      else cur.stemImgs = cur.stemImgs.concat(imgs);
    }
    function flush() {
      if (!cur) return;
      var draft = buildQuestionDraft(cur, warnings, '导入内容', { type: sectionType, score: sectionScore });
      if (draft) questions.push(draft);
      cur = null;
      field = null;
    }
    function startQuestion(num, rest, imgs) {
      flush();
      cur = {
        num: num, stemLines: [], options: [], ansLines: [], anaLines: [],
        scoreLines: [], difficultyLines: [], categoryLines: [], tagsLines: [], typeLines: [],
        stemImgs: [], anaImgs: [], ansImgs: [], field: 'stem'
      };
      if (pendingImgs.length) { cur.stemImgs = cur.stemImgs.concat(pendingImgs); pendingImgs = []; }
      field = 'stem';
      if (rest && rest.trim()) {
        var startInline = extractInlineStemAnswer(rest);
        if (startInline) {
          if (startInline.answer) cur.ansLines.push(startInline.answer);
          if (startInline.analysis) cur.anaLines.push(startInline.analysis);
          if (startInline.text) {
            cur.stemLines.push(startInline.text);
            field = 'stem';
          } else {
            field = startInline.analysis ? 'ana' : 'ans';
          }
        } else {
          cur.stemLines.push(rest);
        }
      }
      if (imgs && imgs.length) cur.stemImgs = cur.stemImgs.concat(imgs);
    }

    for (var i = 0; i < records.length; i++) {
      var rec = records[i];
      var line = String(rec.text == null ? '' : rec.text);
      var imgs = rec.images || [];
      if (!line.trim()) {
        if (imgs.length) attachImgs(imgs);
        else if (cur) appendField(cur, field, '');
        continue;
      }
      var qs = isQuestionStart(line, cur, lastNum);
      if (qs) {
        startQuestion(qs.num, qs.rest, imgs);
        lastNum = qs.num;
        continue;
      }
      var secInfo = parseSectionHeading(line);
      if (secInfo && secInfo.skip) {
        flush();
        if (secInfo.type) sectionType = secInfo.type;
        sectionScore = secInfo.score != null ? secInfo.score : null;
        lastNum = 0;
        continue;
      }
      if (!cur) {
        cur = {
          num: 0, stemLines: [line], options: [], ansLines: [], anaLines: [],
          scoreLines: [], difficultyLines: [], categoryLines: [], tagsLines: [], typeLines: [],
          stemImgs: pendingImgs, anaImgs: [], ansImgs: [], field: 'stem'
        };
        pendingImgs = [];
        field = 'stem';
        if (imgs.length) cur.stemImgs = cur.stemImgs.concat(imgs);
        continue;
      }
      var matched = matchFieldLine(line);
      if (matched) {
        var key = matched.key;
        var rest = matched.rest;
        if (key === 'type') { cur.typeLines.push(rest); field = 'type'; }
        else if (key === 'ans') {
          var splitAA = splitAnswerAnalysis(rest);
          if (splitAA.answer) cur.ansLines.push(splitAA.answer);
          if (splitAA.analysis) cur.anaLines.push(splitAA.analysis);
          field = splitAA.analysis ? 'ana' : 'ans';
        } else if (key === 'ana') { if (rest.trim()) cur.anaLines.push(rest); field = 'ana'; }
        else if (key === 'score') { if (rest.trim()) cur.scoreLines.push(rest); field = 'score'; }
        else if (key === 'difficulty') { if (rest.trim()) cur.difficultyLines.push(rest); field = 'difficulty'; }
        else if (key === 'category') { if (rest.trim()) cur.categoryLines.push(rest); field = 'category'; }
        else if (key === 'tags') { if (rest.trim()) cur.tagsLines.push(rest); field = 'tags'; }
        continue;
      }
      // 题干/选项行尾的（答案：B）之类括注
      if (field === 'stem' || field === 'option' || field == null) {
        var inlineAns = extractInlineStemAnswer(line);
        if (inlineAns) {
          if (inlineAns.answer) cur.ansLines.push(inlineAns.answer);
          if (inlineAns.analysis) cur.anaLines.push(inlineAns.analysis);
          if (inlineAns.text) appendField(cur, field === 'option' ? 'option' : 'stem', inlineAns.text);
          if (imgs.length) attachImgs(imgs);
          if (!inlineAns.text) field = inlineAns.analysis ? 'ana' : 'ans';
          continue;
        }
      }
      var op = optionStart(line, field);
      if (op) {
        var parts = splitInlineOptions(op.key, op.rest);
        var trailingAns = '';
        for (var pi = parts.length - 1; pi >= 0; pi--) {
          var ta = extractTrailingAnswerMarker(parts[pi].text);
          if (ta) { trailingAns = ta.answer; parts[pi] = { key: parts[pi].key, text: ta.text }; break; }
        }
        for (var p = 0; p < parts.length; p++) {
          cur.options.push({ key: parts[p].key, lines: parts[p].text.trim() ? [parts[p].text] : [], imgs: [] });
        }
        if (trailingAns) {
          cur.ansLines.push(trailingAns);
          field = 'option';
        } else {
          field = 'option';
        }
        if (imgs.length) {
          var lastOpt = cur.options[cur.options.length - 1];
          lastOpt.imgs = lastOpt.imgs.concat(imgs);
        }
        continue;
      }
      appendField(cur, field, line);
      if (imgs.length) attachImgs(imgs);
    }
    flush();
    return questions;
  }

  function appendField(cur, field, line) {
    if (!cur) return;
    if (field === 'option') {
      var opt = cur.options[cur.options.length - 1];
      if (opt) opt.lines.push(line);
      return;
    }
    if (field === 'ans') { cur.ansLines.push(line); return; }
    if (field === 'ana') { cur.anaLines.push(line); return; }
    if (field === 'score') { cur.scoreLines.push(line); return; }
    if (field === 'difficulty') { cur.difficultyLines.push(line); return; }
    if (field === 'category') { cur.categoryLines.push(line); return; }
    if (field === 'tags') { cur.tagsLines.push(line); return; }
    if (field === 'type') { cur.typeLines.push(line); return; }
    cur.stemLines.push(line);
  }

  /* ---------- 题库 JSON 导入 ---------- */

  function ensureRichHtml(html) {
    var s = String(html == null ? '' : html).trim();
    if (!s) return '';
    if (/<\/?[a-zA-Z][^>]*>/.test(s)) return s;
    return richTextFromLines([s], []);
  }

  function normalizeTypeValue(v) {
    if (v == null) return null;
    var s = String(v).trim();
    if (!s) return null;
    var low = s.toLowerCase();
    if (/^(single|multiple|judge|fill|short)$/.test(low)) return low;
    return typeFromLabel(s);
  }

  function sanitizeRichHtml(html, warnings, label) {
    var s = String(html == null ? '' : html);
    if (!s.trim()) return '';
    var removed = false;
    var rt = getRT();
    if (rt && typeof rt.sanitize === 'function') {
      try {
        var out = rt.sanitize(s);
        if (typeof out === 'string') return out;
      } catch (e) { /* 回退内部清洗 */ }
    }
    // 危险容器连同内容一起删除
    s = s.replace(/<\s*(script|style|iframe|object|embed|link|meta|form|input|button|textarea|select|noscript|base|template|svg|math)\b[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi, function () { removed = true; return ''; });
    s = s.replace(/<\s*\/?\s*(script|style|iframe|object|embed|link|meta|form|input|button|textarea|select|noscript|base|template|svg|math)\b[^>]*>/gi, function () { removed = true; return ''; });
    s = s.replace(/\son[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, function () { removed = true; return ''; });
    s = s.replace(/\sstyle\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, function () { removed = true; return ''; });
    s = s.replace(/(?:javascript|vbscript|data\s*:\s*text\/html)\s*:/gi, function () { removed = true; return ''; });
    // 图片只保留 data:image 白名单
    s = s.replace(/<img\b[^>]*>/gi, function (tag) {
      var m = /\bsrc\s*=\s*("([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(tag);
      var src = m ? (m[2] != null ? m[2] : (m[3] != null ? m[3] : m[4])) : '';
      src = String(src || '').trim();
      if (!isSafeDataUrl(src)) { removed = true; return ''; }
      return '<img src="' + src + '" alt="图片">';
    });
    // 其余标签白名单 + 去属性
    s = s.replace(/<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/g, function (tag, slash, name) {
      var ln = String(name).toLowerCase();
      if (ln === 'img') return tag;
      if (!/^(p|br|b|strong|i|em|u|s|del|sub|sup|span|div|ul|ol|li)$/.test(ln)) { removed = true; return ''; }
      return '<' + (slash ? '/' : '') + ln + '>';
    });
    if (removed && warnings && label) warnings.push(label + '中的危险 HTML 已清洗');
    return s.trim();
  }

  function parseJsonQuestion(item, warnings, idx) {
    if (!item || typeof item !== 'object' || Array.isArray(item)) {
      warnings.push('第 ' + idx + ' 条记录不是题目对象，已跳过');
      return null;
    }
    var label = '第 ' + idx + ' 条题目';
    var stemSrc = item.stem != null ? item.stem : (item.title != null ? item.title : item.question);
    var stemHtml = ensureRichHtml(sanitizeRichHtml(stemSrc == null ? '' : stemSrc, warnings, label + '题干'));
    if (!stripHtml(stemHtml).trim() && !/<img\b/i.test(stemHtml)) {
      warnings.push(label + '缺少题干，已跳过');
      return null;
    }
    var type = normalizeTypeValue(item.type);
    var rawOptions = [];
    var opts = Array.isArray(item.options) ? item.options : [];
    for (var oi = 0; oi < opts.length; oi++) {
      var op = opts[oi];
      if (op == null) continue;
      var text = '', key = 'ABCDEFGH'.charAt(oi);
      if (typeof op === 'string') text = op;
      else if (typeof op === 'object') {
        text = op.text != null ? op.text : (op.content != null ? op.content : '');
        if (op.key != null) key = String(op.key).toUpperCase().charAt(0) || key;
      }
      var ohtml = ensureRichHtml(sanitizeRichHtml(text, warnings, label + '选项'));
      if (!stripHtml(ohtml).trim() && !/<img\b/i.test(ohtml)) continue;
      rawOptions.push({ key: key, lines: [], imgs: [], html: ohtml });
    }

    var ansVal = item.answer;
    var ansIsArray = Array.isArray(ansVal);
    var ansNested = ansIsArray && ansVal.length > 0 && Array.isArray(ansVal[0]);
    var ansType = type;
    if (!ansType) {
      if (ansNested) ansType = 'fill';
      else if (typeof ansVal === 'string' && judgeValue(ansVal) !== null) ansType = 'judge';
      else if (ansIsArray) ansType = 'multiple';
      else if (rawOptions.length >= 2) ansType = extractLetterSequence(ansVal).length > 1 ? 'multiple' : 'single';
      else if (typeof ansVal === 'string' && /<[a-z][\s\S]*>/i.test(ansVal)) ansType = 'short';
      else if (typeof ansVal === 'string' && ansVal.length > 30) ansType = 'short';
      else ansType = 'fill';
    }
    var ansLines = [], ansHtml = null;
    if (ansType === 'short') {
      var ansRaw = ansIsArray ? ansVal.map(function (x) { return String(x); }).join('\n') : (ansVal == null ? '' : String(ansVal));
      ansHtml = ensureRichHtml(sanitizeRichHtml(ansRaw, warnings, label + '参考答案'));
    } else if (ansType === 'fill') {
      var blanks = [];
      var pushBlank = function (part) {
        var arr = (Array.isArray(part) ? part : [part]).map(function (x) { return String(x == null ? '' : x).trim(); }).filter(Boolean);
        if (arr.length) blanks.push(arr);
      };
      if (ansNested) ansVal.forEach(pushBlank);
      else if (ansIsArray) ansVal.forEach(pushBlank);
      else if (ansVal != null && String(ansVal).trim()) {
        String(ansVal).split(/\r?\n/).forEach(function (line) {
          line.split(/\s+\/\s+/).forEach(function (group) {
            var arr = group.split(/[|｜]/).map(function (x) { return x.trim(); }).filter(Boolean);
            if (arr.length) blanks.push(arr);
          });
        });
      }
      ansLines = blanks.map(function (b) { return b.join('|'); });
    } else {
      if (ansIsArray) {
        ansLines = [ansVal.map(function (x) { return String(x == null ? '' : x).toUpperCase(); }).join('')];
      } else if (ansVal != null && String(ansVal).trim()) {
        ansLines = [String(ansVal).trim()];
      }
      ansLines = ansLines.map(function (a) { return stripHtml(a).trim(); }).filter(Boolean);
    }

    var score = Number(item.score);
    var diff = Number(item.difficulty);
    var category = item.category != null ? String(item.category) : (item.knowledge != null ? String(item.knowledge) : '');
    var tagLines = [];
    if (Array.isArray(item.tags)) {
      tagLines = [item.tags.map(function (t) { return String(t == null ? '' : t).trim(); }).filter(Boolean).join(' ')];
    } else if (typeof item.tags === 'string') {
      tagLines = [item.tags];
    }
    var raw = {
      num: idx,
      stemLines: [],
      stemHtml: stemHtml || null,
      options: rawOptions,
      ansLines: ansLines,
      ansHtml: ansHtml || null,
      anaLines: [],
      anaHtml: ensureRichHtml(sanitizeRichHtml(item.analysis != null ? item.analysis : '', warnings, label + '解析')) || null,
      scoreLines: isFinite(score) ? [String(score)] : [],
      difficultyLines: isFinite(diff) ? [String(diff)] : [],
      categoryLines: category ? [category] : [],
      tagsLines: tagLines,
      typeLines: [],
      type: ansType,
      stemImgs: [], anaImgs: [], ansImgs: []
    };
    raw.difficulty = diff;
    return buildQuestionDraft(raw, warnings, label, null);
  }

  function parseBankJson(text) {
    var warnings = [];
    var rawText = String(text == null ? '' : text).replace(/^\uFEFF/, '').trim();
    if (!rawText) throw new Error('JSON 内容为空，请选择题库导出的 .json 文件');
    var data;
    try {
      data = JSON.parse(rawText);
    } catch (e) {
      throw new Error('JSON 解析失败：' + ((e && e.message) || '格式错误') + '。请确认文件是题库导出或数据备份的 .json');
    }
    var questionsSrc = null, bankSrc = null, isFullBackup = false;
    if (Array.isArray(data)) {
      questionsSrc = data;
      warnings.push('JSON 是题目数组，已按题目列表导入');
    } else if (data && typeof data === 'object') {
      if (Array.isArray(data.questions)) {
        questionsSrc = data.questions;
        bankSrc = data.bank || null;
      } else if (data.db && Array.isArray(data.db.questions)) {
        questionsSrc = data.db.questions;
        bankSrc = (Array.isArray(data.db.banks) && data.db.banks[0]) || null;
        isFullBackup = true;
      }
      if (!questionsSrc) throw new Error('JSON 中未找到 questions 数组，无法作为题库导入');
      if (data.banks || data.exams || data.responses || data.users || (data.db && (data.db.banks || data.db.exams))) isFullBackup = true;
      if (!bankSrc && Array.isArray(data.banks) && data.banks[0]) bankSrc = data.banks[0];
    } else {
      throw new Error('JSON 结构不正确：应为 { version, bank, questions } 对象');
    }
    var bank = { name: '', desc: '' };
    if (bankSrc && typeof bankSrc === 'object') {
      bank.name = String(bankSrc.name == null ? '' : bankSrc.name).slice(0, 80);
      bank.desc = String(bankSrc.desc == null ? '' : bankSrc.desc).slice(0, 400);
    }
    if (isFullBackup) {
      warnings.push('检测到完整数据库备份：建议到「数据与设置 → 导入备份」恢复；这里仍会把题目导入到当前题库。');
    }
    var questions = [], skipped = 0;
    for (var i = 0; i < questionsSrc.length; i++) {
      var d = null;
      try { d = parseJsonQuestion(questionsSrc[i], warnings, i + 1); }
      catch (e) { d = null; warnings.push('第 ' + (i + 1) + ' 条题目解析失败，已跳过'); }
      if (d) questions.push(d); else skipped++;
    }
    if (!questions.length) {
      throw new Error('JSON 中没有可导入的有效题目' + (skipped ? '（已跳过 ' + skipped + ' 条格式不正确或缺少题干的记录）' : ''));
    }
    if (skipped) warnings.push('有 ' + skipped + ' 条题目缺少题干或格式不正确，已跳过');
    return { bank: bank, questions: questions, warnings: warnings };
  }

  /* ---------- CSV（含图片映射 / 组合选项列）---------- */

  function parseInlineOptionList(text) {
    var s = String(text == null ? '' : text).trim();
    if (!s) return [];
    var fm = /^([A-Ha-h])\s*[.．、)）:：]\s*/.exec(s);
    if (!fm) return [];
    var order = 'ABCDEFGH';
    var parts = [];
    var curKey = fm[1].toUpperCase();
    var rest = s.slice(fm[0].length);
    while (true) {
      var idx = order.indexOf(curKey);
      var next = order.charAt(idx + 1);
      if (idx < 0 || idx >= order.length - 1) { parts.push({ key: curKey, text: rest }); break; }
      var re = new RegExp('\\s+(?=' + next + '\\s*[.．、)）:：]\\s*)');
      var m = re.exec(rest);
      if (!m) { parts.push({ key: curKey, text: rest }); break; }
      parts.push({ key: curKey, text: rest.slice(0, m.index) });
      rest = rest.slice(m.index + m[0].length);
      curKey = next;
    }
    return parts.filter(function (p) { return String(p.text || '').trim() !== ''; });
  }

  function parseCombinedOptions(cellText) {
    var s = String(cellText == null ? '' : cellText).trim();
    if (!s) return [];
    var chunks = s.split(/[\n|｜]+/).map(function (x) { return x.trim(); }).filter(Boolean);
    var parsed = [], allMatch = chunks.length > 0;
    for (var i = 0; i < chunks.length; i++) {
      var m = /^([A-Ha-h])\s*[.．、)）:：]\s*([\s\S]*)$/.exec(chunks[i]);
      if (m) parsed.push({ key: m[1].toUpperCase(), text: m[2] });
      else { allMatch = false; break; }
    }
    if (allMatch && parsed.length) return parsed;
    return parseInlineOptionList(s);
  }

  function parseImageMap(cellText, warnings) {
    var s = String(cellText == null ? '' : cellText).trim();
    var map = {};
    if (!s) return map;
    var data;
    try { data = JSON.parse(s); }
    catch (e) {
      warnings.push('「图片映射」列不是合法 JSON，本题图片已忽略');
      return map;
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      warnings.push('「图片映射」列格式不正确（应为 {"1":"data:image/..."}），本题图片已忽略');
      return map;
    }
    Object.keys(data).forEach(function (k) {
      var v = data[k];
      if (typeof v === 'string' && isSafeDataUrl(v)) {
        map[String(k).trim()] = v;
        if (v.length > 30000) {
          warnings.push('图片映射中的大图 ' + k + ' 约 ' + Math.round(v.length / 1024) + 'KB：用 Excel 编辑 CSV 可能截断超长单元格，建议直接使用应用内导出的 CSV 回导');
        }
      } else warnings.push('「图片映射」中的 [[IMG:' + k + ']] 不是有效的 data:image 图片，已忽略');
    });
    return map;
  }

  function csvFieldWithImages(text, imageMap, warnings, label) {
    var s = String(text == null ? '' : text);
    var re = /\[\[\s*IMG\s*:\s*(\d+)\s*\]\]/gi;
    if (!re.test(s)) return { text: s, html: null, images: [] };
    re.lastIndex = 0;
    var parts = [], last = 0, m, images = [];
    while ((m = re.exec(s))) {
      var seg = s.slice(last, m.index);
      if (seg) parts.push({ t: 'text', v: seg });
      var url = imageMap && imageMap[m[1]];
      if (url) { parts.push({ t: 'img', v: url }); images.push(url); }
      else warnings.push((label ? label + '：' : '') + '图片占位 [[IMG:' + m[1] + ']] 缺少有效映射，已移除');
      last = re.lastIndex;
    }
    if (last < s.length) parts.push({ t: 'text', v: s.slice(last) });
    var html = '', plain = '';
    parts.forEach(function (p) {
      if (p.t === 'text') {
        plain += p.v;
        html += escHtml(p.v).replace(/\n/g, '<br>');
      } else {
        html += '<img src="' + p.v + '" alt="图片">';
      }
    });
    html = html.replace(/^(?:<br>)+/, '').replace(/(?:<br>)+$/, '');
    return { text: plain.trim(), html: html ? '<p>' + html + '</p>' : '', images: images };
  }

  /* ---------- 表格（Excel / CSV / Word 表格）---------- */

  var HEADER_KEYS = [
    { kind: 'type', names: ['题型', '类型', '题目类型', 'type'] },
    { kind: 'stem', names: ['题干', '题目', '问题', '试题', 'stem', 'question', 'title'] },
    { kind: 'answer', names: ['正确答案', '参考答案', '答案', 'answer', 'correctanswer', 'correct'] },
    { kind: 'analysis', names: ['解析', '答案解析', '分析', 'analysis', 'explanation'] },
    { kind: 'score', names: ['分值', '分数', 'score', 'points'] },
    { kind: 'difficulty', names: ['难度', 'difficulty', 'level'] },
    { kind: 'category', names: ['知识点', '分类', '类别', '章节', 'category', 'knowledge', 'topic'] },
    { kind: 'tags', names: ['标签', 'tags', 'tag', 'labels'] },
    { kind: 'optionsCombined', names: ['选项', '选项内容', '选项列表', 'options', 'option', 'choices', 'choiceset'] },
    { kind: 'images', names: ['图片映射', '图片', '图片数据', 'imagemap', 'image_map', 'image-map', 'images', 'image', 'imgs', 'imgmap'] }
  ];

  function headerCellKind(cell) {
    var n = normLabel(cell);
    if (!n) return null;
    var i;
    for (i = 0; i < HEADER_KEYS.length; i++) {
      if (HEADER_KEYS[i].names.indexOf(n) >= 0) return { kind: HEADER_KEYS[i].kind };
    }
    var mo = /^(?:选项|option|opt)?([a-h])$/i.exec(n);
    if (mo) return { kind: 'option', letter: mo[1].toUpperCase() };
    var mo2 = /^(?:选项|option|opt)([a-h])$/i.exec(n);
    if (mo2) return { kind: 'option', letter: mo2[1].toUpperCase() };
    return null;
  }

  function parseHeaderRow(text) {
    if (text.indexOf('\t') < 0) return null;
    var cells = String(text).split('\t');
    var map = { options: [] };
    var recognized = 0;
    for (var i = 0; i < cells.length; i++) {
      var info = headerCellKind(cells[i]);
      if (!info) continue;
      recognized++;
      if (info.kind === 'option') map.options.push({ letter: info.letter, index: i });
      else if (map[info.kind] == null) map[info.kind] = i;
    }
    if (recognized < 2) return null;
    if (map.stem == null && map.type == null && map.options.length < 2 && map.optionsCombined == null) return null;
    map.recognized = recognized;
    return map;
  }

  function rowToDraft(cells, header, warnings, rowNo) {
    function cellOf(kind) {
      var idx = header[kind];
      if (idx == null || idx >= cells.length) return '';
      return String(cells[idx] == null ? '' : cells[idx]).trim();
    }
    var label = '第 ' + rowNo + ' 行';
    var typeCell = cellOf('type');
    var typeHint = typeFromLabel(typeCell);
    var imageMap = {};
    if (header.images != null) imageMap = parseImageMap(cellOf('images'), warnings);

    var stemCell = cellOf('stem');
    var inlineAns = extractInlineStemAnswer(stemCell);
    if (inlineAns) stemCell = inlineAns.text;
    var stemCellClean = cleanStemText(stemCell, typeHint);
    var stemField = csvFieldWithImages(stemCellClean, imageMap, warnings, label + '题干');
    var stemText = stemField.text;

    var ansCell = cellOf('answer');
    var ansSplit = splitAnswerAnalysis(ansCell.replace(/^(?:【|\[|（|\()?\s*(?:正确答案|参考答案|标准答案|答案|answer|ans)\s*(?:】|\]|）|\))?\s*[:：]?\s*/i, ''));
    var finalAnswer = inlineAns && inlineAns.answer ? inlineAns.answer : ansSplit.answer;
    var ansField = csvFieldWithImages(finalAnswer, imageMap, warnings, label + '答案');
    var ansHtml = null;
    if (ansField.html && (typeHint === 'short' || (!typeHint && !rawIsChoiceHint(typeCell) && !/^[A-Ha-h]+$/.test(extractLetterSequence(ansField.text).join(''))))) {
      ansHtml = ansField.html;
    }

    var anaCell = cellOf('analysis');
    var anaField = csvFieldWithImages(anaCell, imageMap, warnings, label + '解析');
    var anaParts = [];
    if (anaField.text) anaParts.push(anaField.text);
    if (inlineAns && inlineAns.analysis) anaParts.push(inlineAns.analysis);
    if (ansSplit.analysis) anaParts.push(ansSplit.analysis);
    var anaHtml = anaField.html || null;
    if (anaHtml) {
      var extraAna = [];
      if (inlineAns && inlineAns.analysis) extraAna.push(inlineAns.analysis);
      if (ansSplit.analysis) extraAna.push(ansSplit.analysis);
      if (extraAna.length) anaHtml += extraAna.map(function (t) { return '<p>' + escHtml(String(t)) + '</p>'; }).join('');
    }

    var rawOptions = [];
    if (header.options && header.options.length) {
      for (var i = 0; i < header.options.length; i++) {
        var def = header.options[i];
        var text = def.index < cells.length ? String(cells[def.index] == null ? '' : cells[def.index]).trim() : '';
        if (!text) continue;
        var of = csvFieldWithImages(text, imageMap, warnings, label + '选项');
        rawOptions.push({ key: def.letter, lines: of.text ? [of.text] : [], imgs: [], html: of.html });
      }
    } else if (header.optionsCombined != null) {
      var combined = parseCombinedOptions(cellOf('optionsCombined'));
      for (var ci = 0; ci < combined.length; ci++) {
        var cf = csvFieldWithImages(combined[ci].text, imageMap, warnings, label + '选项');
        rawOptions.push({ key: combined[ci].key, lines: cf.text ? [cf.text] : [], imgs: [], html: cf.html });
      }
    }

    var raw = {
      num: rowNo,
      stemLines: [stemText],
      stemHtml: stemField.html || null,
      options: rawOptions,
      ansLines: ansField.text ? [ansField.text] : [],
      ansHtml: ansHtml,
      anaLines: anaParts,
      anaHtml: anaHtml,
      scoreLines: cellOf('score') ? [cellOf('score')] : [],
      difficultyLines: cellOf('difficulty') ? [cellOf('difficulty')] : [],
      categoryLines: cellOf('category') ? [cellOf('category')] : [],
      tagsLines: cellOf('tags') ? [cellOf('tags')] : [],
      typeLines: typeCell ? [typeCell] : [],
      stemImgs: [], anaImgs: [], ansImgs: []
    };
    raw.type = typeHint;
    if (typeCell && !raw.type) warnings.push('第 ' + rowNo + ' 行题型「' + typeCell + '」无法识别，将按选项/答案自动判断');
    if (!String(raw.stemLines[0] || '').trim() && !rawOptions.length && !stemField.html) return null;
    var draft = buildQuestionDraft(raw, warnings, label, null);
    if (draft) draft._row = rowNo;
    return draft;
  }

  function rawIsChoiceHint(typeCell) {
    var t = typeFromLabel(typeCell);
    return t === 'single' || t === 'multiple' || t === 'judge';
  }

  function normalizeBlocks(blocks, warnings) {
    var out = [];
    if (!blocks || typeof blocks.length !== 'number') {
      warnings.push('没有可解析的内容块');
      return out;
    }
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b == null) continue;
      if (typeof b === 'string') out.push({ text: b, images: [] });
      else if (typeof b === 'object') {
        var images = Array.isArray(b.images) ? b.images.filter(isSafeDataUrl) : [];
        var text = b.text == null ? '' : String(b.text).replace(/^\uFEFF/, '');
        out.push({ text: text, images: images });
      }
    }
    return out;
  }

  function questionsFromBlocks(blocks) {
    var warnings = [];
    var list = normalizeBlocks(blocks, warnings);
    var questions = [];
    var header = null;
    var textRecords = [];
    var rowNo = 0;

    function flushText() {
      if (!textRecords.length) return;
      var qs = parseLineQuestions(textRecords, warnings);
      for (var i = 0; i < qs.length; i++) questions.push(qs[i]);
      textRecords = [];
    }

    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var text = b.text;
      if (!String(text).trim() && b.images.length) {
        textRecords.push({ text: '', images: b.images });
        continue;
      }
      if (!String(text).trim()) {
        textRecords.push({ text: '', images: [] });
        continue;
      }
      if (text.indexOf('\t') >= 0) {
        var hm = parseHeaderRow(text);
        if (hm) {
          flushText();
          header = hm;
          rowNo = 0;
          continue;
        }
        if (header) {
          rowNo++;
          var draft = rowToDraft(text.split('\t'), header, warnings, rowNo);
          if (draft) { delete draft._row; questions.push(draft); }
          continue;
        }
      }
      var lines = text.split(/\r?\n/);
      for (var k = 0; k < lines.length; k++) {
        var lineText = lines[k].replace(/\t/g, '  ');
        textRecords.push({ text: lineText, images: k === 0 ? b.images : [] });
      }
    }
    flushText();
    if (!questions.length) {
      warnings.push('没有识别到题目。请检查文本是否包含题号、选项和「答案：」等标记，或下载 CSV 模板按格式填写。');
    }
    return { questions: questions, warnings: warnings };
  }

  function questionsFromText(text) {
    var warnings = [];
    var blocks = textBlocksFromContent(text, warnings);
    var res = questionsFromBlocks(blocks);
    return { questions: res.questions, warnings: res.warnings };
  }

  /* ==================== 10. 图片压缩（写入 DB 前） ==================== */

  function getRT() {
    try { return (typeof RT !== 'undefined' && RT) ? RT : null; } catch (e) { return null; }
  }

  function dataUrlToBlob(dataUrl) {
    var m = /^data:([^;,]+);base64,([\s\S]*)$/i.exec(String(dataUrl || ''));
    if (!m) return null;
    if (typeof Blob === 'undefined') return null;
    var bytes = base64ToBytes(m[2]);
    try { return new Blob([bytes], { type: m[1] }); } catch (e) { return null; }
  }

  async function compressDataUrl(dataUrl) {
    var rt = getRT();
    if (!rt || typeof rt.compressImage !== 'function') return dataUrl;
    if (!isSafeDataUrl(dataUrl) || dataUrl.length < 40000) return dataUrl;
    var blob = dataUrlToBlob(dataUrl);
    if (!blob) return dataUrl;
    try {
      var out = await rt.compressImage(blob, { maxSide: 1200, quality: 0.78, maxBytes: 220000 });
      if (out && typeof out === 'string' && /^data:image\//.test(out)) return out;
    } catch (e) { /* 压缩失败沿用原图 */ }
    return dataUrl;
  }

  async function compressHtmlImages(html) {
    var s = String(html || '');
    var re = /src="(data:image\/[a-z+]+;base64,[^"]+)"/gi;
    var found = [], m;
    while ((m = re.exec(s))) {
      if (found.indexOf(m[1]) < 0) found.push(m[1]);
    }
    if (!found.length) return s;
    var map = new Map();
    for (var i = 0; i < found.length; i++) map.set(found[i], await compressDataUrl(found[i]));
    return s.replace(re, function (all, url) {
      return 'src="' + (map.get(url) || url) + '"';
    });
  }

  async function compressQuestionsImages(questions) {
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      if (!q) continue;
      if (q.stem) q.stem = await compressHtmlImages(q.stem);
      if (q.analysis) q.analysis = await compressHtmlImages(q.analysis);
      if (typeof q.answer === 'string' && q.answer.indexOf('data:image/') >= 0) q.answer = await compressHtmlImages(q.answer);
      if (Array.isArray(q.options)) {
        for (var k = 0; k < q.options.length; k++) {
          if (q.options[k] && q.options[k].text) q.options[k].text = await compressHtmlImages(q.options[k].text);
        }
      }
    }
  }

  /* ==================== 11. 导入弹窗 UI ==================== */

  /* ---------- 预览校对：答案格式化 / 反解析 / 完整性 ---------- */

  function formatAnswerText(draft) {
    var a = draft.answer;
    if (draft.type === 'multiple') {
      if (Array.isArray(a)) return a.join('');
      return typeof a === 'string' ? a : '';
    }
    if (draft.type === 'fill') {
      if (!Array.isArray(a)) return '';
      return a.map(function (b) { return (Array.isArray(b) ? b : [b]).join('|'); }).join(' / ');
    }
    if (draft.type === 'short') return stripHtml(a || '').replace(/\s+/g, ' ').trim();
    return typeof a === 'string' ? a : '';
  }

  function textToAnswer(type, text) {
    var s = String(text == null ? '' : text).trim();
    if (type === 'judge') {
      var jv = judgeValue(s);
      if (jv !== null) return jv ? 'A' : 'B';
      var l = extractLetterSequence(s);
      return l.length ? l[0] : '';
    }
    if (type === 'single') {
      var l2 = extractLetterSequence(s);
      if (l2.length) return l2[0];
      var jv2 = judgeValue(s);
      if (jv2 !== null) return jv2 ? 'A' : 'B';
      return s;
    }
    if (type === 'multiple') return uniq(extractLetterSequence(s));
    if (type === 'fill') {
      if (!s) return [[]];
      var blanks = [];
      s.split(/\s*[\/／]\s*/).forEach(function (p) {
        var alts = p.split(/[|｜]/).map(function (x) { return x.trim(); }).filter(Boolean);
        if (alts.length) blanks.push(alts);
      });
      return blanks.length ? blanks : [[]];
    }
    return richTextFromLines([s], []);
  }

  function convertAnswerForType(draft, newType) {
    var a = draft.answer, old = draft.type;
    if (newType === old) return a;
    var jv = typeof a === 'string' ? judgeValue(a) : null;
    if (newType === 'judge') {
      var lj = typeof a === 'string' ? extractLetterSequence(a) : [];
      if (lj.length) return lj[0] === 'B' ? 'B' : 'A';
      return jv === false ? 'B' : 'A';
    }
    if (newType === 'single') {
      if (Array.isArray(a) && a.length) return typeof a[0] === 'string' ? a[0] : '';
      var l2 = typeof a === 'string' ? extractLetterSequence(a) : [];
      if (l2.length) return l2[0];
      if (jv !== null) return jv ? 'A' : 'B';
      return typeof a === 'string' && /^[A-Ha-h]$/.test(a.trim()) ? a.trim().toUpperCase() : '';
    }
    if (newType === 'multiple') {
      if (Array.isArray(a)) return uniq(a.filter(function (x) { return typeof x === 'string'; }));
      return uniq(typeof a === 'string' ? extractLetterSequence(a) : []);
    }
    if (newType === 'fill') {
      if (Array.isArray(a) && a.length && Array.isArray(a[0])) return a;
      if (typeof a === 'string' && /^[A-Ha-h]$/.test(a.trim())) return [[a.trim()]];
      return [[]];
    }
    if (typeof a === 'string') {
      if (a.indexOf('<') >= 0) return a;
      return richTextFromLines([a], []);
    }
    return '';
  }

  function isAnswerComplete(draft) {
    if (!draft) return false;
    var keys = (draft.options || []).map(function (o) { return o.key; });
    var a = draft.answer;
    if (draft.type === 'judge') return a === 'A' || a === 'B';
    if (draft.type === 'single') {
      if (typeof a !== 'string' || !/^[A-H]$/.test(a)) return false;
      return keys.length ? keys.indexOf(a) >= 0 : true;
    }
    if (draft.type === 'multiple') {
      if (!Array.isArray(a) || !a.length) return false;
      return a.every(function (k) { return typeof k === 'string' && /^[A-H]$/.test(k) && (!keys.length || keys.indexOf(k) >= 0); });
    }
    if (draft.type === 'fill') {
      if (!Array.isArray(a) || !a.length) return false;
      return a.every(function (blank) {
        if (Array.isArray(blank)) return blank.length > 0 && blank.some(function (x) { return String(x).trim() !== ''; });
        return String(blank == null ? '' : blank).trim() !== '';
      });
    }
    return stripHtml(a || '').trim() !== '';
  }

  function getGlobal(name) {
    if (typeof globalThis !== 'undefined' && globalThis && name in globalThis) return globalThis[name];
    return undefined;
  }

  function toastMsg(msg, type) {
    try {

  function uidFallback() {
    return 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function makeUid() {

  function getDB() {

  function stemKey(html) {
    var rt = getRT();

    if (rt && typeof rt.plain === 'function') {

    plain = String(plain || '').trim();

  function bindDialog(m, bankId, onDone, state) {

    function currentSkip() {

    function existingKeys() {

        var item = db.questions[i];

    }
    function computeCounts() {

      if (srcNames.length) parts.push('来源：<b>' + escHtml(srcNames.join('、')) + '</b>');

    function typeOptionsHtml(current) {

      var rows = drafts.slice(0, state.previewLimit).map(function (d, idx) {
        var isDup = existing.has(stemKey(d.stem));
        var missing = !isAnswerComplete(d);
        var excluded = !!state.excluded[idx];
        var plain = stripHtml(d.stem).replace(/\s+/g, ' ').trim();
        if (plain.length > 64) plain = plain.slice(0, 64) + '…';
        if (!plain) plain = '（图片题）';

          + '<td><select class="imp-type-sel" data-imp-type="' + idx + '" title="手动纠正题型">' + typeOptionsHtml(d.type) + '</select></td>'
          + '<td>' + escHtml(plain)

          + (missing ? ' <span class="imp-tag-missing">缺答案</span>' : '')
          + '</td>'
          + '<td><input class="imp-ans" data-imp-ans="' + idx + '" value="' + escHtml(formatAnswerText(d)) + '" placeholder="答案" title="可手动修改答案"></td>'
          + '<td>' + escHtml(String(d.score)) + '</td>'
          + '</tr>';
      }).join('');
      if (drafts.length) {
        list.innerHTML = '<table class="imp-table"><thead><tr>'

          + '<th style="width:94px">题型</th><th>题干（纯文本）</th>'
          + '<th style="width:132px">答案</th><th style="width:52px">分值</th>'
          + '</tr></thead><tbody>' + rows + '</tbody></table>'
          + (drafts.length > state.previewLimit
            ? '<p class="muted">仅前 ' + state.previewLimit + ' 条可校对，其余 ' + (drafts.length - state.previewLimit) + ' 条按解析结果导入</p>'
            : '')
          + '<p class="muted">可修改题型与答案、取消勾选排除；修改后点「确认导入」按校对结果入库。</p>';

    function updateRowStatus(idx) {
      var row = m.querySelector('[data-imp-row="' + idx + '"]');
      var d = state.drafts[idx];
      if (!row || !d) return;
      var missing = !isAnswerComplete(d);
      var badge = row.querySelector('.imp-tag-missing');
      var cell = row.children[2];
      if (missing && !badge && cell) {
        var span = document.createElement('span');
        span.className = 'imp-tag-missing';
        span.textContent = '缺答案';
        cell.appendChild(document.createTextNode(' '));
        cell.appendChild(span);
      } else if (!missing && badge && badge.parentNode) {

    function setWarnBox() {
      var summary = q('[data-imp="summary"]');
      if (!summary) return;
      var old = q('.imp-warn-all');
      if (old && old.parentNode) old.parentNode.removeChild(old);
      var warns = state.warnings || [];
      if (!warns.length) return;
      var div = document.createElement('div');
      div.className = 'imp-warn-all';
      var uniqWarns = uniq(warns);
      div.innerHTML = '<b>提示（' + uniqWarns.length + '）</b><ul>'
        + uniqWarns.slice(0, 20).map(function (w) { return '<li>' + escHtml(w) + '</li>'; }).join('')
        + '</ul>' + (uniqWarns.length > 20 ? '<p class="muted">还有 ' + (uniqWarns.length - 20) + ' 条提示未显示</p>' : '');

    function setBusy(busy) {
      state.busy = busy;
      var confirmBtn = q('[data-imp="confirm"]');
      var parseBtn = q('[data-imp="parse"]');
      if (parseBtn) parseBtn.disabled = busy;
      if (confirmBtn) confirmBtn.disabled = busy || !state.drafts.length;
      var drop = q('[data-imp="drop"]');

    function addFiles(fileList) {
      var arr = fileList ? Array.prototype.slice.call(fileList) : [];
      if (!arr.length) return;
      for (var i = 0; i < arr.length; i++) {
        if (!arr[i]) continue;
        state.files.push({ file: arr[i], status: 'pending', kind: extOf(arr[i].name) === 'json' ? 'json' : (extOf(arr[i].name) === 'pdf' ? 'pdf' : (extOf(arr[i].name) === 'xlsx' || extOf(arr[i].name) === 'xls' || extOf(arr[i].name) === 'xlsm' ? 'xlsx' : (extOf(arr[i].name) === 'docx' || extOf(arr[i].name) === 'doc' ? 'docx' : 'text'))), count: 0, warnings: [], error: '' });
      }
      renderFiles();
      runParse();
    }
    async function runParse() {
      if (state.busy) { state.again = true; return; }
      setBusy(true);
      state.drafts = [];
      state.warnings = [];
      state.internalDup = 0;
      state.excluded = {};
      setStatus('正在解析…');
      var total = state.files.length + 1;
      var done = 0;
      try {
        for (var i = 0; i < state.files.length; i++) {
          var item = state.files[i];
          item.status = 'parsing';
          item.warnings = [];
          item.error = '';
          renderFiles();
          var fileExt = extOf(item.file && item.file.name);
          try {
            if (fileExt === 'json') {
              setProgress((done + 0.3) / total, '解析 JSON 题库…');
              var jbytes = await readFileBytes(item.file);
              var jtext = detectTextEncoding(jbytes, (item.file && item.file.name) || 'json', []);
              var jres = parseBankJson(jtext);
              item.kind = 'json';
              item.warnings = (jres.warnings || []).slice();
              var jsonSource = (item.file && item.file.name) || 'JSON';
              jres.questions.forEach(function (qq) { qq.__source = jsonSource; });
              item.count = jres.questions.length;
              state.drafts = state.drafts.concat(jres.questions);
              item.status = jres.questions.length ? 'done' : 'warn';
              if (jres.bank && jres.bank.name) {
                item.warnings.push('JSON 题库「' + jres.bank.name + '」已按题目导入到当前题库');
              }
              if (item.warnings.length) state.warnings = state.warnings.concat(item.warnings);
            } else {
              var res = await extractFile(item.file, function (ratio, msg) {
                setProgress((done + (ratio || 0)) / total, msg || ('解析 ' + (item.file && item.file.name || '')));
              });
              item.kind = res.kind;
              item.warnings = (res.warnings || []).slice();
              if (!res.blocks || !res.blocks.length) {
                item.status = 'error';
                item.error = item.warnings.length ? item.warnings.join('；') : '未提取到可用内容';
                state.warnings = state.warnings.concat(item.warnings.length ? item.warnings : [item.error]);
              } else {
                var parsed = questionsFromBlocks(res.blocks);
                item.count = parsed.questions.length;
                var fileSource = (item.file && item.file.name) || '文件';
                parsed.questions.forEach(function (qq) { qq.__source = fileSource; });
                state.drafts = state.drafts.concat(parsed.questions);
                item.warnings = item.warnings.concat(parsed.warnings || []);
                item.status = parsed.questions.length ? 'done' : 'warn';
                if (!parsed.questions.length) item.error = '未识别到题目，请检查文档格式或改用 CSV 模板';
                if (item.warnings.length) state.warnings = state.warnings.concat(item.warnings);
              }
            }
          } catch (err) {
            item.status = 'error';
            item.error = (err && err.message) ? err.message : String(err);
            state.warnings.push('「' + (item.file && item.file.name || '文件') + '」解析失败：' + item.error);
          }
          done++;
          renderFiles();
          setProgress(done / total);
          if (state.closed) return;
        }
        // 粘贴文本
        var ta = q('[data-imp="text"]');
        var text = ta ? String(ta.value || '') : '';
        if (text.trim()) {
          try {
            var tr = questionsFromText(text);
            tr.questions.forEach(function (qq) { qq.__source = '粘贴文本'; });
            if (tr.questions.length) state.drafts = state.drafts.concat(tr.questions);
            if (tr.warnings && tr.warnings.length) state.warnings = state.warnings.concat(tr.warnings);
          } catch (e2) {
            state.warnings.push('粘贴文本解析失败：' + (e2 && e2.message ? e2.message : e2));
          }
        }
        // 导入内部去重
        var seen = new Set();
        var keep = [];
        for (var d = 0; d < state.drafts.length; d++) {
          var key = stemKey(state.drafts[d].stem);
          if (key && seen.has(key)) { state.internalDup++; continue; }
          if (key) seen.add(key);
          keep.push(state.drafts[d]);
        }
        state.drafts = keep;
        done++;
        setProgress(1, '解析完成');
        var cnt = computeCounts();
        var statusParts = [];
        statusParts.push(state.drafts.length ? ('识别 ' + state.drafts.length + ' 题') : '未识别到题目');
        if (cnt.missing) statusParts.push('缺答案 ' + cnt.missing + ' 题');
        if (state.drafts.length) statusParts.push('请校对后确认导入');
        setStatus(statusParts.join('，'), state.drafts.length ? 'ok' : 'warn');
        renderPreview();
      } finally {
        setBusy(false);
        renderPreview();
        if (state.again && !state.closed) { state.again = false; runParse(); }
      }

    async function doConfirm() {
      if (state.busy) return;
      var db = getDB();
      if (!db || !Array.isArray(db.questions)) {
        toastMsg('数据未就绪，无法写入题库', 'bad');
        return;
      }
      if (!state.drafts.length) return;
      setBusy(true);
      try {
        var skip = currentSkip();
        var onlyComplete = currentOnlyComplete();
        var existing = existingKeys();
        var added = [];
        var skippedDup = 0, skippedMissing = 0, skippedExcluded = 0, skippedEmpty = 0;
        for (var i = 0; i < state.drafts.length; i++) {
          var draft = state.drafts[i];
          if (state.excluded[i]) { skippedExcluded++; continue; }
          if (!stripHtml(draft.stem).trim() && !/<img/i.test(String(draft.stem || ''))) { skippedEmpty++; continue; }
          var key = stemKey(draft.stem);
          if (skip && existing.has(key)) { skippedDup++; continue; }
          if (onlyComplete && !isAnswerComplete(draft)) { skippedMissing++; continue; }
          var question = {
            id: makeUid(),
            bankId: bankId,
            type: draft.type,
            stem: draft.stem,
            options: draft.options,
            answer: draft.answer,
            analysis: draft.analysis,
            score: draft.score,
            difficulty: draft.difficulty,
            category: draft.category,
            tags: draft.tags,
            source: draft.__source || '',
            importedAt: Date.now()
          };
          db.questions.push(question);
          existing.add(key);
          added.push(question);
        }
        if (!added.length) {
          var why = [];
          if (skippedDup) why.push('重复 ' + skippedDup + ' 题');
          if (skippedMissing) why.push('缺答案 ' + skippedMissing + ' 题');
          if (skippedExcluded) why.push('手动排除 ' + skippedExcluded + ' 题');
          toastMsg('没有可导入的题目' + (why.length ? '（已跳过：' + why.join('、') + '）' : ''), 'warn');
          return;
        }
        try { await compressQuestionsImages(added); } catch (e) { /* 图片压缩失败不阻断导入 */ }

        try { if (typeof save === 'function') saved = save() !== false; else saved = false; } catch (e) { saved = false; }
        if (!saved) {

        try { if (typeof render === 'function') render(); } catch (e) { /* noop */ }
        var msgs = ['已导入 ' + added.length + ' 题'];
        if (skippedDup) msgs.push('跳过重复 ' + skippedDup + ' 题');
        if (skippedMissing) msgs.push('缺答案跳过 ' + skippedMissing + ' 题');
        if (skippedExcluded) msgs.push('手动排除 ' + skippedExcluded + ' 题');
        if (skippedEmpty) msgs.push('空题干跳过 ' + skippedEmpty + ' 题');
        var warnCount = uniq(state.warnings || []).length;
        if (warnCount) msgs.push('另有 ' + warnCount + ' 条提示');
        toastMsg(msgs.join('，'), 'ok');
        if (typeof onDone === 'function') {
          try { onDone(added.length); } catch (e) { /* noop */ }
        }
      } finally {
        setBusy(false);
      }
    }
    function downloadTemplate() {
      var content = IMP.TEMPLATE_CSV;

      try {
        if (typeof download === 'function') { download(name, content); toastMsg('模板已开始下载', 'ok'); return; }
      } catch (e) { /* 回退到 a[download] */ }

      }

    m.addEventListener('click', function (e) {
      var target = e.target && e.target.closest ? e.target.closest('[data-imp]') : null;
      if (!target || !m.contains(target)) return;
      var act = target.getAttribute('data-imp');

  // 艺术字内容：先去掉标签形态，再去残余尖括号/控制字符，压缩空白，截断

  var ENTITY_RE = /&(amp|lt|gt|quot|apos|#39|nbsp);/gi;

  /** 纯文本字段清洗（题库名/描述/分类/标签/填空答案等）：去标签、去控制字符、截断 */

      .replace(/\s+/g, ' ')
      .trim();

    return s;
  }

  /** 归一化题干 key（优先全局 norm + plainOf，与题库导入的去重规则保持一致） */

  }

    var opts = Array.isArray(q.options) ? q.options : [];
    for (var i = 0; i < opts.length; i++) {
      n += countImagesInHtml(isObj(opts[i]) ? opts[i].text : opts[i]);

    return n;
  }

  /* ------------------------------------------------------------------ *
   * 分享者信息
   * ------------------------------------------------------------------ */
  function currentFrom() {
    var u = run(function () { return (typeof AUTH !== 'undefined' && AUTH && typeof AUTH.current === 'function') ? AUTH.current() : null; });
    if (!u) u = run(function () { return typeof CURRENT_USER !== 'undefined' ? CURRENT_USER : null; });
    var name = sanitizeText(u && u.name, 40) || sanitizeText(u && u.username, 40) || DEFAULT_FROM;
    var username = sanitizeText(u && u.username, 40);
    return { name: name, username: username };
  }

  /* ------------------------------------------------------------------ *
   * 题目规范化（编码与导入共用）
   * ------------------------------------------------------------------ */
  function normalizeOptions(options, type) {
    var list = Array.isArray(options) ? options : [];
    var texts = [], i, o, t;
    for (i = 0; i < list.length && texts.length < MAX_OPTIONS; i++) {
      o = list[i];
      t = sanitizeRich(isObj(o) ? o.text : o);
      if (!hasVisibleContent(t)) continue;
      texts.push(t);
    }
    if (type === 'judge') {
      if (texts.length !== 2) texts = ['正确', '错误'];
    } else if (texts.length < 2) {
      return null; // 单选/多选至少 2 个有效选项
    }
    var out = [];
    for (i = 0; i < texts.length; i++) out.push({ key: LETTERS.charAt(i), text: texts[i] });
    return out;
  }

  function asLetter(v) {
    var s = str(v).trim().toUpperCase();
    var m = s.match(/[A-H]/);
    return m ? m[0] : '';
  }

  function judgeLetter(v) {
    if (Array.isArray(v)) v = v.length ? v[0] : '';
    var s = str(v).trim().toLowerCase();
    if (!s) return '';
    if (s === 'true' || s === 'a' || s === 't' || s === '√' || s === '对' || s === '正确' || s === '是' || s === 'yes') return 'A';
    if (s === 'false' || s === 'b' || s === 'f' || s === '×' || s === 'x' || s === '错' || s === '错误' || s === '否' || s === 'no') return 'B';
    if (s.indexOf('正确') >= 0 || s.indexOf('对') >= 0) return 'A';
    if (s.indexOf('错误') >= 0 || s.indexOf('错') >= 0) return 'B';
    var l = asLetter(s);
    return (l === 'A' || l === 'B') ? l : '';
  }

  function normalizeFillAnswer(answer) {
    if (answer == null) return [];
    var groups;
    if (!Array.isArray(answer)) {
      groups = [[answer]];
    } else if (answer.every(function (a) { return !Array.isArray(a); })) {
      groups = answer.map(function (a) { return [a]; }); // 与 normalizeQuestion 一致：每个元素一个空
    } else {
      groups = answer.map(function (g) { return Array.isArray(g) ? g : [g]; });
    }
    var out = [];
    groups.forEach(function (alts) {
      var list = [];
      alts.forEach(function (a) {
        var t = sanitizeText(a, 200);
        if (t) list.push(t);
      });
      if (list.length) out.push(list);
    });
    return out;
  }

    var max = Array.isArray(options) && options.length ? options.length : 0;
    var inRange = function (l) { return l && (!max || LETTERS.indexOf(l) < max); };
    if (type === 'multiple') {
      var arr = Array.isArray(answer)

        : (answer == null || answer === '' ? [] : (str(answer).match(/[A-Ha-h]/g) || []));
      var seen = {}, out = [];
      arr.forEach(function (a) {
        var l = asLetter(a);
        if (inRange(l) && !seen[l]) { seen[l] = 1; out.push(l); }
      });
      return out.sort();
    }
    if (type === 'single') {
      var single = asLetter(answer);
      return inRange(single) ? single : '';
    }
    if (type === 'judge') {

  }

    var out = [], seen = {};

      if (!t || seen[t]) continue;
      seen[t] = 1;
      out.push(t);
    }
    return out;
  }

  /** 题目核心规范化：返回 null 表示无效（题干空 / 题型非法 / 选项不足） */
  function normalizeQuestionCore(q) {
    if (!isObj(q)) return null;
    var type = str(q.type);
    if (!TYPES[type]) return null;
    var stem = sanitizeRich(q.stem);
    if (!hasVisibleContent(stem)) return null;
    var options = (type === 'fill' || type === 'short') ? [] : normalizeOptions(q.options, type);

      options: options,
      answer: normalizeAnswer(type, q.answer, options),

      category: sanitizeText(q.category, 80),

      type: c.type,
      stem: c.stem,
      options: c.options,
      answer: c.answer,
      score: c.score,
      difficulty: c.difficulty
    };
    if (c.analysis) item.analysis = c.analysis;
    if (c.category) item.category = c.category;
    if (c.tags.length) item.tags = c.tags;
    return item;
  }

  /* ------------------------------------------------------------------ *
   * 编码
   * ------------------------------------------------------------------ */
  function encodePackage(pkg) {
    return bytesToBase64(utf8Bytes(JSON.stringify(pkg)));
  }

  function finishEncode(pkg) {
    var code;
    try {
      code = encodePackage(pkg);
    } catch (e) {
      return fail('生成分享码失败：' + (e && e.message ? e.message : e));
    }
    return {
      ok: true,
      code: code,
      package: pkg,
      size: code.length,
      large: code.length > LARGE_CODE_CHARS,
      tooLarge: code.length > MAX_CODE_CHARS,
      count: pkg.questions.length,
      reason: ''
    };
  }

  function encodeQuestions(bank, questions) {
    if (!isObj(bank)) return fail('缺少题库信息，无法生成分享包');
    var qs = Array.isArray(questions) ? questions : [];
    if (!qs.length) return fail('该题库还没有题目，无法分享');
    if (qs.length > MAX_QUESTIONS) return fail('题目数量过多（超过 ' + MAX_QUESTIONS + ' 题），请拆分题库后再分享');
    var built = [], skipped = 0;
    for (var i = 0; i < qs.length; i++) {
      var item = packageQuestion(qs[i]);
      if (item) built.push(item);
      else skipped++;
    }
    if (!built.length) return fail('没有可分享的有效题目（题目为空或题干缺失）');
    var bankName = sanitizeText(bank.name, 60) || '未命名题库';
    var pkg = {
      v: PACKAGE_VERSION,
      type: TYPE_SHARE,
      createdAt: nowMs(),
      from: currentFrom(),
      bank: { name: bankName, desc: sanitizeText(bank.desc, 200) },
      questions: built

    return finishEncode(pkg);
  }

  function getDB() {
    return run(function () {
      if (typeof DB !== 'undefined' && DB && typeof DB === 'object' &&
          Array.isArray(DB.banks) && Array.isArray(DB.questions)) return DB;
      return null;
    }) || null;
  }

  function encodeBank(bankId) {
    var id = str(bankId).trim();
    if (!id) return fail('请指定要分享的题库');
    var db = getDB();
    if (!db) return fail('当前工作区数据未就绪，无法生成分享包');
    var bank = null;
    for (var i = 0; i < db.banks.length; i++) {
      if (db.banks[i] && str(db.banks[i].id) === id) { bank = db.banks[i]; break; }
    }
    if (!bank) return fail('题库不存在或已被删除');
    var qs = db.questions.filter(function (q) { return q && str(q.bankId) === id; });
    return encodeQuestions(bank, qs);
  }

  /* ------------------------------------------------------------------ *
   * 校验 / 解码
   * ------------------------------------------------------------------ */
  function validatePackage(pkg) {
    if (!isObj(pkg)) return { ok: false, reason: '分享包内容不是有效对象' };
    if (pkg.v == null) return { ok: false, reason: '分享包缺少版本号（v）' };
    if (Number(pkg.v) !== PACKAGE_VERSION) {
      return { ok: false, reason: '分享包版本不支持（v=' + str(pkg.v).slice(0, 20) + '，当前支持 v=' + PACKAGE_VERSION + '）' };
    }
    if (pkg.type == null) return { ok: false, reason: '分享包缺少类型字段（type）' };
    if (pkg.type !== TYPE_SHARE) return { ok: false, reason: '不是智卷题库分享包（type 不匹配）' };
    if (!isObj(pkg.bank)) return { ok: false, reason: '分享包缺少题库信息（bank）' };
    if (typeof pkg.bank.name !== 'string' || !pkg.bank.name.trim()) return { ok: false, reason: '分享包缺少题库名称' };
    if (!Array.isArray(pkg.questions)) return { ok: false, reason: '分享包缺少题目列表（questions）' };
    if (!pkg.questions.length) return { ok: false, reason: '分享包中没有题目' };
    if (pkg.questions.length > MAX_QUESTIONS) {
      return { ok: false, reason: '分享包题目数量过多（超过 ' + MAX_QUESTIONS + ' 题）' };
    }
    for (var i = 0; i < pkg.questions.length; i++) {
      var q = pkg.questions[i], no = i + 1;
      if (!isObj(q)) return { ok: false, reason: '第 ' + no + ' 题不是有效题目对象' };
      if (!TYPES[str(q.type)]) return { ok: false, reason: '第 ' + no + ' 题题型不支持：' + str(q.type).slice(0, 20) };
      if (typeof q.stem !== 'string' || !hasVisibleContent(q.stem)) {
        return { ok: false, reason: '第 ' + no + ' 题缺少题干' };
      }

        }
      }
    }

  }

  function decode(code) {
    var text = str(code).trim();
    if (!text) return fail('请输入分享码');
    // 容错：直接粘贴分享文件 JSON 时也接受（文件可承载大图片，上限单独放宽）
    if (text.charAt(0) === '{') {
      if (text.length > MAX_FILE_CHARS) {
        return fail('分享文件过大（超过 20MB），请检查内容是否完整');
      }
      var pkgJson;
      try { pkgJson = JSON.parse(text); } catch (e) { return fail('分享文件不是有效的 JSON'); }
      var vJson = validatePackage(pkgJson);

    }

    if (!raw) return fail('分享码为空');
    if (raw.length > MAX_CODE_CHARS) {
      return fail('分享码过大（超过 2MB），请改用 .zjshare.json 分享文件导入');
    }

    var pkg;
    try { pkg = JSON.parse(json); } catch (e) { return fail('分享码内容不是有效的 JSON'); }

    return { ok: true, pkg: pkg };

  /* ------------------------------------------------------------------ *
   * 导入
   * ------------------------------------------------------------------ */
  function uniqueBankName(db, base) {
    var name = sanitizeText(base, 40) || '分享题库';
    var taken = function (n) {
      return db.banks.some(function (b) { return b && str(b.name) === n; });
    };
    if (!taken(name)) return name;
    var candidate = name + '（分享）';
    var n = 2;
    while (taken(candidate) && n < 1000) {
      candidate = name + '（分享' + n + '）';
      n++;

    return candidate;
  }

    if (!db) return fail('当前工作区数据未就绪，无法导入分享题库');

    var fromName = sanitizeText(pkg.from && pkg.from.name, 40) || DEFAULT_FROM;
    var source = SOURCE_PREFIX + fromName;
    var targetId = str(opts.bankId).trim();
    var bank = null, created = false;
    if (targetId) {
      for (var i = 0; i < db.banks.length; i++) {
        if (db.banks[i] && str(db.banks[i].id) === targetId) { bank = db.banks[i]; break; }
      }

      var owner = (typeof AUTH !== 'undefined' && AUTH && AUTH.current) ? AUTH.current() : null;
      bank = {
        id: makeId('bank_'),
        name: bankName,
        desc: sanitizeText(pkg.bank && pkg.bank.desc, 200),
        ownerId: owner ? owner.id : '',

        viewers: [],
        createdAt: Date.now(),
        updatedAt: Date.now()

      db.banks.push(bank);
      created = true;
    }

    var existing = {};
    db.questions.forEach(function (q) {
      if (q && str(q.bankId) === str(bank.id)) existing[questionKey(q.stem)] = 1;
    });

    var list = pkg.questions;
    for (var k = 0; k < list.length; k++) {

      if (!core) { skipped++; continue; }
      var key = questionKey(core.stem);
      if (existing[key]) { skipped++; continue; }
      existing[key] = 1;
      var item = {
        id: makeId('q_'),
        bankId: bank.id,
        type: core.type,
        stem: core.stem,
        options: core.options,
        answer: core.answer,
        analysis: core.analysis,
        score: core.score,
        difficulty: core.difficulty,
        category: core.category,
        tags: core.tags,
        source: source,
        importedAt: nowMs()

      added++;

  }

  /* ------------------------------------------------------------------ *
   * 文件 / 摘要
   * ------------------------------------------------------------------ */
  function buildShareFile(pkg) {
    if (!isObj(pkg)) return '';
    try { return JSON.stringify(pkg); } catch (e) { return ''; }
  }

  function packageSummary(pkg) {
    var out = { bankName: '', count: 0, imageCount: 0, fromName: '', size: 0 };
    if (!isObj(pkg)) return out;
    out.bankName = sanitizeText(pkg.bank && pkg.bank.name, 60);
    var qs = Array.isArray(pkg.questions) ? pkg.questions : [];
    out.count = qs.length;
