  }
  function fixedIdOf(item) {
    if (isObj(item)) return str(item.qid != null ? item.qid : (item.id != null ? item.id : ''));
    return str(item);
  }

  function sanitizeRuleOut(rule) {
    rule = isObj(rule) ? rule : {};
    return {
      type: TYPES[str(rule.type)] ? str(rule.type) : '',
      category: sanitizeText(rule.category, 80),
      difficulty: str(rule.difficulty).slice(0, 10),
      count: clamp(Math.round(Number(rule.count) || 1), 1, 10000)
    };
  }

  /** 正在编码的考试（exam 为 DB 中考试对象；dbLike 需有 banks/questions） */
  function buildPackage(exam, dbLike) {
    if (!isObj(exam)) return { ok: false, reason: '缺少考试信息，无法生成分享包' };
    var db = resolveDB(dbLike);
    if (!db) return { ok: false, reason: '当前工作区数据未就绪，无法生成分享包' };
    var banks = db.banks;
    var questions = db.questions;

    var bankById = {};
    banks.forEach(function (b) { if (b && str(b.id)) bankById[str(b.id)] = b; });
    var qById = {};
    questions.forEach(function (q) { if (q && str(q.id)) qById[str(q.id)] = q; });

    /* 收集被引用题库：先 fixed 题目所在题库，再 rules.bankId */
    var refIds = [];          // 题库 id（出现顺序）
    var refSet = {};
    function addBankRef(bankId) {
      var id = str(bankId);
      if (!id || refSet[id] || !bankById[id]) return false;
      refSet[id] = 1;
      refIds.push(id);
      return true;
    }

    var fixedIds = [];
    var fixedSeen = {};
    var fixedList = isArr(exam.fixed) ? exam.fixed : [];
    fixedList.forEach(function (item) {
      var qid = fixedIdOf(item);
      if (!qid || fixedSeen[qid]) return;
      var q = qById[qid];
      if (!q) return;
      if (!normalizeQuestionCore(q)) return; // 无效题不进入分享包
      fixedSeen[qid] = 1;
      fixedIds.push(qid);
      addBankRef(q.bankId);
    });

    var ruleList = isArr(exam.rules) ? exam.rules : [];
    var includeAllBanks = false;
    ruleList.forEach(function (r) {
      var bid = str(isObj(r) ? r.bankId : '');
      if (bid) addBankRef(bid);
      else includeAllBanks = true; // bankId 为空的规则表示「全部题库」
    });
    if (includeAllBanks) {
      banks.forEach(function (b) { if (b) addBankRef(b.id); });
    }

    /* 每个被引用题库的题目快照 */
    var pkgBanks = [], bankRefMap = {}, totalQuestions = 0;
    refIds.forEach(function (bankId, idx) {
      var bank = bankById[bankId];
      var ref = 'b' + (idx + 1);
      bankRefMap[bankId] = ref;
      var snapshots = [];
      questions.forEach(function (q) {
        if (!q || str(q.bankId) !== bankId) return;
        var item = packageQuestion(q, q.id);
        if (item) snapshots.push(item);
      });
      if (!snapshots.length) return; // 空题库不放入分享包
      totalQuestions += snapshots.length;
      pkgBanks.push({
        ref: ref,
        name: sanitizeText(bank && bank.name, 60) || '未命名题库',
        desc: sanitizeText(bank && bank.desc, 200),
        questions: snapshots
      });
    });

    if (!pkgBanks.length || !totalQuestions) {
      return { ok: false, reason: '该考试没有可分享的题目（固定题目缺失或抽题规则未关联有效题库）' };
    }
    if (totalQuestions > MAX_QUESTIONS) {
      return { ok: false, reason: '题目数量过多（超过 ' + MAX_QUESTIONS + ' 题），请拆分考试后再分享' };
    }

    /* 包内 fixed：'b1:qid'（只保留成功入包的题目） */
    var includedBank = {}, includedQuestion = {};
    pkgBanks.forEach(function (pb) {
      includedBank[pb.ref] = 1;
      pb.questions.forEach(function (q) { includedQuestion[pb.ref + '\u0000' + str(q.id)] = 1; });
    });
    var pkgFixed = [];
    var addedFixed = {};
    fixedIds.forEach(function (qid) {
      var q = qById[qid];
      var ref = q ? bankRefMap[str(q.bankId)] : '';
      if (!ref || !includedBank[ref] || !includedQuestion[ref + '\u0000' + qid]) return;
      if (addedFixed[qid]) return;
      addedFixed[qid] = 1;
      pkgFixed.push(ref + ':' + qid);
    });

    /* 包内 rules：bankRef 指向入包题库；引用已消失题库的规则丢弃 */
    var pkgRules = [];
    ruleList.forEach(function (r) {
      var bid = str(isObj(r) ? r.bankId : '');
      var ref = bid ? bankRefMap[bid] : '';
      if (bid && !ref) return;
      var out = sanitizeRuleOut(r);
      out.bankRef = ref;
      pkgRules.push(out);
    });

    /* 参与者：本地 userId → 包内 username；群组 → 群名 */
    var users = authUsers();
    var pkgParticipants = [], seenP = {};
    (isArr(exam.participants) ? exam.participants : []).forEach(function (pid) {
      var value = str(pid).trim();
      if (!value) return;
      var u = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i] && str(users[i].id) === value) { u = users[i]; break; }
      }
      if (!u) {
        for (var j = 0; j < users.length; j++) {
          if (users[j] && str(users[j].username).toLowerCase() === value.toLowerCase()) { u = users[j]; break; }
        }
      }
      if (!u) return; // 本地找不到该账号，不放入分享包
      var uname = sanitizeText(u.username, 40);
      if (!uname || seenP[uname]) return;
      seenP[uname] = 1;
      pkgParticipants.push(uname);
    });

    var pkgGroups = [], seenG = {};
    var groups = dbGroups(db);
    (isArr(exam.participantGroups) ? exam.participantGroups : []).forEach(function (gv) {
      var value = sanitizeText(gv, 40);
      if (!value) return;
      var g = null;
      for (var i = 0; i < groups.length; i++) {
        var item = groups[i];
        if (!item) continue;
        if (str(item.id) === str(gv) || str(item.name).toLowerCase() === value.toLowerCase()) { g = item; break; }
      }
      var gname = g ? (sanitizeText(g.name, 40) || value) : value;
      if (!gname || seenG[gname]) return;
      seenG[gname] = 1;
      pkgGroups.push(gname);
    });

    var audience = AUDIENCES[str(exam.audience)] ? str(exam.audience) : 'all';
    var pkg = {
      v: PACKAGE_VERSION,
      type: TYPE_SHARE,
      createdAt: nowMs(),
      from: currentFrom(),
      exam: {
        title: sanitizeText(exam.title, 100) || '未命名考试',
        desc: sanitizeText(exam.desc, 1000),
        mode: str(exam.mode) === 'fixed' ? 'fixed' : 'random',
        settings: sanitizeSettings(exam.settings),
        audience: audience,
        participants: pkgParticipants,
        participantGroups: pkgGroups,
        fixed: pkgFixed,
        rules: pkgRules
      },
      banks: pkgBanks
    };
    return { ok: true, pkg: pkg };
  }

  function finishEncode(pkg) {
    var code;
    try {
      code = encodePackageText(pkg);
    } catch (e) {
      return failEncode('生成分享码失败：' + ((e && e.message) ? e.message : String(e)));
    }
    var sm = summary(pkg);
    var base = {
      pkg: pkg,
      size: code.length,
      summary: sm,
      large: code.length > MAX_CODE_CHARS,
      tooLarge: false
    };
    if (code.length > MAX_CODE_HARD_CHARS) {
      base.ok = false;
      base.code = '';
      base.reason = '分享码过大（超过 5MB），无法生成分享码，请改用 ' + FILE_EXT +
        ' 分享文件（文件可直接导入）';
      base.tooLarge = true;
      base.large = true;
      return base;
    }
    base.ok = true;
    base.code = code;
    base.reason = '';
    return base;
  }

  /** 从 DB 读取考试并生成分享包 */
  function encodeExam(examId) {
    var id = str(examId).trim();
    if (!id) return failEncode('请指定要分享的考试');
    var db = getDB();
    if (!db) return failEncode('当前工作区数据未就绪，无法生成分享包');
    var exam = findById(db.exams, id);
    if (!exam) return failEncode('考试不存在或已被删除');
    var built = buildPackage(exam, db);
    if (!built.ok) return failEncode(built.reason);
    return finishEncode(built.pkg);
  }

  /** 直接对考试对象编码（便于测试 / 导入导出联动）；dbLike 可传 {banks,questions} */
  function encodeExamObj(exam, dbLike) {
    if (!isObj(exam)) return failEncode('缺少考试信息，无法生成分享包');
    var built = buildPackage(exam, dbLike);
    if (!built.ok) return failEncode(built.reason);
    return finishEncode(built.pkg);
  }

  /* ------------------------------------------------------------------ *
   * 校验 / 解码
   * ------------------------------------------------------------------ */
  function validatePackage(pkg) {
    if (!isObj(pkg)) return { ok: false, reason: '分享包内容不是有效对象' };
    if (pkg.v == null || pkg.v === '') return { ok: false, reason: '分享包缺少版本号（v）' };
    if (Number(pkg.v) !== PACKAGE_VERSION) {
      return {
        ok: false,
        reason: '分享包版本不支持（v=' + str(pkg.v).slice(0, 20) + '，当前支持 v=' + PACKAGE_VERSION + '）'
      };
    }
    if (pkg.type == null || pkg.type === '') return { ok: false, reason: '分享包缺少类型字段（type）' };
    if (pkg.type !== TYPE_SHARE) return { ok: false, reason: '不是智卷考试分享包（type 不匹配）' };
    if (!isObj(pkg.exam)) return { ok: false, reason: '分享包缺少考试信息（exam）' };
    if (!isArr(pkg.banks)) return { ok: false, reason: '分享包缺少题库列表（banks）' };
    if (pkg.exam.fixed != null && !isArr(pkg.exam.fixed)) return { ok: false, reason: '考试信息中 fixed 不是数组' };
    if (pkg.exam.rules != null && !isArr(pkg.exam.rules)) return { ok: false, reason: '考试信息中 rules 不是数组' };
    if (pkg.exam.participants != null && !isArr(pkg.exam.participants)) {
      return { ok: false, reason: '考试信息中 participants 不是数组' };
    }
    if (pkg.exam.participantGroups != null && !isArr(pkg.exam.participantGroups)) {
      return { ok: false, reason: '考试信息中 participantGroups 不是数组' };
    }
    var total = 0;
    var refs = {};
    for (var i = 0; i < pkg.banks.length; i++) {
      var bank = pkg.banks[i], no = i + 1;
      if (!isObj(bank)) return { ok: false, reason: '第 ' + no + ' 个题库不是有效对象' };
      if (typeof bank.ref !== 'string' || !bank.ref.trim()) {
        return { ok: false, reason: '第 ' + no + ' 个题库缺少引用标识（ref）' };
      }
      var ref = bank.ref.trim();
      if (refs[ref]) return { ok: false, reason: '题库引用重复：' + ref.slice(0, 40) };
      refs[ref] = 1;
      if (!isArr(bank.questions)) return { ok: false, reason: '第 ' + no + ' 个题库缺少题目列表（questions）' };
      total += bank.questions.length;
      if (total > MAX_QUESTIONS) {
        return { ok: false, reason: '分享包题目数量过多（超过 ' + MAX_QUESTIONS + ' 题）' };
      }
      for (var j = 0; j < bank.questions.length; j++) {
        var q = bank.questions[j], qno = j + 1;
        if (!isObj(q)) {
          return { ok: false, reason: '题库「' + sanitizeText(bank.name, 30) + '」第 ' + qno + ' 题不是有效题目对象' };
        }
        if (!TYPES[str(q.type)]) {
          return { ok: false, reason: '题库「' + sanitizeText(bank.name, 30) + '」第 ' + qno + ' 题题型不支持：' + str(q.type).slice(0, 20) };
        }
        if (typeof q.stem !== 'string' || !hasVisibleContent(q.stem)) {
          return { ok: false, reason: '题库「' + sanitizeText(bank.name, 30) + '」第 ' + qno + ' 题缺少题干' };
        }
        if (q.type === 'single' || q.type === 'multiple') {
          if (!isArr(q.options) || q.options.length < 2) {
            return { ok: false, reason: '题库「' + sanitizeText(bank.name, 30) + '」第 ' + qno + ' 题选项不足 2 个' };
          }
        }
      }
    }
    if (total === 0) return { ok: false, reason: '分享包中没有题目' };
    return { ok: true, reason: '' };
  }

  function decode(code) {
    var text = str(code).trim();
    if (!text) return { ok: false, reason: '请输入分享码' };
    // 容错：直接粘贴 .zjexam.json 分享文件文本时走 JSON（文件可承载大图片，上限单独放宽）
    if (text.charAt(0) === '{') {
      if (text.length > MAX_FILE_CHARS) {
        return { ok: false, reason: '分享文件过大（超过 20MB），请检查文件是否完整' };
      }
      var pkgJson;
      try { pkgJson = JSON.parse(text); } catch (e) { return { ok: false, reason: '分享文件不是有效的 JSON' }; }
      var vJson = validatePackage(pkgJson);
      return vJson.ok ? { ok: true, pkg: pkgJson } : { ok: false, reason: vJson.reason };
    }
    var raw = text.replace(/\s+/g, '');
    if (!raw) return { ok: false, reason: '分享码为空' };
    if (raw.length > MAX_CODE_HARD_CHARS) {
      return { ok: false, reason: '分享码过大（超过 5MB），请改用 ' + FILE_EXT + ' 分享文件导入' };
    }
    var bytes = base64ToBytes(raw);
    if (!bytes) return { ok: false, reason: '分享码格式不正确（不是有效的 Base64 编码）' };
    var json = bytesToUtf8(bytes);
    if (json == null) return { ok: false, reason: '分享码内容损坏（UTF-8 解码失败）' };
    var pkg;
    try { pkg = JSON.parse(json); } catch (e) { return { ok: false, reason: '分享码内容不是有效的 JSON' }; }
    var v = validatePackage(pkg);
    return v.ok ? { ok: true, pkg: pkg } : { ok: false, reason: v.reason };
  }

  /* ------------------------------------------------------------------ *
   * 导入（先内存构造，全部成功后才一次性写入 DB；不调用 save）
   * ------------------------------------------------------------------ */
  function failImport(reason, warnings) {
    return {
      ok: false, examId: '', bankIds: [], addedQuestions: 0,
      reason: str(reason), warnings: isArr(warnings) ? warnings : []
    };
  }
  function uniqueId(prefix, taken) {
    for (var i = 0; i < 50; i++) {
      var id = makeId(prefix);
      if (id && !taken[id]) { taken[id] = 1; return id; }
    }
    var fallback = str(prefix) + nowMs().toString(36) + Math.random().toString(36).slice(2, 8);
    taken[fallback] = 1;
    return fallback;
  }
  function findUserByUsername(users, username) {
    var uname = str(username).trim().toLowerCase();
    if (!uname) return null;
    for (var i = 0; i < users.length; i++) {
      if (users[i] && str(users[i].username).trim().toLowerCase() === uname) return users[i];
    }
    return null;
  }
  function findGroup(groups, value) {
    var v = str(value).trim().toLowerCase();
    if (!v) return null;
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (!g) continue;
      if (str(g.id) === str(value)) return g;
      if (str(g.name).trim().toLowerCase() === v) return g;
    }
    return null;
  }
  function parseFixedRef(item, bankMap, qKeyMap, qidGlobal) {
    var bankRef = '', qid = '';
    if (isObj(item)) {
      bankRef = str(item.bankRef != null ? item.bankRef : item.ref).trim();
      qid = str(item.qid != null ? item.qid : (item.id != null ? item.id : item.questionId)).trim();
    } else {
      var text = str(item).trim();
      var at = text.indexOf(':');
      if (at >= 0) {
        bankRef = text.slice(0, at).trim();
        qid = text.slice(at + 1).trim();
      } else {
        qid = text;
      }
    }
    if (!qid) return '';
    if (bankRef && bankMap[bankRef] && qKeyMap[bankRef + '\u0000' + qid]) {
      return qKeyMap[bankRef + '\u0000' + qid];
    }
    if (qidGlobal[qid]) return qidGlobal[qid];
    return '';
  }

  function importExam(pkg) {
    var warnings = [];
    var valid = validatePackage(pkg);
    if (!valid.ok) return failImport(valid.reason, warnings);
    var db = getDB();
    if (!db) return failImport('当前工作区数据未就绪，无法导入考试', warnings);
    var me = authCurrent();
    if (!me || !str(me.id)) return failImport('请先登录后再导入考试', warnings);

    var ownerId = str(me.id);
    var ownerName = sanitizeText(me.name, 40) || sanitizeText(me.username, 40) || '用户';
    var fromName = sanitizeText(pkg.from && pkg.from.name, 40) || DEFAULT_FROM;
    var source = SOURCE_PREFIX + fromName;

    /* 现有 id 占用表（防止与工作区已有数据冲突） */
    var takenBankIds = {}, takenQuestionIds = {}, takenExamIds = {};
    db.banks.forEach(function (b) { if (b && b.id) takenBankIds[str(b.id)] = 1; });
    db.questions.forEach(function (q) { if (q && q.id) takenQuestionIds[str(q.id)] = 1; });
    db.exams.forEach(function (e) { if (e && e.id) takenExamIds[str(e.id)] = 1; });

    var newBanks = [], newQuestions = [], bankIds = [];
    var bankMap = {};     // 包内 ref → 新 bankId
    var qKeyMap = {};     // ref + \0 + 包内题目 id → 新题目 id
    var qidGlobal = {};   // 包内题目 id → 新题目 id（fixed 未带 bankRef 时的兜底）

    for (var i = 0; i < pkg.banks.length; i++) {
      var pkgBank = pkg.banks[i];
      var ref = str(pkgBank.ref).trim();
      var bankName = sanitizeText(pkgBank.name, 60) || '导入题库';
      var bankId = uniqueId('bank_', takenBankIds);
      var created = false, invalidCount = 0;
      for (var j = 0; j < pkgBank.questions.length; j++) {
        var pkgQ = pkgBank.questions[j];
        var core = normalizeQuestionCore(pkgQ);
        if (!core) { invalidCount++; continue; }
        if (!created) {
          var bank = {
            id: bankId,
            name: bankName,
            desc: sanitizeText(pkgBank.desc, 200),
            ownerId: ownerId,
            ownerName: ownerName,
            access: 'private',
            viewers: [],
            viewerGroups: [],
            hidden: true,           // 隐藏题库：不出现在题库管理、不可编辑
            createdAt: nowMs(),
            updatedAt: nowMs()
          };
          newBanks.push(bank);
          bankIds.push(bankId);
          bankMap[ref] = bankId;
          created = true;
        }
        var qid = uniqueId('q_', takenQuestionIds);
        var item = {
          id: qid,
          bankId: bankId,
          type: core.type,
          stem: core.stem,
          options: core.options,
          answer: core.answer,
          analysis: core.analysis,
          score: core.score,
          difficulty: core.difficulty,
          category: core.category,
          tags: core.tags,
          source: source,
          importedAt: nowMs()
        };
        item = finalizeLocalQuestion(item);
        newQuestions.push(item);
        var pkgQid = str(pkgQ && pkgQ.id) || ('q' + j);
        qKeyMap[ref + '\u0000' + pkgQid] = qid;
        if (!qidGlobal[pkgQid]) qidGlobal[pkgQid] = qid;
      }
      if (!created) {
        warnings.push('题库「' + bankName + '」没有可导入的有效题目，已跳过');
      } else if (invalidCount > 0) {
        warnings.push('题库「' + bankName + '」有 ' + invalidCount + ' 道无效题目，已跳过');
      }
    }

    if (!newQuestions.length) {
      return failImport('分享包中没有可导入的有效题目', warnings);
    }

    /* 参与者：包内 username → 当前系统 userId */
    var users = authUsers();
    var audience = AUDIENCES[str(pkg.exam.audience)] ? str(pkg.exam.audience) : 'all';
    var participants = [], seenP = {};
    (isArr(pkg.exam.participants) ? pkg.exam.participants : []).forEach(function (pv) {
      var uname = sanitizeText(pv, 40);
      if (!uname) return;
      var u = findUserByUsername(users, uname);
      if (u && u.id && !seenP[str(u.id)]) {
        seenP[str(u.id)] = 1;
        participants.push(str(u.id));
      } else if (!u) {
        warnings.push('参与者「' + uname + '」在当前系统中不存在，已移除');
      }
    });
    if (audience === 'users' && !participants.length) {
      warnings.push('指定参与者均未匹配到当前系统的用户，考试将暂无人可参加');
    }

    /* 群组：包内群名 → 当前 DB.groups 的群名 */
    var groups = dbGroups(db);
    var participantGroups = [], seenG = {};
    (isArr(pkg.exam.participantGroups) ? pkg.exam.participantGroups : []).forEach(function (gv) {
      var gname = sanitizeText(gv, 40);
      if (!gname) return;
      var g = findGroup(groups, gv);
      if (g) {
        var canonical = sanitizeText(g.name, 40) || gname;
        if (!seenG[canonical]) { seenG[canonical] = 1; participantGroups.push(canonical); }
      } else {
        warnings.push('群组「' + gname + '」在当前系统中不存在，已移除');
      }
    });
    if (audience === 'groups' && !participantGroups.length) {
      warnings.push('指定群组均未匹配到当前系统的群组，考试将暂无人可参加');
    }

    /* fixed：包内引用 → 新题目 id */
    var fixed = [], seenFixed = {};
    var droppedFixed = 0;
    (isArr(pkg.exam.fixed) ? pkg.exam.fixed : []).forEach(function (item) {
      var qid = parseFixedRef(item, bankMap, qKeyMap, qidGlobal);
      if (!qid) { droppedFixed++; return; }
      if (seenFixed[qid]) return;
      seenFixed[qid] = 1;
      fixed.push(qid);
    });
    if (droppedFixed > 0) {
      warnings.push('固定试卷中有 ' + droppedFixed + ' 道题未找到对应导入题目，已跳过');
    }

    /* rules：bankRef → 新 bankId */
    var rules = [], droppedRules = 0;
    (isArr(pkg.exam.rules) ? pkg.exam.rules : []).forEach(function (r) {
      var bankRef = str(isObj(r) ? r.bankRef : '').trim();
      var bankId = bankRef ? bankMap[bankRef] : '';
      if (bankRef && !bankId) { droppedRules++; return; }
      var out = sanitizeRuleOut(r);
      out.bankId = bankId || '';
      rules.push(out);
    });
    if (droppedRules > 0) {
      warnings.push('抽题规则中有 ' + droppedRules + ' 条引用的题库未导入，已跳过');
    }

    var title = sanitizeText(pkg.exam.title, 100) || '未命名考试';
    if (title.slice(-IMPORT_TITLE_SUFFIX.length) !== IMPORT_TITLE_SUFFIX) title += IMPORT_TITLE_SUFFIX;
    var exam = {
      id: uniqueId('ex_', takenExamIds),
      title: title,
      desc: sanitizeText(pkg.exam.desc, 1000),
      status: 'draft',
      mode: str(pkg.exam.mode) === 'fixed' ? 'fixed' : 'random',
      settings: sanitizeSettings(pkg.exam.settings),
      fixed: fixed,
      rules: rules,
      audience: audience,
      participants: participants,
      participantGroups: participantGroups,
      ownerId: ownerId,
      ownerName: ownerName,
      createdAt: nowMs(),
      updatedAt: nowMs()
    };
    var normalized = run(function () {
      return typeof normalizeExam === 'function' ? normalizeExam(exam) : undefined;
    });
    if (!isObj(normalized)) normalized = builtinNormalizeExam(exam);
    // 强制保留导入语义（全局 normalize 版本可能不认识 groups / 新字段）
    normalized.id = exam.id;
    normalized.title = exam.title;
    normalized.desc = exam.desc;
    normalized.status = 'draft';
    normalized.mode = exam.mode;
    normalized.settings = sanitizeSettings(isObj(normalized.settings) ? normalized.settings : exam.settings);
    normalized.fixed = fixed;
    normalized.rules = rules;
    normalized.audience = audience;
    normalized.participants = participants;
    normalized.participantGroups = participantGroups;
    normalized.ownerId = ownerId;
    normalized.ownerName = ownerName;
    exam = normalized;

    /* 全部构造成功，一次性写入 DB（不调用 save） */
    for (var b = 0; b < newBanks.length; b++) db.banks.push(newBanks[b]);
    for (var q = 0; q < newQuestions.length; q++) db.questions.push(newQuestions[q]);
    db.exams.push(exam);

    return {
      ok: true,
      examId: str(exam.id),
      bankIds: bankIds,
      addedQuestions: newQuestions.length,
      reason: '',
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ *
   * 文件 / 摘要
   * ------------------------------------------------------------------ */
  function buildExamFile(pkg) {
    if (!isObj(pkg)) return '';
    try { return JSON.stringify(pkg); } catch (e) { return ''; }
  }

  function summary(pkg) {
    var out = {
      title: '', questionCount: 0, bankCount: 0, imageCount: 0,
      fromName: '', audience: 'all'
    };
    if (!isObj(pkg)) return out;
    var banks = isArr(pkg.banks) ? pkg.banks : [];
    out.bankCount = banks.length;
    var total = 0, images = 0;
    for (var i = 0; i < banks.length; i++) {
      var qs = isArr(banks[i] && banks[i].questions) ? banks[i].questions : [];
      total += qs.length;
      for (var j = 0; j < qs.length; j++) images += countImagesInQuestion(qs[j]);
    }
    out.questionCount = total;
    out.imageCount = images;
    out.title = sanitizeText(pkg.exam && pkg.exam.title, 100);
    out.fromName = sanitizeText(pkg.from && pkg.from.name, 40) || DEFAULT_FROM;
    out.audience = AUDIENCES[str(pkg.exam && pkg.exam.audience)] ? str(pkg.exam.audience) : 'all';
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 导出
   * ------------------------------------------------------------------ */
  return {
    PACKAGE_VERSION: PACKAGE_VERSION,
    TYPE: TYPE_SHARE,
    FILE_EXT: FILE_EXT,
    MAX_QUESTIONS: MAX_QUESTIONS,
    MAX_CODE_CHARS: MAX_CODE_CHARS,
    MAX_CODE_HARD_CHARS: MAX_CODE_HARD_CHARS,
    MAX_FILE_CHARS: MAX_FILE_CHARS,
    LARGE_CODE_CHARS: LARGE_CODE_CHARS,
    encodeExam: encodeExam,
    encodeExamObj: encodeExamObj,
    decode: decode,
    validatePackage: validatePackage,
    importExam: importExam,
    buildExamFile: buildExamFile,
    summary: summary,
    _test: {
      sanitizeRich: sanitizeRich,
      sanitizeText: sanitizeText,
      fallbackClean: fallbackClean,
      plainText: plainText,
      hasVisibleContent: hasVisibleContent,
      sanitizeSettings: sanitizeSettings,
      normalizeQuestionCore: normalizeQuestionCore,
      base64ToBytes: base64ToBytes,
      bytesToUtf8: bytesToUtf8,
      utf8Bytes: utf8Bytes,
      encodePackageText: encodePackageText
    }
  };
})();

function imageBytesOf(html){
  const m = String(html || '').match(/data:image\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g);
  return m ? Math.round(m.reduce((n, x) => n + x.length, 0) * 0.75) : 0;
}
function dataUsage(){
  const size = storageSize();
  let imgBytes = 0, qBytes = 0;
  try{
    const s = JSON.stringify(DB);
    const m = s.match(/data:image\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g);
    if(m) imgBytes = Math.round(m.reduce((n, x) => n + x.length, 0) * 0.75);
    qBytes = Math.max(0, Math.round(s.length * 2) - imgBytes);
  }catch(e){}
  const perBank = (amAdmin() ? DB.banks : myBanks()).map(b => {
    const qs = DB.questions.filter(q => q.bankId === b.id);
    let bytes = 0;
    qs.forEach(q => {
      bytes += imageBytesOf(q.stem) + imageBytesOf(q.analysis) + (q.options || []).reduce((n, o) => n + imageBytesOf(o.text), 0);
    });
    return { id:b.id, name:b.name, count:qs.length, imgBytes:bytes };
  }).sort((a, b) => b.imgBytes - a.imgBytes);
  return { size, imgBytes, qBytes, perBank, total:size };
}

function scopedDB(){
  if(amAdmin()) return DB;
  const banks = myBanks().concat(DB.banks.filter(b => b.hidden && b.ownerId === meId()));
  const bankIds = new Set(banks.map(b => b.id));
  const exams = myExams();
  const examIds = new Set(exams.map(e => e.id));
  return {
    version:5,
    banks,
    questions: DB.questions.filter(q => bankIds.has(q.bankId)),
    exams,
    responses: DB.responses.filter(r => examIds.has(r.examId) || r.userId === meId()),
    meta: DB.meta
  };
}
function buildSharedHtml(){
  if(typeof ONLINE !== 'undefined' && ONLINE && ONLINE.enabled) return '';
  if(!amAdmin()) return '';
  let html = window.__ZJ_SOURCE_HTML__;
  if(!html){
    try{ html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML; }catch(e){ return ''; }
  }
  const snap = { v:1, exportedAt:now(), db:DB, users:USERS, groups:DB.groups || [] };
  let json = JSON.stringify(snap);
  json = json.replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  const tag = '<script id="zj-embedded-data" type="application/json">' + json + '</' + 'script>\n';
  const appStart = html.indexOf('<script>');
  if(appStart >= 0){
    // 只清理应用脚本之前的旧快照，避免误删应用脚本源码中的同名字符串
    const prefix = html.slice(0, appStart).replace(/<script id="zj-embedded-data"[\s\S]*?<\/script>\s*/i, '');
    html = prefix + tag + html.slice(appStart);
  } else {
    html = html.replace('</body>', tag + '</body>');
  }
  return html;
}
function exportSharedHtml(){
  if(typeof ONLINE !== 'undefined' && ONLINE && ONLINE.enabled) return toast('在线版请直接分享网站地址；离线分享 HTML 请在离线版使用', 'bad');
  if(!amAdmin()) return toast('仅管理员可导出含全部账号与数据的分享版 HTML', 'bad');
  const html = buildSharedHtml();

}

function exportAllQuestionsCSV(){
  const rows = [['题库','题型','题干','选项','正确答案','解析','分值','难度','知识点','标签','图片数']];
  scopedDB().questions.forEach(q => {
    const ans = q.type === 'fill'
      ? (q.answer || []).map(l => (Array.isArray(l) ? l : [l]).join('|')).join(' / ')
      : (Array.isArray(q.answer) ? q.answer.join('') : q.answer);
    rows.push([
      B(q.bankId)?.name || '', TYPES[q.type] || '', plainOf(q.stem),
      (q.options || []).map(o => o.key + '.' + plainOf(o.text)).join(' | '),
      typeof ans === 'string' ? plainOf(ans) : ans,
      plainOf(q.analysis), q.score, q.difficulty, q.category,
      (q.tags || []).join(' '), countImages(q.stem) + countImages(q.analysis) + (q.options || []).reduce((s, o) => s + countImages(o.text), 0)
    ]);
  });
  download(`智卷-全部题目-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows));
  toast(`已导出 ${DB.questions.length} 道题目`);
}
function exportAllResponsesCSV(){
  const rows = [['考试','考生','手机号','单位','得分','总分','得分率','是否及格','用时(秒)','切屏次数','交卷时间']];
  scopedDB().responses.filter(r => r.status === 'submitted' && !r.preview).forEach(r => {
    const ex = E(r.examId); if(!ex) return;
    const full = fullOfPaper(r.paper) || 1;
    const p = +(Number(r.score) || 0) / full * 100;
    rows.push([ex.title, r.examinee?.name || '', r.examinee?.tel || '', r.examinee?.org || '',
      Number(r.score) || 0, full, p.toFixed(1) + '%', p >= (ex.settings.passScore || 60) ? '及格' : '不及格',
      r.durationSec || 0, r.switchCount || 0, fmtDate(r.submittedAt)]);
  });
  download(`智卷-全部答卷-${new Date().toISOString().slice(0, 10)}.csv`, toCSV(rows));
  toast('已导出答卷成绩');
}

function filteredQuestions(bankId){
  const f = UI.qf;
  const kw = (f.kw || '').trim().toLowerCase();
  return DB.questions.filter(q => {
    if(q.bankId !== bankId) return false;
    if(f.type && q.type !== f.type) return false;
    if(f.diff && String(q.difficulty) !== f.diff) return false;
    if(f.cat && q.category !== f.cat) return false;
    if(f.issue === 'ok' && !isQuestionValid(q)) return false;
    if(f.issue === 'bad' && isQuestionValid(q)) return false;
    if(kw){
      const hay = (plainOf(q.stem) + ' ' + plainOf(q.analysis) + ' ' + (q.category || '') + ' ' + (q.tags || []).join(' ')).toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
}
function bankPager(total, page){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  page = Math.min(pages, Math.max(1, page));
  if(pages <= 1) return '';
  const btn = (p, label, disabled) => `<button type="button" class="btn sm pg ${p === page ? 'on' : ''}" data-act="qf.page" data-arg="${p}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  let html = btn(page - 1, '上一页', page <= 1);
  const start = Math.max(1, page - 2), end = Math.min(pages, start + 4);
  for(let i = start; i <= end; i++) html += btn(i, String(i), false);
  html += btn(page + 1, '下一页', page >= pages);
  return `<div class="pager">共 ${total} 题，第 ${page} / ${pages} 页 ${html}</div>`;
}

    <button type="button" class="btn" data-act="modal.close">取消</button>
    <button type="button" class="btn primary" data-act="share.import.do" data-arg="${esc(targetBankId || '')}">确认导入</button>`, {
    wide:true,
    onMount(m){
      const ta = m.querySelector('#share-input');
      const file = m.querySelector('#share-file');
      const paint = () => { const p = m.querySelector('#share-preview'); if(p) p.innerHTML = sharePreviewHtml(ta.value); };
      ta.addEventListener('input', paint);
      file.addEventListener('change', () => {

        const fr = new FileReader();
        fr.onload = () => { ta.value = String(fr.result || ''); paint(); };

      });

function doShareImport(targetBankId){
  const ta = $('#share-input');
  const code = (ta && ta.value || '').trim();
  if(!code) return toast('请粘贴分享码或选择分享文件', 'bad');
  const r = SHARE.decode(code);
  if(!r.ok) return toast(r.reason || '分享码无效', 'bad');
  const summary = SHARE.packageSummary(r.pkg);
  confirmModal('导入分享题库', `将从「${esc(summary.fromName)}」导入 <b>${esc(summary.bankName)}</b>（${summary.count} 题，${summary.imageCount} 张图片）${targetBankId ? '到当前题库' : '为新题库'}。重复题干会自动跳过。确定吗？`, () => {
    const backup = JSON.stringify(DB);
    const res = SHARE.importPackage(r.pkg, targetBankId ? { bankId:targetBankId } : {});
    if(!res.ok){ DB = JSON.parse(backup); return toast(res.reason || '导入失败', 'bad'); }
    if(!save()){ DB = JSON.parse(backup); return; }
    closeModal();
    if(!targetBankId && res.bankId) go('#/bank/' + res.bankId); else render();
    toast(`已导入 ${res.added} 题${res.skipped ? '，跳过重复 ' + res.skipped + ' 题' : ''}${res.images ? '，含 ' + res.images + ' 张图片' : ''}`);
  }, { okText:'确认导入' });
}

function saveBankForm(id){
  const name = ($('#bank-name')?.value || '').trim();
  if(!name) return toast('请填写题库名称', 'bad');
  const desc = ($('#bank-desc')?.value || '').trim();
  const access = ($('#bank-access')?.value || 'private');
  const viewers = Array.from(document.querySelectorAll('.bank-viewer')).filter(el => el.checked).map(el => el.value);
  const viewerGroups = Array.from(document.querySelectorAll('.bank-viewer-group')).filter(el => el.checked).map(el => el.value);
  const old = B(id);
  if(old && !canEditBank(old)) return toast('无权限：只有题库创建者或管理员可以编辑', 'bad');
  if(old){
    old.name = name; old.desc = desc; old.access = ['public','users','private'].includes(access) ? access : 'private';
    old.viewers = old.access === 'users' ? viewers : [];
    old.viewerGroups = old.access === 'users' ? viewerGroups : [];
    old.updatedAt = now();
  } else {
    const me = (typeof AUTH !== 'undefined' && AUTH.current) ? AUTH.current() : null;
    DB.banks.push(normalizeBank({
      id, name, desc, access, viewers, viewerGroups,
      ownerId: me ? me.id : '', ownerName: me ? me.name : '',
      createdAt: now(), updatedAt: now()
    }));
  }
  if(!save()) return;
  closeModal(); render(); toast(old ? '题库已更新' : '题库已创建');
}

function qformHost(){ return $('#modal-root'); }
function qformOptRows(d){

    if(d.type === 'judge'){
      return `<div class="q-opt-row">
        <span class="key">${key}</span>
        <div class="opt-body"><div style="padding:9px 2px;color:#3a4560">${esc(plainOf(o.text) || (key === 'A' ? '正确' : '错误'))}</div></div>
        <label class="pick"><input type="radio" name="qcorrect" class="qf-correct" value="${key}" ${checked ? 'checked' : ''}> 正确答案</label>

    return `<div class="q-opt-row" data-oi="${i}">
      <span class="key">${key}</span>

      <label class="pick"><input type="${isMulti ? 'checkbox' : 'radio'}" ${isMulti ? '' : 'name="qcorrect"'} class="qf-correct" value="${key}" ${checked ? 'checked' : ''}> 正确</label>

      <span class="fld-label">题干${d.type === 'fill' ? '（用 ______ 标记空格）' : ''}</span>

function syncQForm(){
  if(!QF) return;
  const host = qformHost();
  if(!host) return;
  const d = QF.draft;
  d.stem = RT.get(host, 'stem');
  d.analysis = RT.get(host, 'analysis');
  const scoreEl = $('#qf-score', host);
  if(scoreEl) d.score = Math.max(0, Number(scoreEl.value) || 0);
  const diffEl = $('#qf-diff', host);
  if(diffEl) d.difficulty = Number(diffEl.value) || 1;
  const catEl = $('#qf-cat', host);
  if(catEl) d.category = catEl.value.trim();
  const tagEl = $('#qf-tags', host);
  if(tagEl) d.tags = tagEl.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
  const rows = $$('#qform-opts .q-opt-row', host);
  if(rows.length && ['single','multiple','judge'].includes(d.type)){
    d.options = rows.map((row, i) => {
      const key = LETTERS[i];
      let text;
      if(d.type === 'judge'){
        text = $('.opt-body', row) ? ($('.opt-body', row).textContent || '') : '';
        text = key === 'A' ? '正确' : '错误';
      } else {
        text = RT.get(host, 'opt:' + i);
      }
      return { key, text };
    });
    if(d.type === 'multiple'){
      d.answer = $$('#qform-opts .qf-correct:checked', host).map(x => x.value);
    } else {
      const c = $('#qform-opts .qf-correct:checked', host);
      d.answer = c ? c.value : '';
    }
  }
  if(d.type === 'fill'){
    const el = $('#qf-fill', host);
    if(el){
      const arr = el.value.split('\n').map(l => l.split(/[|｜]/).map(s => s.trim()).filter(Boolean));
      while(arr.length && !arr[arr.length - 1].length) arr.pop();
      d.answer = arr.length ? arr : [[]];
    }
  }
  if(d.type === 'short'){
    d.answer = RT.get(host, 'shortanswer');
  }
}
function changeQType(t){
  syncQForm();
  const d = QF.draft;
  d.type = t;
  if((t === 'single' || t === 'multiple') && (!Array.isArray(d.options) || d.options.length < 2)){
    d.options = [{ key:'A', text:'' }, { key:'B', text:'' }, { key:'C', text:'' }, { key:'D', text:'' }];
  }
  if((t === 'single' || t === 'multiple') && Array.isArray(d.options)){
    d.options = d.options.map((o, i) => ({ key:LETTERS[i], text:(o && o.text) || '' }));
  }
  if(t === 'judge'){
    d.options = [{ key:'A', text:'正确' }, { key:'B', text:'错误' }];
    if(!['A','B'].includes(d.answer)) d.answer = 'A';
  } else if(t === 'single'){
    if(Array.isArray(d.answer)) d.answer = d.answer.length && typeof d.answer[0] === 'string' ? d.answer[0] : '';
    if(typeof d.answer !== 'string') d.answer = '';
    if(!d.options.some(o => o.key === d.answer)) d.answer = 'A';
  } else if(t === 'multiple'){
    if(!Array.isArray(d.answer)) d.answer = d.answer ? [String(d.answer)] : [];
    d.answer = d.answer.filter(k => typeof k === 'string' && d.options.some(o => o.key === k));
  } else if(t === 'fill'){
    if(!Array.isArray(d.answer) || (d.answer.length && !Array.isArray(d.answer[0]))) d.answer = [[]];
    d.options = [];
  } else if(t === 'short'){
    if(Array.isArray(d.answer)) d.answer = '';
    d.options = [];
  }
  paintQForm();
}
function saveQuestion(){
  syncQForm();
  const d = QF.draft;
  if(isBlankRich(d.stem)) return toast('请填写题干', 'bad');
  if(['single','multiple','judge'].includes(d.type)){
    if(d.type !== 'judge'){
      d.options = d.options.map(o => ({ key:o.key, text:(o.text || '').trim() }));
      const blank = d.options.findIndex(o => isBlankRich(o.text));
      if(blank >= 0) return toast(`选项 ${LETTERS[blank]} 内容为空，请填写或删除该选项`, 'bad');
      if(d.options.length < 2) return toast('至少需要 2 个有效选项', 'bad');
    }
    d.options = d.options.map((o, i) => ({ key:LETTERS[i], text:o.text }));
    if(d.type === 'single' || d.type === 'judge'){
      if(!d.options.some(o => o.key === d.answer)) return toast('请勾选正确答案', 'bad');
    } else {
      if(!Array.isArray(d.answer) || !d.answer.length) return toast('请至少勾选一个正确答案', 'bad');
      if(!d.answer.every(k => d.options.some(o => o.key === k))) return toast('正确答案与选项不匹配，请重新勾选', 'bad');
    }
  }
  if(d.type === 'fill'){
    d.answer = (d.answer || []).map(l => (Array.isArray(l) ? l : [l]));
    if(!d.answer.length || d.answer.every(l => !l.length)) return toast('请填写填空答案', 'bad');
  }
  if(!(Number(d.score) > 0)) return toast('请设置大于 0 的分值', 'bad');
  const q = normalizeQuestion(d);
  q.updatedAt = now();
  q.updatedBy = (typeof AUTH !== 'undefined' && AUTH.current) ? AUTH.current().id : '';
  if(QF.isNew) DB.questions.push(q);
  else {
    const old = Q(d.id);
    if(old) Object.assign(old, q); else DB.questions.push(q);
  }
  if(!save()) return;
  closeModal();
  render();
  toast(QF.isNew ? '题目已保存' : '题目已更新');
}

/* ---------- CSV（含图片）/ 题库 JSON 导入导出 ---------- */
/** 富文本 → 纯文本，图片替换为 [[IMG:n]] 并收集到 map（按出现顺序编号） */
function richToCsvText(html, imageMap){
  if(html == null || html === '') return '';
  const box = document.createElement('div');
  box.innerHTML = renderRich(html);
  const parts = [];
  let next = Object.keys(imageMap).length + 1;
  const walk = node => {
    if(node.nodeType === 3){ parts.push(node.nodeValue); return; }
    if(node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if(tag === 'img'){
      const src = node.getAttribute('src') || '';
      if(/^data:image\//i.test(src)){
        const key = String(next++);
        imageMap[key] = src;
        parts.push('[[IMG:' + key + ']]');
      } else parts.push('[图片]');
      return;
    }
    if(tag === 'br'){ parts.push('\n'); return; }
    const block = ['p','div','li','ul','ol','tr'].includes(tag);
    if(block && parts.length && parts[parts.length - 1] !== '\n') parts.push('\n');
    Array.from(node.childNodes).forEach(walk);
    if(block) parts.push('\n');
  };
  Array.from(box.childNodes).forEach(walk);
  return parts.join('').replace(/\n{3,}/g, '\n\n').trim();
}
function buildQuestionsCsvWithImages(bankId){
  const list = bankQuestions(bankId);
  const rows = [['题型','题干','选项','正确答案','解析','分值','难度','知识点','标签','图片映射']];
  list.forEach(q => {
    const map = {};
    const stem = richToCsvText(q.stem, map);
    const opts = (q.options || []).map(o => o.key + '. ' + richToCsvText(o.text, map)).join(' | ');
    const ana = richToCsvText(q.analysis, map);
    let ans;
    if(q.type === 'fill') ans = (q.answer || []).map(l => (Array.isArray(l) ? l : [l]).join('|')).join(' / ');
    else if(q.type === 'multiple') ans = (q.answer || []).join('');
    else if(q.type === 'short') ans = richToCsvText(typeof q.answer === 'string' ? q.answer : '', map);
    else ans = String(q.answer == null ? '' : q.answer);
    rows.push([TYPES[q.type], stem, opts, ans, ana, q.score, q.difficulty, q.category || '', (q.tags || []).join(' '), Object.keys(map).length ? JSON.stringify(map) : '{}']);
  });
  return toCSV(rows);
}
function exportQuestionsWithImages(bankId){
  const bank = B(bankId);
  const csv = buildQuestionsCsvWithImages(bankId);
  let size = 0;
  try{ size = new Blob([csv]).size; }catch(e){ size = csv.length * 2; }
  download(`题库-${bank ? bank.name : 'export'}-含图片.csv`, csv);

function parseBankJsonText(text){
  if(typeof IMP !== 'undefined' && IMP && typeof IMP.parseBankJson === 'function') return IMP.parseBankJson(text);
  const obj = JSON.parse(text);
  if(Array.isArray(obj)) return { bank:{}, questions:obj, warnings:['检测到裸题目数组'] };
  return { bank:obj.bank || {}, questions:Array.isArray(obj.questions) ? obj.questions : [], warnings:[] };
}
function pickLocalFile(accept, cb){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept || '.json,application/json';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    input.remove();
    if(f) cb(f);
  });
  document.body.appendChild(input);
  input.click();
}
function importBankJson(file, bankId, createNew){
  const fr = new FileReader();
  fr.onload = () => {
    let parsed;
    try{ parsed = parseBankJsonText(String(fr.result || '')); }catch(e){ return toast('JSON 解析失败：' + (e.message || e), 'bad'); }
    const qs = parsed.questions || [];
    if(!qs.length) return toast('JSON 中没有可导入的题目', 'bad');
    const imageCount = qs.reduce((n, d) => n + countImages(d.stem) + countImages(d.analysis) + (d.options || []).reduce((m, o) => m + countImages(o.text), 0), 0);
    const targetName = createNew ? (parsed.bank && parsed.bank.name ? parsed.bank.name : file.name.replace(/\.json$/i, '') || '导入题库') : (B(bankId)?.name || '当前题库');
    const warn = (parsed.warnings || []).slice(0, 3).join('；');
    confirmModal(createNew ? '导入为新题库' : '导入题目到当前题库', `
      <p>解析到 <b>${qs.length}</b> 道题${imageCount ? `，含 <b>${imageCount}</b> 张图片` : ''}，目标：<b>${esc(targetName)}</b>。</p>
      ${warn ? `<p class="muted">${esc(warn)}</p>` : ''}
      <p class="muted">重复题干会自动跳过；图片以 Base64 保存在本地。</p>`, () => {
      let targetBankId = bankId;
      if(createNew){
        let name = targetName;
        while(DB.banks.some(b => b.name === name)) name += '（导入）';
        const me = (typeof AUTH !== 'undefined' && AUTH.current) ? AUTH.current() : null;
        const nb = { id:uid('bank_'), name, desc:(parsed.bank && parsed.bank.desc) || '', ownerId:me ? me.id : '', ownerName:me ? me.name : '', access:'private', viewers:[], createdAt:now(), updatedAt:now() };
        DB.banks.push(nb);
        targetBankId = nb.id;
      }
      const existing = new Set(DB.questions.filter(q => q.bankId === targetBankId).map(q => norm(plainOf(q.stem))));
      let added = 0, skipped = 0;
      qs.forEach(d => {
        if(!d || isBlankRich(d.stem)) return;
        const key = norm(plainOf(d.stem));
        if(existing.has(key)){ skipped++; return; }
        existing.add(key);
        const q = normalizeQuestion(Object.assign({}, d, {
          id: uid('q_'), bankId:targetBankId,
          source: d.source || file.name, importedAt: now()
        }));
        DB.questions.push(q); added++;
      });
      if(!added) return toast('没有新增题目（全部重复或无效）', 'warn');
      if(!save()) return;
      closeModal();
      if(createNew) go(`#/bank/${targetBankId}`); else render();
      toast(`已导入 ${added} 题${skipped ? `，跳过重复 ${skipped} 题` : ''}`);
    }, { okText:'确认导入' });
  };
  fr.onerror = () => toast('读取文件失败', 'bad');
  fr.readAsText(file);
}

    <input data-f="count" type="number" min="1" value="${r.count}">
    <button type="button" class="btn sm danger" data-act="exam.rule.del" data-arg="${i}">删除</button>
  </div>`).join('');
  const fixedList = (d.fixed || []).map((qid, i) => {
    const q = Q(qid);
    if(!q) return '';
    const bad = !isQuestionValid(q);
    return `<div class="fixed-row">
      <span class="badge t-${q.type}">${TYPES[q.type]}</span>
      <span class="stemtxt">${i + 1}. ${esc(trunc(plainOf(q.stem), 60))}${imageFlag(q)}${bad ? ' <span class="badge t-short">待完善</span>' : ''}</span>
      <span class="muted nowrap">${q.score} 分</span>
      <span class="row tight">
        <button type="button" class="btn sm ghost" data-act="exam.fixed.up" data-arg="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="btn sm ghost" data-act="exam.fixed.down" data-arg="${i}" ${i === (d.fixed || []).length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="btn sm danger" data-act="exam.fixed.del" data-arg="${i}">移除</button>
      </span>
    </div>`;
  }).join('');

  const total = d.mode === 'fixed' ? (d.fixed || []).reduce((n, qid) => n + (Q(qid)?.score || 0), 0) : estFull(d);
  const count = planCount(d);
  const wanted = wantedCount(d);
  const badCount = DB.questions.filter(q => !isQuestionValid(q)).length;
  const invalidFixed = d.mode === 'fixed' ? (d.fixed || []).filter(qid => { const q = Q(qid); return q && !isQuestionValid(q); }).length : 0;
  const shortfall = wanted > count;

  return `<header class="page-head">
    <div><a href="#/exams" class="sub">← 返回考试管理</a><h1>考试设置</h1>
      <p class="sub">组卷、时间、次数、防作弊与展示策略 · 预计 ${count} 题 / 约 ${total} 分${shortfall ? `（规则期望 ${wanted} 题，题库完整题不足）` : ''} · 已产生 ${used} 份有效答卷</p></div>
    <div class="row">
      <a class="btn" href="#/exam/${id}/paper">打印试卷</a>
      <a class="btn" href="#/exam/${id}/paper?answers=1">打印答案卷</a>
      <a class="btn" href="#/exam/${id}/result">查看成绩</a>
      <a class="btn" href="#/exam/${id}/publish">发布 / 分享</a>
      <button type="button" class="btn primary" data-act="exam.save" data-arg="${id}">保存设置</button>
    </div>
  </header>
  ${badCount ? `<div class="alert warn">当前题库共有 <b>${badCount}</b> 道待完善题目（缺答案/空选项），组卷时会自动跳过。${invalidFixed ? `本固定试卷中有 <b>${invalidFixed}</b> 道待完善题目不会出现在试卷中。` : ''} 可到题库按「待完善」筛选补全。</div>` : ''}
  ${shortfall ? `<div class="alert info">按当前抽题规则期望 <b>${wanted}</b> 题，但题库中符合条件的完整题目只有 <b>${count}</b> 题，实际组卷会减少。建议补充题目或调整规则。</div>` : ''}

  <section class="panel">
    <h2>基本信息</h2>
    <label class="fld"><span>考试名称（必填）</span><input id="ex-title" value="${esc(d.title)}" placeholder="如：2026 年度安全知识考试"></label>
    <label class="fld"><span>考试说明（展示给考生）</span><textarea id="ex-desc" rows="3" placeholder="考试范围、注意事项、纪律要求等">${esc(d.desc || '')}</textarea></label>
  </section>

  <section class="panel">
    <h2>考试对象</h2>
    <div class="form-grid">
      <label class="fld"><span>参与者范围</span>
        <select id="ex-audience">
          <option value="all" ${d.audience !== 'self' && d.audience !== 'users' && d.audience !== 'groups' ? 'selected' : ''}>所有用户（默认）</option>
          <option value="self" ${d.audience === 'self' ? 'selected' : ''}>仅自己</option>
          <option value="users" ${d.audience === 'users' ? 'selected' : ''}>指定参与者</option>
          <option value="groups" ${d.audience === 'groups' ? 'selected' : ''}>指定用户群</option>
        </select>
      </label>
    </div>
    <div class="fld"><span class="fld-label">指定参与者（仅“指定参与者”生效）</span>
      <div class="bank-viewers">${participantBox}</div>
    </div>
    <div class="fld"><span class="fld-label">指定用户群（仅“指定用户群”生效，成员由管理员手动设置）</span>
      <div class="bank-viewers">${groupBox}</div>
    </div>
    <p class="fld-help">发布后，只有符合考试对象的用户能在工作台「待考试列表」和考试中心看到该考试；管理员可查看全部考试。</p>
  </section>

  <section class="panel">
    <h2>组卷方式</h2>
    ${frozen ? `<div class="alert info">本题考试由导入生成，题库为<b>只读快照</b>，不支持查看或编辑题库/题目；可调整考试名称、时间、次数、考试对象后发布。</div>`
    : `<div class="row" style="margin-bottom:12px">
      <label class="checkline"><input type="radio" name="ex-mode" value="random" ${d.mode === 'random' ? 'checked' : ''} data-t="exam-mode"> 随机抽题</label>
      <label class="checkline"><input type="radio" name="ex-mode" value="fixed" ${d.mode === 'fixed' ? 'checked' : ''} data-t="exam-mode"> 固定试卷</label>
      <span class="muted">随机模式每个考生抽题不同；固定模式所有人同一套题。</span>
    </div>
    ${d.mode === 'random' ? `
      <div class="rule-head"><span>题库</span><span>题型</span><span>分类</span><span>难度</span><span>题量</span><span></span></div>
      ${ruleRows || '<p class="muted">还没有抽题规则，添加后会按规则随机组卷。</p>'}
      <button type="button" class="btn sm" data-act="exam.rule.add">+ 添加抽题规则</button>
      <p class="muted">同一考生每次考试将按规则重新抽题，抽中的题目在本次考试中冻结不变。若题库可用题目不足，实际题量会自动减少。</p>
    ` : `
      <button type="button" class="btn sm" data-act="exam.picker">从题库选题</button>
      <div style="margin-top:10px">${fixedList || '<p class="muted">尚未选择题目，固定试卷至少需要 1 道题。</p>'}</div>
    `}`}
  </section>

  <section class="panel">
    <h2>时间与次数</h2>
    <div class="form-grid">
      <label class="fld"><span>开放开始时间（留空为立即开始）</span><input id="ex-start" type="datetime-local" value="${toLocalInput(s.startAt)}"></label>
      <label class="fld"><span>开放结束时间（留空为不限）</span><input id="ex-end" type="datetime-local" value="${toLocalInput(s.endAt)}"></label>
    </div>
    <div class="form-grid">
      <label class="fld"><span>单场限时（分钟，0 = 不限时）</span><input id="ex-duration" type="number" min="0" step="1" value="${s.duration || 0}"></label>
      <label class="fld"><span>允许考试次数（0 = 不限）</span><input id="ex-attempts" type="number" min="0" step="1" value="${s.attempts || 0}"></label>
      <label class="fld"><span>及格线（百分比）</span><input id="ex-pass" type="number" min="0" max="100" step="1" value="${s.passScore}"></label>
    </div>
    <div class="fld"><span class="fld-label">多次考试取分策略</span>
      <div class="row">
        ${[['max','取最高分'],['last','取最后一次'],['first','取第一次'],['avg','取平均分']].map(([v, t]) =>
          `<label class="checkline"><input type="radio" name="ex-policy" value="${v}" ${s.policy === v ? 'checked' : ''}> ${t}</label>`).join('')}
      </div>
      <p class="fld-help">成绩分析页会按此策略汇总每位考生的最终成绩并排名（同一姓名+手机号视为同一人；试考不计入）。</p>

  <section class="panel">

        <input id="ex-switch" type="number" min="0" step="1" value="${s.anti.switchLimit || 0}"></label>
      <div class="fld"><span class="fld-label">访问方式</span>
        <div class="row">
          <label class="checkline"><input type="radio" name="ex-access" value="public" ${s.access === 'public' ? 'checked' : ''}> 公开</label>
          <label class="checkline"><input type="radio" name="ex-access" value="password" ${s.access === 'password' ? 'checked' : ''}> 密码</label>
        </div>
      </div>
      <label class="fld"><span>访问密码（访问方式为密码时生效）</span><input id="ex-pwd" value="${esc(s.password || '')}" placeholder="例如：2026ex"></label>
    </div>
    <div class="row" style="margin:6px 0 10px">
      <label class="checkline"><input type="checkbox" id="ex-copy" ${s.anti.copyBlock ? 'checked' : ''}> 禁止复制粘贴</label>
      <label class="checkline"><input type="checkbox" id="ex-noback" ${s.anti.noBack ? 'checked' : ''}> 禁止返回上一题</label>
      <label class="checkline"><input type="checkbox" id="ex-shuffle-q" ${s.shuffleQuestions ? 'checked' : ''}> 题目乱序</label>
      <label class="checkline"><input type="checkbox" id="ex-shuffle-o" ${s.shuffleOptions ? 'checked' : ''}> 选项乱序（自动重新编号）</label>
    </div>
    <div class="row" style="margin-bottom:10px">
      <label class="checkline"><input type="checkbox" id="ex-partial" ${s.partialCredit ? 'checked' : ''}> 多选题漏选给部分分</label>
      <label class="checkline"><input type="checkbox" id="ex-showscore" ${s.showScore ? 'checked' : ''}> 交卷后显示分数</label>
      <label class="checkline"><input type="checkbox" id="ex-showanalysis" ${s.showAnalysis ? 'checked' : ''}> 交卷后显示答案解析</label>
      <label class="checkline"><input type="checkbox" id="ex-review" ${s.allowReview ? 'checked' : ''}> 允许查看答卷</label>
    </div>
    <div class="fld"><span class="fld-label">考生信息采集</span>
      <div class="row">
        <label class="checkline"><input type="checkbox" checked disabled> 姓名（必填）</label>
        <label class="checkline"><input type="checkbox" id="ex-c-tel" ${(s.collect || []).includes('tel') ? 'checked' : ''}> 手机号</label>
        <label class="checkline"><input type="checkbox" id="ex-c-org" ${(s.collect || []).includes('org') ? 'checked' : ''}> 单位 / 部门</label>
      </div>

  <section class="panel">
    <h2>答卷个性化</h2>
    <p class="muted">为考生入口、答题页、成绩单与打印试卷设置 Logo、背景、机构与页脚；主题图片会压缩后保存在本地（占用存储）。</p>
    <div id="exam-theme-panel">
      ${(typeof THM !== 'undefined' && THM) ? THM.panelHtml(THM.normalize(s.theme || {})) : '<div class="alert info">主题模块未加载，保存设置后仍可正常使用默认样式。</div>'}
    </div>
  </section>`;
}

/* ---------- 固定试卷选题器 ---------- */
function openPicker(){
  syncExamForm();
  UI.picker = { sel:new Set(UI.editDraft?.fixed || []), kw:'' };
  paintPicker();
}
function paintPicker(){
  const sel = UI.picker.sel;
  const total = [...sel].reduce((s, id) => s + (Q(id)?.score || 0), 0);
  const rows = visibleQuestions().map(q => `
    <label class="pick-row" data-txt="${esc((plainOf(q.stem) + ' ' + (q.category || '')).toLowerCase())}">
      <input type="checkbox" data-pk="${q.id}" ${sel.has(q.id) ? 'checked' : ''} style="width:auto">
      <span class="badge t-${q.type}">${TYPES[q.type]}</span>
      <span class="pk-stem">${esc(trunc(plainOf(q.stem), 80))}${imageFlag(q)}</span>
      <span class="muted nowrap">${esc(B(q.bankId)?.name || '')}</span>
      <span class="muted nowrap">${q.score}分</span>
    </label>`).join('');
  openModal('选择题目（固定试卷）', `
    <div class="row" style="margin-bottom:10px">
      <input id="pk-kw" placeholder="搜索题干 / 知识点" style="max-width:320px" data-t="pk-kw">
      <button type="button" class="btn sm ghost" data-act="picker.none">全不选</button>
    </div>
    <div class="pick-list">${rows || '<div class="empty">题库为空，请先到题库管理新增题目</div>'}</div>
    <p class="muted">已选 <b id="pk-count">${sel.size}</b> 题，合计 <b id="pk-total">${total}</b> 分（顺序按题库顺序，可在保存后调整）</p>`, `
    <button type="button" class="btn" data-act="modal.close">取消</button>
    <button type="button" class="btn primary" data-act="picker.confirm">确定</button>`, {
    wide:true,
    onMount(m){
      m.addEventListener('change', e => {
        const cb = e.target.closest('input[data-pk]');
        if(!cb) return;
        if(cb.checked) sel.add(cb.dataset.pk); else sel.delete(cb.dataset.pk);
        const t = [...sel].reduce((s, id) => s + (Q(id)?.score || 0), 0);
        const cnt = $('#pk-count', m); if(cnt) cnt.textContent = sel.size;
        const tot = $('#pk-total', m); if(tot) tot.textContent = t;
      });
    }
  });
}

/* ---------- 发布页 ---------- */
function examShareLink(exam){
  const base = location.protocol === 'file:'
    ? location.href.split('#')[0]
    : location.origin + location.pathname;
  return base + '#/take/' + encodeURIComponent(exam.id);
}
function qrHtml(link){
  try{
    const svg = QR.svg(link, { size:240, margin:2, ecc:'M' });
    return svg;
  }catch(e){
    return `<div class="alert bad">二维码生成失败：${esc(e.message)}<br>可改用「复制链接」发给考生。</div>`;
  }
}
function viewPublish(id){
  const exam = E(id);
  if(!exam) return `<div class="empty">考试不存在或已被删除。<br><br><a class="btn" href="#/exams">返回考试管理</a></div>`;
  if(!canEditExam(exam)) return `<div class="empty">无权发布该考试。<br><br><a class="btn" href="#/exams">返回考试管理</a></div>`;
  const link = examShareLink(exam);
  const isFile = location.protocol === 'file:';
  const s = exam.settings || {};
  const paper = buildPaper(exam);
  const publishable = paper.length > 0;
  const badCount = DB.questions.filter(q => !isQuestionValid(q)).length;
  const wanted = wantedCount(exam);
  const shortfall = wanted > paper.length;
  const shareText = `【${exam.title}】\n${(exam.desc || '').trim()}\n考试链接：${link}\n${s.duration ? '限时 ' + s.duration + ' 分钟；' : ''}${s.attempts ? '最多可考 ' + s.attempts + ' 次；' : ''}${s.access === 'password' ? '访问密码请向组织者索取。' : ''}`;
  const actions = exam.status === 'draft'
    ? `<button type="button" class="btn primary" data-act="exam.publish" data-arg="${id}" ${publishable ? '' : 'disabled'}>发布考试</button>`
    : exam.status === 'published'
      ? `<button type="button" class="btn danger" data-act="exam.close" data-arg="${id}">结束考试</button>`
      : `<button type="button" class="btn primary" data-act="exam.reopen" data-arg="${id}">重新开放</button>`;

  return `<header class="page-head">
    <div><a href="#/exams" class="sub">← 返回考试管理</a><h1>发布考试</h1>
      <p class="sub">当前状态：${examStatusBadge(exam)} · 预计 ${paper.length} 题 / 约 ${paper.length ? paper.reduce((n, p) => n + (Q(p.qid)?.score || 0), 0) : 0} 分${shortfall ? `（规则期望 ${wanted} 题）` : ''}</p></div>
    <div class="row">${actions}<a class="btn" href="#/exam/${id}/paper">打印试卷</a><a class="btn" href="#/exam/${id}/paper?answers=1">打印答案卷</a><a class="btn" href="#/exam/${id}/edit">返回设置</a></div>
  </header>
  ${!publishable ? '<div class="alert bad">当前考试组卷结果为 0 道题，无法发布。请先在「考试设置」中添加抽题规则或选择固定题目。</div>' : ''}
  ${shortfall ? `<div class="alert warn">按组卷规则期望 ${wanted} 题，但当前题库完整可用题目不足，实际试卷为 ${paper.length} 题。建议补充题目、清理待完善题目或调整规则。</div>` : ''}
  ${badCount ? `<div class="alert info">题库中有 ${badCount} 道待完善题目（缺答案/空选项），不会进入试卷。</div>` : ''}
  ${isFile ? '<div class="alert warn"><b>本地文件提示：</b>当前页面以 file:// 方式打开，二维码/链接只能在本机浏览器打开，手机扫码无法访问本机文件。正式考试请把本 HTML 部署到 Web 服务器（或内网静态服务器）后再发布。</div>' : ''}
  ${exam.status === 'draft' ? '<div class="alert info">点击右上角「发布考试」后，考生才能通过链接进入。发布前建议使用「试考预览」完整走一遍流程。</div>' : ''}

  <div class="grid g2">
    <div class="panel">
      <h2>考试链接</h2>
      <div class="linkbox"><span>${esc(link)}</span>
        <button type="button" class="btn sm" data-act="link.copy" data-arg="${esc(link)}">复制链接</button></div>
      <p class="muted">把链接发给考生即可开始答题；通过二维码分享时，二维码内容与链接一致。</p>
      <h2 style="margin-top:16px">分享文案</h2>
      <textarea id="share-text" class="share-text" rows="4" readonly>${esc(shareText)}</textarea>
      <div class="row" style="margin-top:8px">
        <button type="button" class="btn sm" data-act="share.copy">复制分享文案</button>
        <a class="btn sm" href="#/take/${id}?preview=1" target="_blank" rel="noopener">试考预览（不计成绩）</a>
      </div>
      <h2 style="margin-top:16px">考试设置摘要</h2>
      <dl class="kv">
        <dt>时长</dt><dd>${s.duration ? s.duration + ' 分钟' : '不限时'}</dd>
        <dt>次数</dt><dd>${s.attempts ? '最多 ' + s.attempts + ' 次' : '不限次数'}</dd>
        <dt>及格线</dt><dd>${s.passScore}%</dd>
        <dt>开放时间</dt><dd>${s.startAt || s.endAt ? (s.startAt ? fmtDate(s.startAt) : '即日起') + ' ~ ' + (s.endAt ? fmtDate(s.endAt) : '不限') : '不限'}</dd>
        <dt>访问方式</dt><dd>${s.access === 'password' ? '密码访问（' + esc(s.password || '未设置') + '）' : '公开'}</dd>
        <dt>防作弊</dt><dd>${s.anti.copyBlock ? '禁止复制；' : ''}${s.anti.switchLimit ? '切屏 ' + s.anti.switchLimit + ' 次自动交卷；' : ''}${s.anti.noBack ? '禁止返回上一题；' : ''}${!s.anti.copyBlock && !s.anti.switchLimit && !s.anti.noBack ? '未开启' : ''}</dd>
        <dt>展示</dt><dd>${s.showScore ? '交卷显示分数；' : ''}${s.showAnalysis ? '显示解析；' : ''}${s.allowReview ? '允许查看答卷' : '不可查看答卷'}</dd>
      </dl>
    </div>
    <div class="panel">
      <h2>扫码考试</h2>
      <div class="qr-box">${qrHtml(link)}</div>
      <p class="qr-cap">${esc(link)}</p>
      <div class="row" style="justify-content:center">
        <button type="button" class="btn sm" data-act="qr.download" data-arg="${id}">下载二维码</button>
        <button type="button" class="btn sm ghost" data-act="qr.print">打印二维码</button>
      </div>
      <p class="muted center" style="margin-top:10px">二维码由本系统离线生成，不依赖任何外部服务；可保存后张贴或发送给考生。</p>
    </div>
  </div>`;
}

/* ---------- 试卷打印（试卷版 / 答案版） ---------- */
function paperAnswerText(q){
  if(q.type === 'fill') return (q.answer || []).map((l, i) => `第 ${i + 1} 空：${esc((Array.isArray(l) ? l : [l]).join(' / '))}`).join('；');
  if(q.type === 'multiple') return esc((q.answer || []).join(''));
  if(q.type === 'short') return renderRich(q.answer || '');
  return esc(String(q.answer || ''));
}
function viewPaper(id, r){
  const exam = E(id);
  if(!exam) return `<div class="plain"><div class="empty">考试不存在或已被删除。<br><br><a class="btn" href="#/exams">返回考试管理</a></div></div>`;
  if(!canEditExam(exam)) return `<div class="plain"><div class="empty">无权打印该试卷。<br><br><a class="btn" href="#/exams">返回考试管理</a></div></div>`;
  const withAnswers = r.query.answers === '1';
  const paper = buildPaper(exam).filter(p => Q(p.qid));
  const full = paper.reduce((n, p) => n + (Q(p.qid)?.score || 0), 0);
  const s = exam.settings || {};
  const items = paper.map((p, i) => {
    const q = Q(p.qid);
    const opts = (q.options || []).length
      ? `<div class="paper-opts">${q.options.map(o => `<div class="paper-opt"><b>${o.key}.</b> ${renderRich(o.text)}</div>`).join('')}</div>`
      : '';
    const answerLines = q.type === 'short' ? '<div class="paper-lines"><span></span><span></span><span></span><span></span></div>' : '';
    const fillHint = q.type === 'fill' ? '<p class="paper-hint">（请直接在题干横线处填写答案）</p>' : '';
    return `<div class="paper-q">
      <div class="paper-q-head"><b>${i + 1}.</b><span class="paper-type">（${TYPES[q.type]}，${q.score} 分）</span></div>
      <div class="paper-stem">${renderRich(q.stem)}</div>
      ${opts}${answerLines}${fillHint}
      ${withAnswers ? `<div class="paper-ans"><b>答案：</b>${paperAnswerText(q)}${!isBlankRich(q.analysis) ? `<div class="paper-ana"><b>解析：</b>${renderRich(q.analysis)}</div>` : ''}</div>` : ''}
    </div>`;
  }).join('');
  return examThemeWrap(exam, `<div class="paper-wrap">
    <div class="paper-toolbar no-print">
      <a class="btn" href="#/exam/${id}/edit">← 返回设置</a>
      <a class="btn" href="#/exam/${id}/paper${withAnswers ? '' : '?answers=1'}">${withAnswers ? '切换试卷版' : '切换答案版'}</a>
      <button type="button" class="btn primary" data-act="paper.print">打印 / 另存为 PDF</button>
      <span class="muted">${withAnswers ? '答案版' : '考生卷'} · 共 ${paper.length} 题 / ${full} 分${exam.mode === 'random' ? ' · 随机规则示例卷（每位考生会重新抽题）' : ''}</span>
    </div>
    <div class="paper" id="paper">
      <div class="paper-brand">${examThemeLogo(exam, 56)}${examThemeOrg(exam)}</div>
      <h1 class="paper-title">${esc(exam.title)}</h1>
      <div class="paper-meta">${s.duration ? '考试时长：' + s.duration + ' 分钟　' : ''}满分 ${full} 分　及格线 ${s.passScore}%　${withAnswers ? '答案版（内部使用）' : '考试时间：____________'}</div>
      <div class="paper-info">姓名：____________　　单位 / 部门：____________________　　得分：________</div>
      ${exam.desc ? `<div class="paper-desc">${esc(exam.desc)}</div>` : ''}
      <div class="paper-questions">${items || '<p class="muted">当前考试没有可用题目。</p>'}</div>
      <div class="paper-foot">本试卷由「智卷 · 在线考试系统」生成${examThemeFooter(exam)}</div>
    </div>
  </div>`);
}

/* ---------- 成绩分析 ---------- */
function finalScoreBoard(exam){
  const policy = exam.settings?.policy || 'max';
  const groups = new Map();
  submittedResponses(exam.id).forEach(r => {
    const name = (r.examinee?.name || '匿名').trim();
    const tel = (r.examinee?.tel || '').trim();
    const key = norm(name) + '|' + norm(tel);
    let g = groups.get(key);
    if(!g){ g = { name, tel, org:r.examinee?.org || '', attempts:[] }; groups.set(key, g); }
    const gd = gradeResponse(exam, r);
    const full = fullOfPaper(r.paper) || 1;
    g.attempts.push({ id:r.id, score:gd.score, full, pct:+(gd.score / full * 100).toFixed(1), at:r.submittedAt || 0, needManual:gd.needManual });
  });
  const label = { max:'取最高分', last:'取最后一次', first:'取第一次', avg:'取平均分' }[policy] || '取最高分';
  const list = [...groups.values()].map(g => {
    g.attempts.sort((a, b) => (a.at || 0) - (b.at || 0));
    let finalPct;
    if(policy === 'last') finalPct = g.attempts[g.attempts.length - 1].pct;
    else if(policy === 'first') finalPct = g.attempts[0].pct;
    else if(policy === 'avg') finalPct = +(g.attempts.reduce((s, a) => s + a.pct, 0) / g.attempts.length).toFixed(1);
    else finalPct = Math.max(...g.attempts.map(a => a.pct));
    return Object.assign(g, {
      finalPct,
      pass: finalPct >= (exam.settings.passScore || 60),
      finalNeedManual: g.attempts.some(a => a.needManual)
    });
  }).sort((a, b) => (b.finalPct - a.finalPct) || ((a.attempts[0]?.at || 0) - (b.attempts[0]?.at || 0)));
  let rank = 0, prev = null;
  list.forEach((g, i) => {
    if(prev === null || g.finalPct !== prev){ rank = i + 1; prev = g.finalPct; }
    g.rank = rank;
  });
  const n = list.length;
  return {
    policy, label, list,
    participantCount: n,
    avg: n ? +(list.reduce((s, g) => s + g.finalPct, 0) / n).toFixed(1) : 0,
    passRate: n ? +(list.filter(g => g.pass).length / n * 100).toFixed(1) : 0
  };
}
function exportFinalScores(examId){
  const exam = E(examId);
  if(!exam) return toast('考试不存在', 'bad');
  const board = finalScoreBoard(exam);
  const rows = [['排名','考生','手机号','单位','考试次数','最终得分率(%)','是否及格','各次得分率(%)','各次交卷时间']];
  board.list.forEach(g => {
    rows.push([g.rank, g.name, g.tel, g.org, g.attempts.length, g.finalPct, g.pass ? '及格' : '不及格',
      g.attempts.map(a => a.pct).join(' / '), g.attempts.map(a => fmtDate(a.at)).join(' / ')]);
  });
  download(`最终成绩-${exam.title}.csv`, toCSV(rows));
  toast(`已导出 ${board.list.length} 位考生的最终成绩（${board.label}）`);
}

function submittedResponses(examId){
  return DB.responses.filter(r => r.examId === examId && r.status === 'submitted' && !r.preview)

function viewResult(id){
  const exam = E(id);
  if(!exam) return `<div class="empty">考试不存在或已被删除。<br><br><a class="btn" href="#/exams">返回考试管理</a></div>`;
  if(!canEditExam(exam)) return `<div class="empty">无权查看该考试成绩。<br><br><a class="btn" href="#/exams">返回考试管理</a></div>`;
  const rs = submittedResponses(id).map(r => {
    const g = gradeResponse(exam, r);
    const full = fullOfPaper(r.paper) || 1;
    const p = +(g.score / full * 100).toFixed(1);
    return { r, g, full, pct:p, pass:p >= (exam.settings.passScore || 60) };
  });
  const n = rs.length;
  const avg = n ? +(rs.reduce((s, x) => s + x.pct, 0) / n).toFixed(1) : 0;
  const best = n ? Math.max(...rs.map(x => x.pct)) : 0;
  const worst = n ? Math.min(...rs.map(x => x.pct)) : 0;
  const passRate = n ? +(rs.filter(x => x.pass).length / n * 100).toFixed(1) : 0;
  const pending = rs.filter(x => x.g.needManual).length;
  const board = finalScoreBoard(exam);
  const finalRows = board.list.map(g => `<tr>
    <td><b>${g.rank}</b></td>
    <td>${esc(g.name)}</td>
    <td>${esc(g.tel || '—')}</td>
    <td>${g.attempts.length}</td>
    <td>${g.attempts.map(a => a.pct + '%').join(' / ')}</td>
    <td><b>${g.finalPct}%</b></td>
    <td>${g.pass ? '<span class="badge t-judge">及格</span>' : '<span class="badge t-short">未通过</span>'}${g.finalNeedManual ? ' <span class="badge t-fill">待阅卷</span>' : ''}</td>
  </tr>`).join('');

  const buckets = [['0-59', 0, 59], ['60-69', 60, 69], ['70-79', 70, 79], ['80-89', 80, 89], ['90-99', 90, 99], ['100', 100, 100]];
  const dist = buckets.map(([lab, a, b]) => ({ lab, n:rs.filter(x => x.pct >= a && x.pct <= b).length }));
  const maxN = Math.max(1, ...dist.map(d => d.n));
  const distHtml = dist.map(d => `<div class="bar-row">
    <span class="bar-lab">${d.lab}</span>
    <span class="bar"><i style="width:${(d.n / maxN * 100).toFixed(1)}%"></i></span>
    <span class="bar-val">${d.n} 人</span></div>`).join('');

  const qstat = {};
  rs.forEach(x => x.g.items.forEach(it => {
    const o = qstat[it.qid] || (qstat[it.qid] = { n:0, right:0, partial:0, score:0, full:0 });
    o.n++; o.score += it.score; o.full += it.full;
    if(it.result === 'right') o.right++;
    if(it.result === 'partial') o.partial++;
  }));
  const qRows = Object.entries(qstat).map(([qid, o]) => {
    const q = Q(qid);
    if(!q) return '';
    const rate = o.n ? +((o.right + o.partial * 0.5) / o.n * 100).toFixed(1) : 0;
    return `<tr>
      <td><span class="badge t-${q.type}">${TYPES[q.type]}</span></td>
      <td><div class="clip">${esc(trunc(plainOf(q.stem), 50))}${imageFlag(q)}</div></td>
      <td>${o.n}</td><td>${o.right}</td><td>${o.full ? pct(o.score, o.full) : 0}%</td>
      <td class="nowrap"><span class="bar" style="display:inline-block;width:70px;vertical-align:middle"><i style="width:${rate}%"></i></span> ${rate}%</td>
    </tr>`;
  }).join('');

  const respRows = rs.map(x => `<tr>
    <td>${esc(x.r.examinee?.name || '匿名')}</td>
    <td>${esc(x.r.examinee?.tel || '—')}</td>
    <td><b>${x.g.score}</b> / ${x.full}</td>
    <td>${x.pct}% ${x.pass ? '<span class="badge t-judge">及格</span>' : '<span class="badge t-short">未通过</span>'}</td>
    <td class="nowrap">${x.r.durationSec ? fmtDurText(x.r.durationSec) : '—'}</td>
    <td>${x.g.needManual ? '<span class="badge t-fill">待阅卷</span>' : '已判分'}</td>
    <td class="nowrap">${fmtDate(x.r.submittedAt)}</td>
    <td><div class="row tight">
      <a class="btn sm" href="#/response/${x.r.id}">查看答卷</a>
      <button type="button" class="btn sm danger" data-act="resp.del" data-arg="${x.r.id}">删除</button>
    </div></td>
  </tr>`).join('');

  return `<header class="page-head">
    <div><a href="#/exams" class="sub">← 返回考试管理</a>
      <h1>成绩分析 · ${esc(exam.title)}</h1>
      <p class="sub">共 ${n} 份有效答卷 · 及格线 ${exam.settings.passScore}%${pending ? ` · <span class="badge t-fill">${pending} 份待人工阅卷</span>` : ''}</p></div>
    <div class="row">
      <button type="button" class="btn primary" data-act="final.export" data-arg="${id}">导出最终成绩</button>
      <button type="button" class="btn" data-act="resp.export" data-arg="${id}">导出成绩 CSV</button>
      <a class="btn" href="#/exam/${id}/edit">考试设置</a>
      <a class="btn" href="#/exam/${id}/publish">发布 / 分享</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><i>答卷数</i><b>${n}</b></div>
    <div class="stat"><i>平均得分率</i><b>${avg}</b> %</div>
    <div class="stat"><i>最高 / 最低</i><b>${best} / ${worst}</b> %</div>
    <div class="stat"><i>及格率</i><b>${passRate}</b> %</div>
  </div>

  <section class="panel">
    <h2>最终成绩与排名 <span class="tag">按「${board.label}」汇总（${board.participantCount} 人）</span>
      <span class="muted" style="font-size:12px;font-weight:400">最终平均 ${board.avg}% · 最终及格率 ${board.passRate}%</span></h2>
    <p class="muted">同一姓名 + 手机号视为同一考生；当前策略：${board.label}。待人工阅卷的简答题按当前得分统计，阅卷后自动更新。</p>
    <div class="tbl-wrap"><table><thead><tr><th style="width:60px">排名</th><th>考生</th><th>手机号</th><th>考试次数</th><th>各次得分率</th><th>最终得分率</th><th>是否及格</th></tr></thead>
    <tbody>${finalRows || '<tr><td colspan="7" class="empty">暂无有效答卷</td></tr>'}</tbody></table></div>
  </section>

  <div class="grid g2">
    <section class="panel"><h2>分数段分布</h2>${n ? distHtml : '<p class="muted">暂无答卷</p>'}</section>
    <section class="panel"><h2>题目正确率</h2>
      <div class="tbl-wrap"><table><thead><tr><th>题型</th><th>题干</th><th>作答</th><th>全对</th><th>得分率</th><th>正确率</th></tr></thead>
      <tbody>${qRows || '<tr><td colspan="6" class="empty">暂无数据</td></tr>'}</tbody></table></div>
    </section>
  </div>

  <section class="panel"><h2>答卷明细</h2>
    <div class="tbl-wrap"><table><thead><tr><th>考生</th><th>手机号</th><th>得分</th><th>得分率</th><th>用时</th><th>状态</th><th>交卷时间</th><th>操作</th></tr></thead>
    <tbody>${respRows || '<tr><td colspan="8" class="empty">还没有人参加考试。发布后把链接或二维码发给考生即可</td></tr>'}</tbody></table></div>
  </section>`;
}

function viewResponse(rid){
  const resp = R(rid);
  if(!resp) return `<div class="empty">答卷不存在。<br><br><a class="btn" href="#/exams">返回考试管理</a></div>`;
  const exam = E(resp.examId);
  if(!exam || !canEditExam(exam)) return `<div class="empty">无权查看该答卷。<br><br><a class="btn" href="#/exams">返回考试管理</a></div>`;
  const g = gradeResponse(exam, resp);
  const full = fullOfPaper(resp.paper) || 1;
  const p = +(g.score / full * 100).toFixed(1);

  const items = (resp.paper || []).map((item, i) => {
    const q = Q(item.qid);
    if(!q) return `<div class="panel"><span class="muted">第 ${i + 1} 题已被删除</span></div>`;
    const ans = resp.answers ? resp.answers[q.id] : undefined;
    const it = g.items.find(x => x.qid === q.id) || { score:0, full:q.score, result:'wrong' };
    const resTag = {
      right:'<span class="badge t-judge">正确</span>',
      wrong:'<span class="badge t-short">错误</span>',
      partial:'<span class="badge t-fill">部分正确</span>',
      manual:'<span class="badge t-fill">待评分</span>',
      'manual-graded':'<span class="badge t-judge">已评分</span>'
    }[it.result] || '';
    const ansShow = q.type === 'fill'
      ? (Array.isArray(ans) ? ans.map((v, k) => `第 ${k + 1} 空：${esc(v || '未填')}`).join('；') : '未作答')
      : q.type === 'short'

function renderFillStem(q, ans){
  const given = Array.isArray(ans) ? ans : [];
  const box = document.createElement('div');
  box.innerHTML = renderRich(q.stem);
  let k = 0;
  const makeInput = idx => {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'fill-input';
    inp.setAttribute('data-blank', String(idx));
    inp.setAttribute('value', given[idx] == null ? '' : String(given[idx]));
    inp.setAttribute('placeholder', '第 ' + (idx + 1) + ' 空');
    inp.setAttribute('aria-label', '第 ' + (idx + 1) + ' 空');
    return inp;
  };
  const walk = node => {
    if(node.nodeType === 3){
      const text = node.nodeValue || '';
      if(!/_{2,}/.test(text)) return;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      const re = /_{2,}/g;
      while((m = re.exec(text))){
        if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        frag.appendChild(makeInput(k++));
        last = m.index + m[0].length;
      }
      if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
      return;
    }
    if(node.nodeType === 1){
      if(node.tagName === 'IMG' || node.tagName === 'INPUT') return;
      Array.from(node.childNodes).forEach(walk);
    }
  };
  Array.from(box.childNodes).forEach(walk);
  let html = box.innerHTML;
  const blanks = (q.answer || []).length;
  const extra = [];
  for(let i = k; i < blanks; i++){
    extra.push(`<input type="text" class="fill-input" data-blank="${i}" value="${esc(given[i] == null ? '' : given[i])}" placeholder="第 ${i + 1} 空" aria-label="第 ${i + 1} 空">`);
  }
  if(extra.length) html += `<div class="fill-rows">${extra.join('')}</div>`;
  return html;
}
function answerArea(q, ans, exam, resp){
  if(['single','multiple','judge'].includes(q.type)){
    const view = optionView(q, resp);
    const isMulti = q.type === 'multiple';
    const your = isMulti ? (Array.isArray(ans) ? ans : []) : [ans];
    return `<div class="opts">${view.map(o => {
      const on = your.includes(o.orig);
      return `<label class="opt ${on ? 'on' : ''}">
        <input type="${isMulti ? 'checkbox' : 'radio'}" name="ans_${q.id}" value="${o.orig}" data-t="qans" ${on ? 'checked' : ''}>

}
function hasAnswer(q, a){
  if(!q) return false;
  if(q.type === 'multiple') return Array.isArray(a) && a.length > 0;
  if(q.type === 'fill') return Array.isArray(a) && a.some(x => String(x || '').trim());

}
function paintQuestion(){

function updateSheet(){

    el.classList.toggle('cur', i === idx);

function collectCurrentAnswer(){
  if(!CUR) return;

  if(!item) return;

  } else if(q.type === 'short'){

}
function scheduleSave(){

function startTimer(exam, resp){
  clearInterval(TICK);
  const s = exam.settings || {};
  const el = $('#timer');
  if(!s.duration){
    if(el) el.textContent = '不限时';
    TICK = null;
    return;
  }
  if(!resp.deadlineAt) resp.deadlineAt = (resp.startedAt || now()) + Number(s.duration) * 60000;
  CUR = CUR || { exam, resp };
  const deadline = resp.deadlineAt;
  const tick = () => {
    const e = $('#timer');
    if(!e){ clearInterval(TICK); TICK = null; return; }
    const left = deadline - now();
    if(left <= 0){
      e.textContent = '00:00';
      e.classList.add('urgent');
      clearInterval(TICK); TICK = null;
      toast('考试时间到，系统已自动交卷', 'bad');
      submitAttempt('timeout', true);
      return;
    }
    if(!CUR) return;
    e.textContent = fmtDur(left);
    e.classList.toggle('urgent', left < 120000);
    if(left < 300000 && !CUR.warned5){ CUR.warned5 = true; toast('距离考试结束还有 5 分钟', 'warn'); }
    if(left < 60000 && !CUR.warned1){ CUR.warned1 = true; toast('距离考试结束还有 1 分钟', 'warn'); }
  };
  tick();
  TICK = setInterval(tick, 1000);
}
function postRun(){
