  const expired = CUR.resp.deadlineAt && now() > CUR.resp.deadlineAt;
  if(expired){ submitAttempt('timeout', true); return; }
  paintQuestion();
  startTimer(CUR.exam, CUR.resp);
}
function goTo(idx){
  if(!CUR) return;
  collectCurrentAnswer();
  const total = (CUR.resp.paper || []).length;
  idx = Math.max(0, Math.min(total - 1, idx));
  const noBack = CUR.exam.settings?.anti?.noBack;
  if(noBack && idx < CUR.idx) return toast('本场考试不允许返回已答题目', 'warn');
  CUR.idx = idx;
  CUR.resp.currentIndex = idx;
  scheduleSave();
  paintQuestion();
}
function toggleMark(){
  if(!CUR) return;
  const item = CUR.resp.paper[CUR.idx];
  if(!item) return;
  const q = Q(item.qid);
  if(!q) return;
  CUR.resp.marks = CUR.resp.marks || {};
  CUR.resp.marks[q.id] = !CUR.resp.marks[q.id];
  scheduleSave();
  paintQuestion();
  toast(CUR.resp.marks[q.id] ? '已标记本题' : '已取消标记');
}
function askSubmit(){
  if(!CUR) return;
  collectCurrentAnswer();
  const { resp } = CUR;
  const total = (resp.paper || []).length;
  const un = (resp.paper || []).filter(p => !hasAnswer(Q(p.qid), resp.answers?.[p.qid]));
  const shortCount = (resp.paper || []).filter(p => Q(p.qid)?.type === 'short').length;
  openModal('确认交卷', `
    <p>本次试卷共 <b>${total}</b> 题，已答 <b>${total - un.length}</b> 题${un.length ? `，<b class="bad">未答 ${un.length} 题</b>` : ''}。</p>
    ${un.length ? `<p class="muted">未答题目：${un.slice(0, 12).map(p => { const i = (resp.paper || []).indexOf(p); return '第 ' + (i + 1) + ' 题'; }).join('、')}${un.length > 12 ? ' 等' : ''}。交卷后将按 0 分计。</p>` : ''}
    ${shortCount ? `<p class="muted">试卷含 ${shortCount} 道简答题，需要人工阅卷后才会出最终成绩。</p>` : ''}
    <p class="muted">交卷后不可修改答案，确定提交吗？</p>`, `
    <button type="button" class="btn" data-act="modal.close">再检查一下</button>
    <button type="button" class="btn primary" data-act="take.confirm">确认交卷</button>`);
}
function submitAttempt(reason, skipCollect){
  if(!CUR) return;
  const { exam, resp } = CUR;
  if(!resp || resp.status !== 'in_progress') return;
  if(SUBMITTING) return;
  SUBMITTING = true;
  if(!skipCollect) collectCurrentAnswer();
  resp.submittedAt = now();
  resp.status = 'submitted';
  resp.durationSec = Math.max(0, Math.round((resp.submittedAt - (resp.startedAt || resp.submittedAt)) / 1000));
  const g = gradeResponse(exam, resp);
  resp.score = g.score;
  resp.needManual = g.needManual;
  save();
  clearInterval(TICK); TICK = null;
  clearTimeout(SAVE_T); SAVE_T = null;
  try{ localStorage.removeItem('zj.cur.' + exam.id); }catch(e){}
  CUR = null;
  closeModal();
  SUBMITTING = false;
  toast(reason === 'timeout' ? '时间到，已自动交卷' : '交卷成功');
  go(`#/take/${exam.id}/report?r=${resp.id}`);
}

/* ---------- 成绩单 ---------- */
function viewReport(exam, r){
  const me = curUser();
  const uidNow = me ? me.id : '';
  const resp = R(r.query.r) || DB.responses.filter(x => x.examId === exam.id && x.status === 'submitted' && !!x.preview === (r.query.preview === '1') && (!me || me.role === 'admin' || x.userId === uidNow))
    .sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0))[0];
  if(!resp) return plainPage('<div class="empty">未找到答卷。<br><br><a class="btn" href="#/take/' + exam.id + '">返回考试入口</a></div>');
  if(me && me.role !== 'admin' && (resp.userId !== uidNow || resp.preview)) return plainPage('<div class="empty">无权查看该答卷。<br><br><a class="btn" href="#/my/results">返回我的成绩</a></div>');
  const s = exam.settings || {};
  const g = gradeResponse(exam, resp);
  const full = fullOfPaper(resp.paper) || 1;
  const p = +(g.score / full * 100).toFixed(1);
  const pass = p >= (s.passScore || 60);
  const left = attemptsLeft(exam, uidNow);
  const availability = examAvailability(exam, false);
  const canRetry = !resp.preview && left > 0 && availability.ok;
  const showScore = resp.preview || s.showScore;
  const showAnalysis = resp.preview || s.showAnalysis;
  const allowReview = (resp.preview || s.allowReview) && showScore;

  const review = !allowReview ? '' : (resp.paper || []).map((item, i) => {
    const q = Q(item.qid);
    if(!q) return `<div class="panel"><span class="muted">第 ${i + 1} 题已被删除</span></div>`;
    const it = g.items.find(x => x.qid === q.id) || { score:0, full:q.score, result:'wrong' };
    const ans = resp.answers ? resp.answers[q.id] : undefined;
    const color = it.result === 'right' ? 'var(--ok)' : it.result === 'partial' ? 'var(--warn)' : 'var(--bad)';
    const view = optionView(q, resp);
    const opts = view.length ? `<div class="opts" style="margin-bottom:10px">${view.map(o => {
      const isCorrect = q.type === 'multiple' ? (q.answer || []).includes(o.orig) : q.answer === o.orig;
      const isYours = q.type === 'multiple' ? (Array.isArray(ans) && ans.includes(o.orig)) : ans === o.orig;
      return `<div class="opt" style="cursor:default;${isCorrect ? 'border-color:#bce8d1;background:#f2fbf6' : ''}">
        <span class="key">${o.key}</span><span class="tx">${renderRich(o.text)}${isCorrect ? ' <span class="badge t-judge">正确答案</span>' : ''}${isYours ? ' <span class="badge t-fill">你的选择</span>' : ''}</span>
      </div>`;
    }).join('')}</div>` : '';
    const ansShow = q.type === 'fill'
      ? (Array.isArray(ans) ? ans.map((v, k) => `第 ${k + 1} 空：${esc(v || '未填')}`).join('；') : '未作答')
      : q.type === 'short'
        ? (ans ? esc(ans).replace(/\r?\n/g, '<br>') : '<span class="muted">未作答</span>')
        : esc(displayAnswer(q, ans, resp) || '未作答');
    const correctText = q.type === 'fill' ? esc(displayCorrect(q, resp)) : q.type === 'short' ? renderRich(q.answer) : esc(displayCorrect(q, resp));
    return `<div class="panel report-item">
      <div class="between" style="margin-bottom:8px">
        <span><b>${i + 1}.</b> <span class="badge t-${q.type}">${TYPES[q.type]}</span></span>
        <span style="color:${color};font-weight:600">${it.score} / ${it.full} 分</span>
      </div>
      <div class="stem" style="font-size:14px">${renderRich(q.stem)}</div>
      ${opts}
      <p class="ans-line"><span class="lab">你的答案</span><b style="color:${color}">${ansShow}</b></p>
      <p class="ans-line"><span class="lab">正确答案</span>${correctText}</p>
      ${q.type === 'short' ? '<p class="muted">简答题需人工阅卷，最终成绩以管理员评分为准。</p>' : ''}
      ${showAnalysis && !isBlankRich(q.analysis) ? `<div class="analysis-box"><b>解析</b>${renderRich(q.analysis)}</div>` : ''}
    </div>`;
  }).join('');

  const reviewHtml = review || `<div class="alert info">本场考试未开放答卷查看，仅显示成绩。</div>`;
  return examThemeWrap(exam, plainPage(`
    <div class="panel" style="text-align:center;padding:30px">
      ${examThemeLogo(exam, 56)}
      ${resp.preview ? '<span class="preview-flag">试考预览（不计入成绩与次数）</span>' : ''}
      <p class="sub" style="margin-top:8px">${esc(exam.title)}</p>
      ${showScore ? `
        <div class="score-big" style="color:${pass ? 'var(--ok)' : 'var(--bad)'}">${g.score}</div>
        <p class="sub">总分 ${full} 分 · 得分率 ${p}%</p>
        <p style="margin-top:10px">${pass
          ? '<span class="badge t-judge" style="font-size:13px;padding:4px 14px">恭喜，考试通过</span>'
          : '<span class="badge t-short" style="font-size:13px;padding:4px 14px">未达及格线 ' + (s.passScore || 60) + '%</span>'}</p>
      ` : '<h2 style="margin-top:10px">交卷成功</h2><p class="sub">成绩由管理员公布后可见</p>'}
      <p class="muted" style="margin-top:12px">用时 ${resp.durationSec ? fmtDurText(resp.durationSec) : '—'} · 交卷于 ${fmtDateFull(resp.submittedAt)}${resp.switchCount ? ' · 切屏 ' + resp.switchCount + ' 次' : ''}</p>
      ${g.needManual ? '<p class="bad">含简答题，待人工阅卷后出最终成绩</p>' : ''}
      <div class="row" style="justify-content:center;margin-top:16px">
        ${canRetry ? `<button type="button" class="btn primary" data-act="take.retry" data-arg="${exam.id}">再考一次</button>` : ''}
        <button type="button" class="btn" data-act="take.copy" data-arg="${resp.id}">复制成绩</button>
        <button type="button" class="btn ghost" data-act="report.print">打印成绩单</button>
        ${resp.preview ? `<a class="btn" href="#/exam/${exam.id}/publish">返回发布页</a>` : `<a class="btn ghost" href="#/take/${exam.id}">返回考试入口</a>`}
      </div>
    </div>
    ${reviewHtml}
    ${examThemeFooter(exam)}`));
}

  const el = $('#auth-msg');
  if(el){
    el.style.display = 'block';

function openBackupPicker(){
  const existing = document.getElementById('backup-file');
  if(existing){ existing.click(); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    input.remove();
    if(f) importBackupFile(f);
  });
  document.body.appendChild(input);
  input.click();
}
function importBackupFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try{ data = JSON.parse(String(fr.result || '')); }catch(e){ return toast('备份文件不是有效的 JSON', 'bad'); }
    if(!data || !Array.isArray(data.questions) || !Array.isArray(data.exams)) return toast('备份文件格式不正确（缺少题库 / 考试数据）', 'bad');
    confirmModal('恢复数据备份', `将用备份覆盖当前全部数据（${data.questions.length} 道题、${(data.exams || []).length} 场考试）。当前数据会被替换，建议先导出备份。确定继续吗？`, () => {
      try{
        setDB(data);
        UI.sel.clear(); UI.editDraft = null; UI.qf.page = 1;
        render();
        toast('数据已恢复');
      }catch(e){ toast('恢复失败：' + e.message, 'bad'); }
    }, { okText:'覆盖并恢复' });
  };
  fr.onerror = () => toast('读取备份文件失败', 'bad');
  fr.readAsText(file);
}

document.addEventListener('click', async e => {
  if(e.target && e.target.classList && e.target.classList.contains('mask')){
    closeModal();
    return;
  }
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  // 公开动作（登录/注册）不校验；其余需登录。普通用户可管理自己的题库/考试/数据，但不能管理用户。
  if(!/^(auth\.login|auth\.register|auth\.goto)/.test(act)){
    const u = (typeof AUTH !== 'undefined') ? AUTH.current() : null;
    if(!u){ toast('请先登录', 'warn'); go('#/login'); return; }
    if(typeof AUTH.canRunAction === 'function' && !AUTH.canRunAction(act)){
      toast('无权限：当前账号无法执行该操作', 'bad');
      return;
    }
  }
  switch(act){
    /* ---------- 认证 / 账号 ---------- */
    case 'auth.login': {
      const username = ($('#login-user')?.value || '').trim();
      const pwd = $('#login-pwd')?.value || '';
      if(!username || !pwd) return authMsg('请输入用户名和密码');
      const res = await AUTH.login(username, pwd);
      if(!res.ok) return authMsg(res.reason || '登录失败');
      const redirect = takeRedirect();
      let target = '#/';
      if(redirect && !/^#\/(login|register)/.test(redirect)) target = redirect;
      toast('欢迎，' + res.user.name);
      go(target);
      if(res.user.mustChangePassword) setTimeout(() => toast('你正在使用初始密码，请到个人中心修改', 'warn'), 700);
      break;
    }
    case 'auth.register': {
      const vals = {
        username: ($('#reg-user')?.value || '').trim(),
        name: ($('#reg-name')?.value || '').trim(),
        org: ($('#reg-org')?.value || '').trim(),
        tel: ($('#reg-tel')?.value || '').trim(),
        password: $('#reg-pwd')?.value || ''
      };
      const pwd2 = $('#reg-pwd2')?.value || '';
      if(vals.password !== pwd2) return authMsg('两次输入的密码不一致');
      const res = await AUTH.register(vals);
      if(!res.ok) return authMsg(res.reason || '注册失败');
      toast('注册成功，已登录');
      go('#/');
      break;
    }
    case 'auth.logout': {
      await AUTH.logout();
      toast('已退出登录');
      go('#/login');
      break;
    }
    case 'auth.changepwd': {
      const oldPwd = $('#pw-old')?.value || '';
      const newPwd = $('#pw-new')?.value || '';
      const newPwd2 = $('#pw-new2')?.value || '';
      if(!oldPwd) return toast('请输入原密码', 'bad');
      if(newPwd !== newPwd2) return toast('两次输入的新密码不一致', 'bad');
      const res = await AUTH.changePassword(oldPwd, newPwd);
      if(!res.ok) return toast(res.reason || '修改失败', 'bad');
      toast('密码已修改');
      render();
      break;
    }
    case 'auth.profile.save': {
      const res = await AUTH.updateProfile({
        name: $('#pf-name')?.value || '',
        org: $('#pf-org')?.value || '',
        tel: $('#pf-tel')?.value || ''
      });
      if(!res.ok) return toast(res.reason || '保存失败', 'bad');
      toast('资料已保存'); render();
      break;
    }
    case 'users.add': {
      openModal('新增用户', `
        <div class="form-grid">
          <label class="fld"><span>用户名（3–20 位字母/数字/_.-）</span><input id="nu-user" autofocus></label>
          <label class="fld"><span>姓名 / 昵称</span><input id="nu-name"></label>
        </div>

          <label class="fld"><span>单位 / 部门</span><input id="nu-org"></label>

        <div class="form-grid">
          <label class="fld"><span>角色</span><select id="nu-role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label>
          <label class="fld"><span>初始密码（至少 6 位）</span><input id="nu-pwd" value="123456"></label>
        </div>
        <p class="fld-help">新建用户首次登录后应修改密码；管理员拥有全部权限。</p>`, `

      let done = false;
      try{
        const canvas = document.createElement('canvas');
        if(typeof QR.draw === 'function' && QR.draw(canvas, link, { size:720, margin:2, ecc:'M' }) &&
           typeof canvas.toDataURL === 'function'){
          const png = canvas.toDataURL('image/png');
          if(/^data:image\/png;base64,/.test(png)){
            const bin = atob(png.split(',')[1]);
            const arr = new Uint8Array(bin.length);
            for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            downloadBlob(base + '.png', new Blob([arr], { type:'image/png' }));
            toast('二维码已下载（PNG）');
            done = true;
          }
        }
      }catch(e){ done = false; }
      if(!done){
        try{

      break;
    }
    case 'take.next': {
      if(!CUR) break;
      if(CUR.idx >= (CUR.resp.paper || []).length - 1) return toast('已经是最后一题，可点击右上角「交卷」', 'warn');
      goTo(CUR.idx + 1);
      break;
    }
    case 'take.jump': goTo(Number(arg) || 0); break;
    case 'take.mark': toggleMark(); break;
    case 'take.retry': {
      const ex = E(arg); if(!ex) break;
      const u = curUser();
      if(!u) return toast('请先登录', 'bad');
      if(attemptsLeft(ex, u.id) <= 0) return toast('考试次数已用完', 'bad');
      go(`#/take/${arg}`);
      break;
    }
    case 'take.copy': {
      const resp = R(arg);
      const ex = resp ? E(resp.examId) : null;
      if(!resp){ toast('答卷不存在', 'bad'); break; }
      const full = fullOfPaper(resp.paper) || 1;
      const p = +(Number(resp.score) || 0) / full * 100;
      const text = `${ex ? ex.title : '考试'}｜${resp.examinee?.name || '考生'}｜得分 ${resp.score || 0} / ${full}（${p.toFixed(1)}%）｜${p >= (ex?.settings?.passScore || 60) ? '及格' : '未及格'}｜交卷 ${fmtDateFull(resp.submittedAt)}`;
      copyWithToast(text, '成绩摘要已复制');
      break;
    }
  }
});

/* ---------- 输入 / 选择 ---------- */
document.addEventListener('compositionstart', () => { UI.composing = true; });
document.addEventListener('compositionend', () => { UI.composing = false; });

document.addEventListener('input', e => {
  const t = e.target;
  if(!t) return;
  if(t.dataset && t.dataset.t === 'qf-kw'){
    UI.qf.kw = t.value;
    UI.qf.page = 1;
    if(!UI.composing) bankSearchRefresh();
    return;
  }
  if(t.dataset && t.dataset.t === 'exam-kw'){
    UI.examFilter.kw = t.value;
    if(!UI.composing) examSearchRefresh();
    return;
  }
  if(t.id === 'pk-kw'){
    const kw = t.value.trim().toLowerCase();
    $$('.pick-row').forEach(row => { row.style.display = (!kw || (row.dataset.txt || '').includes(kw)) ? '' : 'none'; });
    return;
  }
  if(CUR && (t.classList.contains('fill-input') || t.id === 'short-ans' || t.id === 'f-name' || t.id === 'f-tel' || t.id === 'f-org')){
    if(t.classList.contains('fill-input') || t.id === 'short-ans') collectCurrentAnswer();
    return;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(!t || !t.dataset) return;
  const dt = t.dataset.t;
  if(dt === 'qform-type'){ changeQType(t.value); return; }
  if(dt === 'exam-mode'){ syncExamForm(); if(UI.editDraft) UI.editDraft.mode = t.value; render(); return; }
  if(dt === 'qf-type'){ UI.qf.type = t.value; UI.qf.page = 1; render(); return; }
  if(dt === 'qf-diff'){ UI.qf.diff = t.value; UI.qf.page = 1; render(); return; }
  if(dt === 'qf-cat'){ UI.qf.cat = t.value; UI.qf.page = 1; render(); return; }
  if(dt === 'qf-issue'){ UI.qf.issue = t.value; UI.qf.page = 1; render(); return; }
  if(dt === 'exam-status'){ UI.examFilter.status = t.value; render(); return; }
  if(dt === 'sel-all'){
    const bankId = parseRoute().path[0] === 'bank' ? parseRoute().path[1] : '';
    if(!bankId) return;
    const list = filteredQuestions(bankId);
    if(t.checked) list.forEach(q => UI.sel.add(q.id));
    else list.forEach(q => UI.sel.delete(q.id));
    $$('input[data-sel]').forEach(cb => { cb.checked = t.checked; });
    updBulkBar();
    return;
  }
  if(dt === undefined && t.dataset.sel){
    if(t.checked) UI.sel.add(t.dataset.sel); else UI.sel.delete(t.dataset.sel);
    updBulkBar();
    return;
  }
  if(t.id === 'backup-file'){
    const f = t.files && t.files[0];
    t.value = '';
    if(f) importBackupFile(f);
    return;
  }
  if(CUR && dt === 'qans'){
    collectCurrentAnswer();
    const panel = $('#q-panel');
    if(panel){
      if(t.type === 'radio'){
        $$('.opts .opt', panel).forEach(o => {
          const i = $('input', o);
          o.classList.toggle('on', !!(i && i.checked));
        });
      } else {
        const opt = t.closest('.opt');
        if(opt) opt.classList.toggle('on', t.checked);
      }
    }
    return;
  }
});

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && modalRoot() && modalRoot().innerHTML){
    closeModal();
    return;
  }
  if(e.key === 'Enter'){
    const t = e.target;
    const id = t && t.id;
    if(id === 'login-user' || id === 'login-pwd'){
      e.preventDefault();
      const btn = $('[data-act="auth.login"]'); if(btn) btn.click();
    } else if(/^reg-(user|name|org|tel|pwd|pwd2)$/.test(id || '')){
      e.preventDefault();
      const btn = $('[data-act="auth.register"]'); if(btn) btn.click();
    }
  }
});

/* ---------- 防作弊 / 保护 ---------- */
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    if(CUR && CUR.resp && CUR.resp.status === 'in_progress'){
      flushSave();
      const { exam, resp } = CUR;
      const lim = exam.settings?.anti?.switchLimit || 0;
      resp.switchCount = (resp.switchCount || 0) + 1;
      save();
      if(lim > 0 && resp.switchCount >= lim){
        toast('切屏次数已超限，系统自动交卷', 'bad');
        submitAttempt('switch', true);
      } else if(lim > 0){
        toast(`检测到离开考试页面 ${resp.switchCount}/${lim} 次，请勿切屏`, 'warn');
      }
    }
  }
});
document.addEventListener('copy', e => {
  if(CUR && CUR.exam?.settings?.anti?.copyBlock){ e.preventDefault(); toast('本场考试禁止复制', 'warn'); }
});
document.addEventListener('paste', e => {
  if(CUR && CUR.exam?.settings?.anti?.copyBlock){ e.preventDefault(); toast('本场考试禁止粘贴内容', 'warn'); }
});
document.addEventListener('contextmenu', e => {
  if(CUR && CUR.exam?.settings?.anti?.copyBlock){ e.preventDefault(); toast('本场考试禁止使用右键菜单', 'warn'); }
});
document.addEventListener('cut', e => {
  if(CUR && CUR.exam?.settings?.anti?.copyBlock){ e.preventDefault(); toast('本场考试禁止剪切', 'warn'); }
});
window.addEventListener('beforeunload', e => {
  if(CUR && CUR.resp && CUR.resp.status === 'in_progress'){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
window.addEventListener('pagehide', () => {
  if(CUR && CUR.resp && CUR.resp.status === 'in_progress') flushSave();
});
