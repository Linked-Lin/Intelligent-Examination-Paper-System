<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6ef6">
<meta name="description" content="智卷 · 在线考试系统 —— 题库管理、智能组卷、考试发布、在线答题、成绩分析（单文件离线版）">
<title>智卷 · 在线考试系统</title>
<style>
/* ==================== 00-base.css ==================== */
/* 智卷 · 在线考试系统 v2 — 基础样式 */
:root{
  --bg:#f4f6fb;--panel:#fff;--ink:#1a2233;--sub:#6b7690;--line:#e6eaf2;
  --brand:#3b6ef6;--brand2:#eaf0ff;--ok:#12a05c;--okbg:#e6f6ee;
  --warn:#d98600;--warnbg:#fff5e3;--bad:#e0453b;--badbg:#fdecea;
  --r:14px;--sh:0 2px 12px rgba(23,38,80,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}h3{font-size:15px;margin:0}
p{margin:6px 0}
.sub{color:var(--sub);font-size:13px;margin:0}
.muted{color:var(--sub);font-size:13px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.nowrap{white-space:nowrap}
.center{text-align:center}
.hr{height:1px;background:var(--line);margin:14px 0}
/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b6ef6,#7a5cf6);
  color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--sub);font-size:11px}
nav{display:flex;flex-direction:column;gap:3px}
nav a{padding:9px 12px;border-radius:10px;color:#3a4560;font-size:14px;display:flex;gap:8px;align-items:center}
nav a .ni{width:18px;text-align:center;opacity:.85;flex:none}
nav a.on{background:var(--brand2);color:var(--brand);font-weight:600}
nav a:hover{background:#f0f3fa;text-decoration:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{flex:1;padding:22px 26px 70px;max-width:1280px;min-width:0}
.plain{max-width:880px;margin:0 auto;padding:26px 16px 70px}
/* ===== 通用 ===== */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{word-break:break-word}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{gap:5px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.panel.tight{padding:12px 14px}
.panel h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.stat i{display:block;font-size:12px;color:var(--sub);font-style:normal}
.stat b{font-size:22px;letter-spacing:-.4px;word-break:break-all}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.empty{text-align:center;color:var(--sub);padding:36px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.alert{border-radius:10px;padding:10px 13px;font-size:13px;margin:10px 0;border:1px solid transparent}
.alert.info{background:var(--brand2);color:#2d5bd6;border-color:#ccdafd}
.alert.warn{background:var(--warnbg);color:#8a5a00;border-color:#ffdda1}
.alert.bad{background:var(--badbg);color:#a72a22;border-color:#f5c2bd}
.alert.ok{background:var(--okbg);color:#0b7a45;border-color:#bce8d1}
/* ===== 控件 ===== */
.btn{border:1px solid var(--line);background:#fff;color:#2b3550;padding:8px 14px;
  border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s;line-height:1.4;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:#c9d4ea;background:#f8faff;text-decoration:none}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#2f5fe0;border-color:#2f5fe0}
.btn.danger{color:var(--bad);border-color:#f3c9c6}
.btn.danger:hover{background:var(--badbg)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:#f0f3fa}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.lg{padding:11px 20px;font-size:15px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;width:100%;outline:none;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--brand);margin:0 2px 0 0;vertical-align:middle}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,110,246,.12)}
textarea{resize:vertical;line-height:1.7}
label.fld{display:block;margin-bottom:12px}
label.fld>span,.fld-label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fld-help{font-size:12px;color:var(--sub);margin:4px 0 0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.checkline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#3a4560;cursor:pointer;margin:0 10px 6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;color:#3a4560;font-family:inherit}
.seg button.on{background:var(--brand2);color:var(--brand);font-weight:600}
/* ===== 表格 ===== */
.tbl-wrap{overflow:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--sub);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
td{padding:10px;border-bottom:1px solid #f1f4fa;vertical-align:middle}
tr:hover td{background:#fafbff}
td .row{flex-wrap:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:#eef2fa;color:#4a5670;white-space:nowrap;line-height:1.8}
.t-single{background:#e8efff;color:#2d5bd6}.t-multiple{background:#eae6ff;color:#6a4bd6}
.t-judge{background:#e6f6ee;color:#0f8a4f}.t-fill{background:#fff2e0;color:#b86f00}
.t-short{background:#fde9ef;color:#c33a63}
.tag{background:#f0f3fa;color:var(--sub);border-radius:8px;padding:2px 8px;font-size:12px;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.img-flag{font-size:11px;color:#6a4bd6;background:#f0ecff;border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.rich-img img{max-width:100%;height:auto;border-radius:8px;display:block;margin:6px 0}
/* ===== 弹窗 / 提示 ===== */
.mask{position:fixed;inset:0;background:rgba(16,24,44,.42);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:99;overscroll-behavior:contain}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;display:flex;
  flex-direction:column;box-shadow:0 18px 50px rgba(12,22,50,.24);overflow:hidden}
.modal.wide{width:min(1000px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{font-size:16px;word-break:break-word}
.modal-body{padding:18px 20px;overflow:auto;min-height:0}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;flex:none;background:#fcfdff}
.x{border:none;background:none;font-size:23px;line-height:1;cursor:pointer;color:var(--sub);padding:2px 4px;border-radius:8px}
.x:hover{background:#f0f3fa;color:var(--ink)}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#22304d;color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(20,30,60,.25);
  max-width:min(90vw,560px);text-align:center;animation:toastIn .18s ease-out}
.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
/* ===== 题库 ===== */
.q-opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.q-opt-row .key{font-weight:700;color:var(--brand);width:20px;flex:none;padding-top:0;text-align:center}
.q-opt-row .opt-body{flex:1;min-width:0}
.q-opt-row .pick{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--sub);white-space:nowrap;padding-top:0}
.q-opt-row .btn{margin-top:0}
/* 选项编辑器更紧凑，避免 4 个选项把弹窗撑得过长 */
#modal-root .q-opt-row .rt-edit{min-height:48px;padding:8px 10px;font-size:13px}
#modal-root .q-opt-row .rt-edit:empty{min-height:48px}
#modal-root .q-opt-row .rt-toolbar{padding:4px 6px;gap:2px}
#modal-root .q-opt-row .rt-btn{min-width:24px;height:24px;padding:0 6px;font-size:12px}
#modal-root .q-opt-row .rt-sep{display:none}
#modal-root .q-opt-row .rt-wrap{background:#fcfdff}
.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f7f9ff;border:1px dashed #c9d4ea;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.bulkbar .cnt{font-weight:600;color:var(--brand)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.pager .btn[disabled]{opacity:.45}
.pager .pg{min-width:32px;justify-content:center}
.pager .pg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pick-list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.pick-row{display:flex;gap:9px;align-items:center;padding:8px 11px;border-bottom:1px solid #f2f5fb;cursor:pointer}
.pick-row:hover{background:#fafbff}
.pick-row input{width:auto;flex:none}
.pick-row .pk-stem{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;min-width:0}
.preview-q .stem{font-size:15px}
/* ===== 考试设置 ===== */
.rule-row{display:grid;grid-template-columns:1.1fr .9fr 1fr .8fr .7fr auto;gap:7px;align-items:center;margin-bottom:8px}
.rule-head{font-size:12px;color:var(--sub);display:grid;grid-template-columns:1.1fr .9fr 1fr .8fr .7fr auto;gap:7px;padding:0 0 6px}
.fixed-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #f1f4fa;padding:7px 0}
.fixed-row .stemtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
/* ===== 发布 ===== */
.linkbox{display:flex;gap:8px;align-items:center;background:#f7f9ff;border:1px dashed #c9d4ea;
  border-radius:10px;padding:9px 12px;font-size:13px;word-break:break-all;flex-wrap:wrap}
.linkbox span{flex:1;min-width:180px}
.qr-box{text-align:center;padding:14px 10px}
.qr-img{width:220px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;display:inline-block}
.qr-box svg{width:240px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;display:inline-block}
.qr-cap{font-size:12px;color:var(--sub);margin-top:8px;word-break:break-all}
.share-text{font-size:13px;background:#fafbff}
/* ===== 答题 ===== */
.exam-wrap{min-height:100vh;background:var(--bg)}
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;position:sticky;top:0;z-index:5}
.etitle{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.etitle b{word-break:break-word}
.timer{font:600 18px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--brand);
  background:var(--brand2);padding:8px 14px;border-radius:10px;white-space:nowrap}
.timer.urgent{color:#fff;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.exam-main{display:flex;gap:16px;padding:18px;max-width:1180px;margin:0 auto;align-items:flex-start}
.qbox{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;min-height:380px;box-shadow:var(--sh);min-width:0}
.qhead{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.stem{font-size:15.5px;line-height:1.9;margin-bottom:18px;word-break:break-word}
.stem img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px 0}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;cursor:pointer;transition:.15s;background:#fff;word-break:break-word}
.opt:hover{border-color:#c9d4ea;background:#fafbff}
.opt.on{border-color:var(--brand);background:var(--brand2)}
.opt input{width:auto;margin-top:0;flex:none}
.opt .key{font-weight:700;color:var(--brand);min-width:16px;flex:none;text-align:center}
.opt .tx{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:0 4px}
.opt .tx img{max-width:100%;height:auto;border-radius:6px;display:block;margin:4px 0}
.fill-input{width:auto;min-width:130px;display:inline-block;padding:4px 10px;margin:0 4px;
  border:none;border-bottom:2px solid var(--brand);border-radius:0;background:#f7f9ff}
.fill-rows{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.blank-line{display:inline-block;min-width:130px;border-bottom:2px solid var(--brand);background:#f7f9ff;padding:2px 8px;margin:0 4px;vertical-align:baseline}
.sheet{width:252px;flex:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--sh);position:sticky;top:76px}
.sheet-head{font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px;max-height:46vh;overflow:auto}
.dot{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;cursor:pointer;font-size:12px}
.dot.done{background:var(--brand2);border-color:#c3d3fb;color:var(--brand);font-weight:600}
.dot.cur{outline:2px solid var(--brand);outline-offset:1px}
.dot.marked{background:var(--warnbg);border-color:#ffd58a;color:var(--warn)}
.legend{font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.lgd{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.lgd.done{background:var(--brand2)}.lgd.cur{outline:2px solid var(--brand)}.lgd.marked{background:var(--warnbg);border-color:#ffd58a}
.sheet-actions{display:flex;gap:6px;flex-wrap:wrap}
/* ===== 成绩 ===== */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.bar-lab{width:62px;color:var(--sub);text-align:right;flex:none}
.bar{flex:1;height:16px;background:#f0f3fa;border-radius:6px;overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#6b9bff,#3b6ef6)}
.bar-val{width:52px;color:var(--sub);flex:none}
.score-big{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1.1}
.report-item .stem{margin-bottom:10px}
.ans-line{font-size:13px;margin:5px 0}
.ans-line .lab{color:var(--sub);display:inline-block;min-width:66px}
.analysis-box{background:#f7f9ff;padding:9px 12px;border-radius:9px;font-size:13px;color:#3a4560;margin-top:8px}
.analysis-box img{max-width:100%;height:auto;border-radius:6px;display:block;margin:6px 0}
/* ===== 数据 / 其他 ===== */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--sub)}
.kv dd{margin:0;word-break:break-word}
.help-list{margin:6px 0 0 18px;padding:0;font-size:13px;color:#3a4560}
.help-list li{margin:4px 0}
.preview-flag{background:var(--warn);color:#fff;border-radius:8px;padding:2px 9px;font-size:12px}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;flex-wrap:nowrap;overflow-x:auto}
  .brand{margin:0;flex:none}
  .brand b,.brand small{display:none}
  nav{flex-direction:row;overflow-x:auto;flex-wrap:nowrap;flex:1;min-width:0;scrollbar-width:none;gap:2px}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:7px 9px;font-size:13px;white-space:nowrap;flex:none}
  nav a .ni{width:auto}
  .side-foot{display:none}
  .main{padding:14px 14px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .exam-main{flex-direction:column;padding:12px}
  .sheet{width:100%;position:static;order:2}
  .qbox{padding:16px}
  .rule-row,.rule-head{grid-template-columns:1fr 1fr}
  .rule-head{display:none}
  .modal{max-height:94vh;border-radius:14px}
  .modal-body{padding:14px}
  .modal-foot{padding:11px 14px}
  .dots{grid-template-columns:repeat(6,1fr);max-height:none}
  .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .tbl-wrap table{min-width:720px}
  .tbl-wrap th,.tbl-wrap td{white-space:nowrap}
  .page-head h1{font-size:20px}
}
/* 导入校对预览：flex 容器内防止高度被压缩为 0（与 15-import.css 搭配） */
#modal-root .imp-list{flex:0 0 auto;min-height:120px}
/* ===== 试卷打印 ===== */
.paper-wrap{max-width:900px;margin:0 auto;padding:22px 16px 70px}
.paper-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px 38px;box-shadow:var(--sh)}
.paper-title{font-size:22px;text-align:center;margin:0 0 8px;font-weight:700;word-break:break-word}
.paper-meta{text-align:center;color:var(--sub);font-size:13px;margin-bottom:12px}
.paper-info{font-size:14px;margin:12px 0;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);word-break:break-word}
.paper-desc{font-size:13px;color:#3a4560;background:#f7f9ff;padding:9px 12px;border-radius:9px;margin:10px 0;white-space:pre-wrap}
.paper-questions{margin-top:16px}
.paper-q{margin:20px 0;break-inside:avoid;page-break-inside:avoid}
.paper-q-head{font-size:14px;margin-bottom:6px}
.paper-type{color:var(--sub);font-size:12px;margin-left:4px}
.paper-stem{font-size:14px;line-height:1.9;word-break:break-word}
.paper-stem img{max-width:100%;height:auto;border-radius:6px;display:block;margin:6px 0}
.paper-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 20px;margin:8px 0 2px}
.paper-opt{font-size:13.5px;line-height:1.85;word-break:break-word}
.paper-opt img{max-width:100%;height:auto;display:inline-block;vertical-align:middle;margin:2px 0}

/* ==================== 10-rich.css ==================== */
/* ==========================================================================
 * 10-rich.css — RT 富文本编辑器（前缀 .rt-；浅色风格，品牌色 #3b6ef6，圆角 10px）
 * 使用方：<div class="rte" data-rte="stem" data-placeholder="请输入题干">初始HTML</div>
 * ========================================================================== */

/* 外框 */
.rt-wrap {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #dbe3ee;
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.rt-wrap:focus-within {
  border-color: #3b6ef6;
  box-shadow: 0 0 0 3px rgba(59, 110, 246, .12);
}

/* 工具栏 */
.rt-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  background: #f7f9fd;
  border-bottom: 1px solid #e8eef7;
}
.rt-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: #3a4658;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.rt-btn:hover { background: #e8eefc; color: #3b6ef6; }
.rt-btn:active { background: #dbe5fd; }
.rt-btn.rt-b { font-weight: 700; }
.rt-btn.rt-i { font-style: italic; font-family: Georgia, "Times New Roman", serif; }
.rt-btn.rt-u { text-decoration: underline; }
.rt-btn.rt-primary { background: #3b6ef6; border-color: #3b6ef6; color: #fff; }
.rt-btn.rt-primary:hover { background: #2f5fe0; color: #fff; }
.rt-btn.rt-btn-ghost { color: #6b7a91; }

.rt-sep {
  width: 1px;
  height: 18px;
  margin: 0 2px;
  background: #dbe3ee;
}

/* URL 输入行（默认隐藏，点「图片 URL」展开） */
.rt-urlbar {
  display: none;
  flex-basis: 100%;
  align-items: center;
  gap: 6px;
  padding-top: 4px;
}
.rt-urlbar.rt-show { display: flex; }
.rt-url-input {
  flex: 1 1 180px;
  min-width: 120px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid #dbe3ee;
  border-radius: 8px;
  background: #fff;
  color: #1a2233;
  font-size: 13px;
  outline: none;
  box-sizing: border-box;
}
.rt-url-input:focus { border-color: #3b6ef6; box-shadow: 0 0 0 2px rgba(59, 110, 246, .12); }

/* 行内提示 / 压缩状态 */
.rt-hint { display: none; }
.rt-hint.rt-show {
  display: block;
  flex-basis: 100%;
  padding: 2px 4px 0;
  color: #6b7a91;
  font-size: 12px;
  line-height: 1.5;
  word-break: break-all;
}
.rt-hint.rt-bad { color: #c0392b; }

/* 隐藏的文件选择框（由「插入图片」按钮触发） */
.rt-file { display: none; }

/* 可编辑区 */
.rt-edit {
  min-height: 96px;
  max-height: 320px;
  overflow: auto;
  padding: 10px 12px;
  outline: none;
  background: #fff;
  color: #1a2233;
  font-size: 14px;
  line-height: 1.65;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.rt-edit:empty { min-height: 96px; }
.rt-edit p { margin: 0 0 6px; }
.rt-edit p:last-child { margin-bottom: 0; }
.rt-edit div { margin: 0; }
.rt-edit ul, .rt-edit ol { margin: 4px 0; padding-left: 22px; }
.rt-edit li { margin: 2px 0; }

/* 空内容占位提示 */
.rt-edit.rt-empty::before {
  content: attr(data-placeholder);
  color: #9aa4b2;
  pointer-events: none;
  user-select: none;
}

/* 工具栏：尺寸/对齐按钮的激活态 + 分组小标题 */
.rt-btn.rt-on {
  background: #e8eefc;
  color: #3b6ef6;
  border-color: #c9d8fb;
}
.rt-btn.rt-on:hover { background: #dbe5fd; color: #2f5fe0; }
.rt-group-label {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 2px 0 4px;
  color: #8a97ab;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
  user-select: none;
}

/* 编辑区图片：自适应宽度 + 选中态 */
.rt-edit img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 6px 0;
  border-radius: 6px;
  cursor: pointer;
}
.rt-edit img.rt-img-sel {
  outline: 2px solid #3b6ef6;
  outline-offset: 2px;
  box-shadow: 0 0 0 3px rgba(59, 110, 246, .15);
}

/* ------------------------------------------------------------------ *
 * 图片尺寸 / 对齐（RT.render 只读展示与编辑器共用）
 * 选择器只用 img[data-*] 全局范围，不依赖容器是否带 .rt- 前缀；
 * 双属性写法提高特异性，确保覆盖 .stem img / .opt .tx img / .analysis-box img
 * 等容器既有样式（00-base.css）。
 * 无 data-size 的旧图片不匹配任何规则，仍按容器原有 max-width:100% 显示。
 * ------------------------------------------------------------------ */
img[data-size] {
  max-width: 100%;
  height: auto;
  box-sizing: border-box;
}
img[data-size][data-size="sm"] { width: 40%; }
img[data-size][data-size="md"] { width: 70%; }
img[data-size][data-size="full"] { width: 100%; }
img[data-size][data-size="auto"] { width: auto; max-width: 100%; }

img[data-align] { display: block; }
img[data-align][data-align="left"] { margin-left: 0; margin-right: auto; }
img[data-align][data-align="center"] { margin-left: auto; margin-right: auto; }
img[data-align][data-align="right"] { margin-left: auto; margin-right: 0; }

/* 编辑区内的通用排版（与渲染展示保持一致） */
.rt-edit s, .rt-edit del { text-decoration: line-through; }
.rt-edit sub, .rt-edit sup { font-size: 75%; }

/* 移动端 / 窄弹窗（720px 以下） */
@media (max-width: 720px) {
  .rt-toolbar { gap: 3px; padding: 5px 6px; }
  .rt-btn { height: 26px; padding: 0 6px; font-size: 12px; }
  .rt-edit { min-height: 80px; max-height: 240px; padding: 8px 10px; }
  .rt-urlbar { flex-wrap: wrap; }
  .rt-group-label { padding: 0 1px; font-size: 11px; }
}

/* ==================== 15-import.css ==================== */
/* ==================== 15. 文档导入（IMP）样式 ==================== */
.imp { display: flex; flex-direction: column; gap: 10px; }
/* 关键：.imp 在弹窗内有 max-height + overflow:auto，作为 flex 容器的直接子项
   若允许收缩（默认 flex-shrink:1），带 overflow:auto 的 .imp-list 会被压成 0 高，
   出现「只看到表头、没有数据行」。统一禁止直接子项收缩，由 .imp 外层滚动。 */
.imp > * { flex: 0 0 auto; }

.imp-drop {
  border: 2px dashed #c7d2e5;
  border-radius: 12px;
  padding: 16px 14px;
  text-align: center;
  background: #f8faff;
  transition: border-color .15s ease, background .15s ease;
}
.imp-drop.over { border-color: #3b7cf6; background: #eef4ff; }
.imp-drop.imp-busy { opacity: .72; }
.imp-drop-t { font-size: 15px; font-weight: 600; color: #1f2a44; }
.imp-drop-s { font-size: 12px; line-height: 1.6; color: #6b7a99; margin: 6px 0 10px; }
.imp-file { display: none; }

.imp-paste textarea { min-height: 118px; font-family: inherit; }
.imp-tools { align-items: center; flex-wrap: wrap; gap: 10px; }
.imp-hint { font-size: 12px; }

.imp-files { display: flex; flex-direction: column; gap: 6px; }
.imp-file-item {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 1px solid #e2e8f4;
  border-radius: 9px;
  background: #fff;
  font-size: 13px;
}
.imp-file-item.busy { border-color: #9cc0ff; background: #f4f8ff; }
.imp-file-item.ok { border-color: #b6e2c6; background: #f5fcf7; }
.imp-file-item.bad { border-color: #f0b9b9; background: #fff7f7; }
.imp-kind {
  font-size: 11px;
  text-align: center;
  padding: 2px 4px;
  border-radius: 5px;
  background: #eef2fb;
  color: #40557d;
  white-space: nowrap;
}
.imp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #22304d; }
.imp-file-status { font-size: 12px; color: #5b6b8c; white-space: nowrap; }
.imp-file-item.bad .imp-file-status { color: #b23a3a; }
.imp-file-item.ok .imp-file-status { color: #237a44; }
.imp-file-warn {
  grid-column: 1 / -1;
  font-size: 12px;
  line-height: 1.55;
  color: #8a6a1e;
  background: #fff9e9;
  border-radius: 6px;
  padding: 6px 8px;
  word-break: break-word;
}

.imp-progress {
  position: relative;
  height: 20px;
  border-radius: 10px;
  background: #edf1f9;
  overflow: hidden;
}
.imp-progress[hidden] { display: none; }
.imp-progress i {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  background: linear-gradient(90deg, #6ea2ff, #3b7cf6);
  transition: width .18s ease;
}
.imp-progress span {
  position: relative;
  display: block;
  font-size: 11px;
  line-height: 20px;
  text-align: center;
  color: #2a3a5c;
  z-index: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 8px;
}

.imp-status { font-size: 13px; color: #5b6b8c; min-height: 18px; }
.imp-status.ok { color: #237a44; }
.imp-status.warn { color: #a06b00; }
.imp-summary { font-size: 13px; color: #22304d; }
.imp-warn-all {
  margin-top: 8px;
  padding: 8px 10px;
  border: 1px solid #f1dfae;
  border-radius: 8px;
  background: #fffcf2;
  font-size: 12px;
  color: #7d6419;
}
.imp-warn-all ul { margin: 4px 0 0 18px; padding: 0; }
.imp-warn-all li { margin: 2px 0; line-height: 1.5; word-break: break-word; }

.imp-list {
  flex: 0 0 auto;
  min-height: 120px;
  max-height: 320px;
  overflow: auto;
}
.imp-list:empty { min-height: 0; max-height: none; display: none; }
.imp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.imp-table th, .imp-table td {
  padding: 6px 8px;
  border-bottom: 1px solid #eef1f8;
  text-align: left;
  vertical-align: top;
}
.imp-table th { position: sticky; top: 0; background: #f7f9fe; font-weight: 600; color: #40557d; }
.imp-table tr.imp-dup td { color: #98a3b8; }
.imp-tag-dup {
  display: inline-block;
  font-size: 11px;
  color: #a06b00;
  background: #fff4d6;
  border-radius: 4px;
  padding: 0 5px;
}
.imp-tag-missing {
  display: inline-block;
  font-size: 11px;
  color: #b23a3a;
  background: #ffe8e8;
  border-radius: 4px;
  padding: 0 5px;
}
.imp-opts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  align-items: center;
}
.imp-skip {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: #40557d;
}
.imp-skip input { width: auto; }
.imp-table select.imp-type-sel {
  width: 100%;
  min-width: 74px;
  padding: 3px 4px;
  font-size: 12px;
  border-radius: 6px;
  border: 1px solid #d6deec;
  background: #fff;
  color: #22304d;
}
.imp-table input.imp-ans {
  width: 100%;
  min-width: 96px;
  padding: 3px 6px;
  font-size: 12px;
  border-radius: 6px;
  border: 1px solid #d6deec;
  background: #fff;
  color: #22304d;
}
.imp-table input.imp-ans:focus,
.imp-table select.imp-type-sel:focus {
  outline: 2px solid #b9d2ff;
  border-color: #6ea2ff;
}
.imp-table tr.imp-excluded td { opacity: .5; }
.imp-table tr.imp-excluded td.imp-pick { opacity: 1; }
.imp-table td.imp-pick { text-align: center; }
.imp-table td.imp-pick input { width: auto; }

.modal-body .imp { max-height: 62vh; overflow: auto; padding-right: 2px; }

@media (max-width: 860px) {
  .imp-file-item {
    grid-template-columns: 46px minmax(0, 1fr) auto;
    grid-template-areas:
      "kind name rm"
      "kind status status"
      "warn warn warn";
  }
  .imp-kind { grid-area: kind; }
  .imp-name { grid-area: name; }
  .imp-file-status { grid-area: status; white-space: normal; }
  .imp-file-item > button[data-imp="rm"] { grid-area: rm; }
  .imp-file-warn { grid-area: warn; }
  .imp-list { max-height: 42vh; }
  .modal-body .imp { max-height: 66vh; }
  .imp-drop { padding: 12px 10px; }
  .imp-paste textarea { min-height: 92px; }
  .imp-table { font-size: 12px; }
  .imp-table th, .imp-table td { padding: 5px 5px; }
  .imp-table th:nth-child(2), .imp-table td:nth-child(2) { width: 82px; }
  .imp-table th:nth-child(4), .imp-table td:nth-child(4) { width: 106px; }
  .imp-table th:nth-child(5), .imp-table td:nth-child(5) { display: none; }
  .imp-opts { flex-direction: column; align-items: flex-start; }
}

/* ==================== 16-theme.css ==================== */
/* ==========================================================================
 * 16-theme.css — THM 答卷个性化主题（背景 / Logo / 主题色）
 * 契约：docs/ROUND3-CONTRACTS.md §4
 *
 * 容器约定：答卷入口 / 答题页 / 成绩单 / 打印试卷外层加
 *   <div class="exam-theme" style="${THM.style(theme)}">…</div>
 * THM.style 输出：
 *   --exam-accent / --exam-bg / --exam-bg-image（url("data:...") 或 none）
 *   以及派生色 --exam-accent-soft / --exam-accent-dark
 * 本文件把 --brand / --brand2 映射到主题色，使基础组件（按钮 / 计时器 /
 * 选项选中 / 答题卡 / 链接 / 输入框焦点）自动跟随 accent。
 * ========================================================================== */

/* ------------------------------------------------------------------ *
 * 一、主题容器：颜色变量映射 + 背景
 * ------------------------------------------------------------------ */
.exam-theme {
  --brand: var(--exam-accent, #3b6ef6);
  --brand2: var(--exam-accent-soft, #eaf0ff);
  background-color: var(--exam-bg, #f4f6fb);
  background-image: var(--exam-bg-image, none);
  background-size: var(--exam-bg-size, cover);
  background-position: center center;
  background-repeat: var(--exam-bg-repeat, no-repeat);
  background-attachment: fixed;
  min-height: 100%;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
/* 可选遮罩：Lead 在带背景图的容器上追加 class="exam-theme thm-dim" 提高文字可读性 */
.exam-theme.thm-dim {
  background-image: linear-gradient(rgba(255, 255, 255, .66), rgba(255, 255, 255, .66)), var(--exam-bg-image, none);
}

/* 主题色微调（基础组件已用 var(--brand)/var(--brand2)，这里只补硬编码色） */
.exam-theme a { color: var(--brand); }
.exam-theme .btn.primary { background: var(--brand); border-color: var(--brand); }
.exam-theme .btn.primary:hover { background: var(--exam-accent-dark, var(--brand)); border-color: var(--exam-accent-dark, var(--brand)); }
.exam-theme .btn.primary:active { background: var(--exam-accent-dark, var(--brand)); }
.exam-theme input:focus,
.exam-theme select:focus,
.exam-theme textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--exam-accent-soft, rgba(59, 110, 246, .12));
}
.exam-theme .timer { color: var(--brand); }
.exam-theme .dot.done { border-color: var(--brand2); }
.exam-theme .dot.cur { outline-color: var(--brand); }
.exam-theme .fill-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--exam-accent-soft, rgba(59, 110, 246, .12)); }
.exam-theme ::selection { background: var(--exam-accent-soft, #eaf0ff); }

/* ------------------------------------------------------------------ *
 * 二、Logo / 机构 / 标题 / 页脚（THM.headerHtml 输出；入口、答题页、成绩单、打印）
 * ------------------------------------------------------------------ */
.thm-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
  margin-bottom: 14px;
  background: rgba(255, 255, 255, .92);
  border: 1px solid var(--line);
  border-radius: var(--r, 14px);
  box-shadow: var(--sh, 0 2px 12px rgba(23, 38, 80, .06));
}
.thm-head-main {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.thm-logo {
  flex: none;
  max-width: 180px;
  width: auto;
  object-fit: contain;
  border-radius: 8px;
  background: #fff;
}

/* Logo 艺术字（ROUND4）：字体白名单类 + 内联字号/颜色 */
.thm-logo-text {
  display: inline-flex;
  align-items: center;
  flex: none;
  max-width: 70%;
  font-weight: 700;

   建议 DOM（Lead 集成时使用这些类名即可）：
   <div class="share-pane">
     <p class="share-lead">…</p>
     <div class="share-summary"><div><span class="k">题数</span><b class="v">12</b></div>…</div>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">本系统需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。</div></noscript>
<script>
/* ==================== 00-utils.js ==================== */
/* ==================== 0. 基础工具 ==================== */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.from((r || document).querySelectorAll(s)); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}
function uid(p){ return (p || 'id_') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function now(){ return Date.now(); }
const TYPES = { single:'单选题', multiple:'多选题', judge:'判断题', fill:'填空题', short:'简答题' };
const LETTERS = 'ABCDEFGH';

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'ok');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- 弹窗 ---------- */
function openModal(title, body, footer, opts){
  opts = opts || {};
  const root = $('#modal-root');
  if(!root) return null;
  root.innerHTML = `<div class="mask" data-mask="1">
    <div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3>
        <button type="button" class="x" data-act="modal.close" aria-label="关闭">×</button></div>
      <div class="modal-body">${body || ''}</div>
      ${footer ? '<div class="modal-foot">' + footer + '</div>' : '<div class="modal-foot"><button type="button" class="btn" data-act="modal.close">关闭</button></div>'}
    </div></div>`;
  const modal = $('.modal', root);
  if(typeof opts.onMount === 'function') opts.onMount(modal);
  // 自动聚焦（不打扰已有焦点）
  const auto = $('[autofocus]', modal);
  if(auto) setTimeout(() => { try { auto.focus(); } catch(e){} }, 30);
  return modal;
}
function closeModal(){ const root = $('#modal-root'); if(root) root.innerHTML = ''; }
function modalRoot(){ return $('#modal-root'); }

/** 统一确认弹窗（替代 window.confirm，便于测试与移动端）；onOk 返回 false 时不关闭 */
function confirmModal(title, message, onOk, opt){
  opt = opt || {};
  const okText = opt.okText || '确定';
  const danger = opt.danger !== false;
  const modal = openModal(title, `<p style="margin:2px 0 4px">${message}</p>`, `
    <button type="button" class="btn" data-act="modal.close">取消</button>
    <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-confirm-ok="1">${esc(okText)}</button>`, {
    onMount(m){
      const btn = $('[data-confirm-ok]', m);
      btn.addEventListener('click', () => {
        const ret = typeof onOk === 'function' ? onOk() : true;
        if(ret !== false){ closeModal(); }
      });
      setTimeout(() => { try { btn.focus(); } catch(e){} }, 30);
    }
  });
  return modal;
}
/** 单输入弹窗（替代 window.prompt） */
function promptModal(title, label, value, onOk, opt){
  opt = opt || {};
  const modal = openModal(title, `
    <label class="fld"><span>${esc(label)}</span>
      <input id="prompt-input" data-autofocus value="${esc(value == null ? '' : value)}" placeholder="${esc(opt.placeholder || '')}">
    </label>
    ${opt.help ? `<p class="fld-help">${esc(opt.help)}</p>` : ''}`, `
    <button type="button" class="btn" data-act="modal.close">取消</button>
    <button type="button" class="btn primary" data-prompt-ok="1">${esc(opt.okText || '确定')}</button>`, {
    onMount(m){
      const input = $('#prompt-input', m);
      const submit = () => {
        const v = input.value.trim();
        if(!v && !opt.allowEmpty){ toast('请输入内容', 'bad'); input.focus(); return; }
        const ret = typeof onOk === 'function' ? onOk(v) : true;
        if(ret !== false) closeModal();
      };
      $('[data-prompt-ok]', m).addEventListener('click', submit);
      input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
      setTimeout(() => { try { input.focus(); input.select(); } catch(e){} }, 30);
    }
  });
  return modal;
}

/* ---------- 复制 / 下载 ---------- */
function copyText(text){
  return new Promise(resolve => {
    const fallback = () => {
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand && document.execCommand('copy');
        ta.remove(); resolve(!!ok);
      }catch(e){ resolve(false); }
    };
    if(navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
      navigator.clipboard.writeText(text).then(() => resolve(true)).catch(fallback);
    } else fallback();
  });
}
async function copyWithToast(text, okMsg){
  const ok = await copyText(text);
  toast(ok ? (okMsg || '已复制到剪贴板') : '复制失败，请手动选择复制', ok ? 'ok' : 'bad');
  return ok;
}
/** 文件名安全化：去掉 Windows 非法字符，避免含题库名/考试名的下载失败 */
function safeFileName(name){
  let s = String(name == null ? '' : name)
    .replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_')
    .replace(/^\.+/, '')
    .trim()
    .slice(0, 120);
  return s || 'download';
}
function download(filename, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/csv;charset=utf-8' });
  downloadBlob(filename, blob);
}
function downloadBlob(filename, blob){
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = safeFileName(filename);
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  }catch(e){ toast('下载失败：' + e.message, 'bad'); return false; }
}
function toCSV(rows){
  const cell = c => {
    let s = String(c == null ? '' : c);
    // 防 CSV 公式注入：以 = + - @ 开头的文本加前导单引号
    if(/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}

/* ---------- 格式化 ---------- */
function fmtDate(t){
  if(!t) return '—';
  const d = new Date(t);
  if(isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDateFull(t){
  if(!t) return '—';
  const d = new Date(t);
  if(isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtDur(ms){
  ms = Math.max(0, ms); const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (h ? p(h) + ':' : '') + p(m) + ':' + p(ss);
}
function fmtDurText(sec){
  if(!sec) return '—';
  sec = Math.round(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m >= 60){ const h = Math.floor(m / 60); return `${h} 小时 ${m % 60} 分`; }
  return m ? `${m} 分 ${s} 秒` : `${s} 秒`;
}
function bytesText(n){
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
function debounce(fn, ms){
  let t = null;
  const wrapped = (...args) => { clearTimeout(t); t = setTimeout(() => { t = null; fn(...args); }, ms); };
  wrapped.cancel = () => { clearTimeout(t); t = null; };
  wrapped.flush = (...args) => { clearTimeout(t); t = null; fn(...args); };
  return wrapped;
}
function norm(s){
  return String(s == null ? '' : s)
    .replace(/[\s\u3000]+/g, '')
    .replace(/[\p{P}\p{S}]/gu, '')
    .toLowerCase();
}
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function clone(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }
function sum(a){ return a.reduce((s, x) => s + (Number(x) || 0), 0); }
function pct(a, b){ return b ? +(a / b * 100).toFixed(1) : 0; }
function trunc(s, n){ s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '…' : s; }

}

function firstAdminId(){

function demoBankId(id){ return id === 'bank_general' || id === 'bank_safety'; }
function demoExamId(id){ return id === 'exam_demo' || id === 'exam_draft_demo'; }
function makeEmptyDB(){ return { version:5, banks:[], questions:[], exams:[], responses:[], groups:[], meta:{ updatedAt:0, updatedBy:'' } }; }
function mergeWorkspaceInto(target, src, fallbackOwner){
  src = src || {};
  target.groups = Array.isArray(target.groups) ? target.groups : [];
  if(Array.isArray(src.groups)){
    src.groups.forEach(g => {
      if(g && g.id && !target.groups.some(x => x.id === g.id)){
        target.groups.push({ id:g.id, name:String(g.name || '未命名群').slice(0, 40), memberIds:Array.isArray(g.memberIds) ? g.memberIds.filter(Boolean) : [], createdAt:Number(g.createdAt) || now() });
      }
    });
  }
  const banks = Array.isArray(src.banks) ? src.banks : [];
  const questions = Array.isArray(src.questions) ? src.questions : [];
  const exams = Array.isArray(src.exams) ? src.exams : [];
  const responses = Array.isArray(src.responses) ? src.responses : [];
  const bankMap = new Map(), qMap = new Map(), eMap = new Map();
  const bankIds = new Set(target.banks.map(b => b.id));
  const qIds = new Set(target.questions.map(q => q.id));
  const eIds = new Set(target.exams.map(e => e.id));
  banks.forEach(b => {
    if(!b || !b.id || demoBankId(b.id)) return;
    const ownerId = b.ownerId || fallbackOwner || firstAdminId();
    let id = b.id;
    if(bankIds.has(id)) id = uid('bank_');
    bankIds.add(id); bankMap.set(b.id, id);
    target.banks.push(Object.assign({}, b, {
      id, ownerId, ownerName: b.ownerName || userName(ownerId),
      access: (b.access === 'public' || b.access === 'users') ? b.access : 'private',
      viewers: Array.isArray(b.viewers) ? b.viewers.filter(Boolean) : [],
      viewerGroups: Array.isArray(b.viewerGroups) ? b.viewerGroups.filter(Boolean) : [],
      hidden: !!b.hidden,
      createdAt: Number(b.createdAt) || now(), updatedAt: Number(b.updatedAt) || now()
    }));
  });
  questions.forEach(q => {
    if(!q || !q.bankId) return;
    let bankId = bankMap.get(q.bankId);
    if(!bankId){
      // 题库缺失的题目不丢弃：归入恢复题库，避免历史数据/IDB 恢复时静默丢题
      if(demoBankId(q.bankId)) return;
      bankId = 'bank_recovered_' + String(q.bankId).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
      if(!target.banks.some(b => b.id === bankId)){

  db.exams.forEach(e => { const old = e.id; e.id = safeNewId('ex_', old, seenE); if(old !== e.id) eMap.set(old, e.id); });

/* ==================== 2. 判分引擎 ==================== */
function gradeItem(q, ans, exam){
  const full = Number(q.score) || 0;
  if(q.type === 'single' || q.type === 'judge'){
    const ok = ans != null && String(ans) === String(q.answer);
    return { score: ok ? full : 0, result: ok ? 'right' : 'wrong' };
  }
  if(q.type === 'multiple'){
    const a = new Set(Array.isArray(ans) ? ans.map(String) : []);
    const c = new Set((q.answer || []).map(String));
    if(!a.size) return { score:0, result:'wrong' };
    const exact = a.size === c.size && [...a].every(x => c.has(x));
    if(exact) return { score:full, result:'right' };
    const noWrong = [...a].every(x => c.has(x));
    if(noWrong && exam && exam.settings && exam.settings.partialCredit !== false && c.size){
      return { score:+(full * a.size / c.size).toFixed(2), result:'partial' };
    }
    return { score:0, result:'wrong' };
  }
  if(q.type === 'fill'){
    const acc = (q.answer || []).map(x => Array.isArray(x) ? x : [x]);
    const given = Array.isArray(ans) ? ans : [];
    let hit = 0;
    acc.forEach((list, i) => {
      const g = norm(given[i]);
      if(g && list.some(x => norm(x) === g)) hit++;
    });
    const sc = acc.length ? +(full * hit / acc.length).toFixed(2) : 0;
    return { score:sc, result: acc.length && hit === acc.length ? 'right' : (hit ? 'partial' : 'wrong'), hit, total: acc.length };
  }
  return { score:0, result:'manual' };
}
function gradeResponse(exam, resp){
  const safeExam = exam || { settings:{} };
  const items = (resp.paper || []).map(p => {
    const q = Q(p.qid);
    if(!q) return null;
    const ans = resp.answers ? resp.answers[q.id] : undefined;
    const g = gradeItem(q, ans, safeExam);
    const isShort = q.type === 'short';
    const manual = resp.manualScores ? resp.manualScores[q.id] : undefined;
    const score = isShort ? (manual != null ? Math.min(Number(q.score) || 0, Math.max(0, Number(manual))) : 0) : g.score;
    return {
      qid:q.id,
      score:+Number(score).toFixed(2),
      full:Number(q.score) || 0,
      result: isShort ? (manual != null ? 'manual-graded' : 'manual') : g.result,
      detail:g
    };
  }).filter(Boolean);
  const score = +items.reduce((s, i) => s + i.score, 0).toFixed(2);
  return { items, score, needManual: items.some(i => i.result === 'manual') };
}

  }
  if(q.type === 'fill'){
    return Array.isArray(q.answer) && q.answer.some(l => Array.isArray(l) ? l.some(x => String(x).trim()) : String(l || '').trim());
  }
  if(q.type === 'short') return true;
  return false;
}
function invalidReason(q){
  if(!q) return '题目不存在';
  if(isBlankRich(q.stem || '')) return '题干为空';
  if(['single','judge'].includes(q.type) && !q.answer) return '缺少正确答案';
  if(q.type === 'multiple' && !(Array.isArray(q.answer) && q.answer.length)) return '缺少正确答案';
  if(q.type === 'fill' && !(Array.isArray(q.answer) && q.answer.some(l => (Array.isArray(l) ? l.length : String(l).trim())))) return '缺少填空答案';
  if(['single','multiple','judge'].includes(q.type) && (q.options || []).length < 2) return '选项不足';
  if(['single','multiple'].includes(q.type) && !(q.options || []).every(o => !isBlankRich(o.text || ''))) return '存在空选项';
  return '待完善';
}
function matchRule(q, r){
  return (!r.bankId || q.bankId === r.bankId)
      && (!r.type || q.type === r.type)
      && (!r.category || q.category === r.category)
      && (!r.difficulty || String(q.difficulty) === String(r.difficulty));
}
function poolOfRule(r){ return DB.questions.filter(q => matchRule(q, r)); }
/** 仅完整可考的题（用于组卷/题量/总分估算） */
function validPoolOfRule(r){ return DB.questions.filter(q => matchRule(q, r) && isQuestionValid(q)); }
function buildPaper(exam){
  if(exam.mode === 'fixed') return (exam.fixed || []).filter(id => { const q = Q(id); return q && isQuestionValid(q); }).map(id => ({ qid:id }));
  let out = [];
  (exam.rules || []).forEach(r => {
    const pool = shuffle(validPoolOfRule(r));
    out = out.concat(pool.slice(0, Number(r.count) || 0).map(q => ({ qid:q.id })));
  });
  const seen = new Set();
  return out.filter(p => {
    if(seen.has(p.qid)) return false;
    seen.add(p.qid);
    return true;
  });
}
/** 预计题量（考虑题库实际可用且完整的题目数量） */
function planCount(exam){
  if(exam.mode === 'fixed') return (exam.fixed || []).filter(id => { const q = Q(id); return q && isQuestionValid(q); }).length;
  let n = 0;
  (exam.rules || []).forEach(r => { n += Math.min(Number(r.count) || 0, validPoolOfRule(r).length); });
  return n;
}
/** 规则期望题量（不考虑题库不足） */
function wantedCount(exam){
  if(exam.mode === 'fixed') return (exam.fixed || []).length;
  return (exam.rules || []).reduce((n, r) => n + (Number(r.count) || 0), 0);
}
function estFull(exam){
  if(exam.mode === 'fixed') return (exam.fixed || []).reduce((s, id) => { const q = Q(id); return s + (q && isQuestionValid(q) ? (q.score || 0) : 0); }, 0);
  let t = 0;
  (exam.rules || []).forEach(r => {
    const pool = validPoolOfRule(r);
    const avg = pool.length ? pool.reduce((s, q) => s + (q.score || 0), 0) / pool.length : 0;
    t += avg * Math.min(Number(r.count) || 0, pool.length);
  });
  return Math.round(t);
}
function attemptsUsed(examId, userId){
  return DB.responses.filter(r => r.examId === examId && r.status === 'submitted' && !r.preview
    && (!userId || r.userId === userId)).length;
}
function attemptsLeft(exam, userId){
  const s = exam.settings || {};
  if(!(s.attempts > 0)) return Infinity;
  return Math.max(0, s.attempts - attemptsUsed(exam.id, userId));
}
/** 开放时间与状态检查：返回 {ok, reason} */
function examAvailability(exam, preview){
  if(!exam) return { ok:false, reason:'考试不存在' };
  if(preview) return { ok:true };
  if(exam.status === 'draft') return { ok:false, reason:'该考试尚未发布，暂时无法作答。' };
  if(exam.status === 'closed') return { ok:false, reason:'该考试已结束，无法继续作答。' };
  const s = exam.settings || {};
  const t = now();
  if(s.startAt && t < Number(s.startAt)) return { ok:false, reason:'考试尚未开放，开放时间：' + fmtDate(s.startAt) };
  if(s.endAt && t > Number(s.endAt)) return { ok:false, reason:'考试已过开放时间（截止 ' + fmtDate(s.endAt) + '）' };
  return { ok:true };
}
function paperDeadline(exam, resp){
  const s = exam.settings || {};
  if(!s.duration) return 0;
  return (resp.startedAt || now()) + Number(s.duration) * 60000;
}

/* ==================== 选项展示（乱序后仍可回溯） ==================== */
function optionView(q, resp){
  const orig = q.options || [];
  const order = resp && resp.optionOrder ? resp.optionOrder[q.id] : null;
  if(!order || q.type === 'judge') return orig.map((o, i) => ({ key:LETTERS[i], orig:o.key, text:o.text }));
  const map = new Map(orig.map(o => [o.key, o]));
  const used = new Set();
  const out = [];
  order.forEach(k => {
    if(map.has(k) && !used.has(k)){ used.add(k); out.push({ key:LETTERS[out.length], orig:k, text:map.get(k).text }); }
  });
  orig.forEach(o => { if(!used.has(o.key)) out.push({ key:LETTERS[out.length], orig:o.key, text:o.text }); });
  return out;
}
/** 把存储的答案（原始选项 key）转换为考生看到的展示字母 */
function displayAnswer(q, ans, resp){
  if(ans == null || ans === '') return '';
  if(q.type === 'single' || q.type === 'judge'){
    const view = optionView(q, resp);
    const hit = view.find(v => v.orig === ans);
    return hit ? hit.key : String(ans);
  }
  if(q.type === 'multiple'){
    const views = optionView(q, resp);
    return (Array.isArray(ans) ? ans : []).map(k => { const h = views.find(v => v.orig === k); return h ? h.key : k; }).join('');
  }
  if(q.type === 'fill') return Array.isArray(ans) ? ans.map(x => Array.isArray(x) ? x.join(' / ') : String(x ?? '')).join(' | ') : String(ans ?? '');
  return String(ans ?? '');
}
/** 标准答案展示（展示字母 / 填空 / 简答富文本） */
function displayCorrect(q, resp){
  if(q.type === 'fill') return (q.answer || []).map(l => (Array.isArray(l) ? l : [l]).join(' / ')).join(' | ');
  if(q.type === 'multiple') return displayAnswer(q, q.answer, resp);
  if(q.type === 'single' || q.type === 'judge') return displayAnswer(q, q.answer, resp);
  return q.answer || '';
}

/* ==================== 06b-storage.js ==================== */
/* ============================================================================
 * 06b-storage.js — STORE：IndexedDB 大容量持久化（学生考试系统 v3）
 * ----------------------------------------------------------------------------
 * 背景：localStorage 通常只有 ~5MB，题库含大量图片 dataURL 时会超限。本模块
 * 在 IndexedDB 上提供一个极简的 key-value 大容量后端，供数据层在 localStorage
 * 写满时继续保存（lead 在 05-data.js 中集成）。
 *
 * 对外接口（见 docs/ROUND3-CONTRACTS.md 第 3 节）：
 *   STORE.available()        -> boolean             // 同步判断 indexedDB 是否可用
 *   STORE.get(key)           -> Promise<any|null>   // 读；失败/不存在返回 null
 *   STORE.set(key, value)    -> Promise<boolean>    // 写；失败 resolve(false)，绝不 reject
 *   STORE.del(key)           -> Promise<boolean>    // 删；失败 resolve(false)
 *   STORE.usage()            -> Promise<{idbBytes, quota, usage, backend:'idb'}|null>
 *
 * 约定与降级策略：
 *   - 数据库 zhijuan-store / object store kv / 版本 1；
 *   - 隐私模式、file:// 限制、配额超限等所有异常都在内部捕获并降级；
 *   - 一旦确认 IndexedDB 不可用（打开失败），available() 返回 false，后续
 *     调用直接快速降级，不再反复尝试打开；
 *   - 连接可能被浏览器/其它标签页关闭，操作失败时会重建连接并重试一次；
 *   - 不依赖任何库；顶层只暴露 const STORE，不访问 window/document；
 *   - 文件末尾导出 module.exports 以便 Node 单测加载（浏览器中该分支不执行）。
 * ========================================================================== */

const STORE = (function () {
  'use strict';

  const DB_NAME = 'zhijuan-store';
  const OBJECT_STORE = 'kv';
  const DB_VERSION = 1;
  const OPEN_TIMEOUT_MS = 8000;

  let dbInstance = null;   // 已打开的 IDBDatabase
  let dbPromise = null;    // 正在打开中的 Promise（复用以避免并发重复 open）
  let broken = false;      // 是否已确认 IndexedDB 不可用（进入永久降级）

  /* --------------------------------------------------------------------------
   * 一、环境探测（全部在函数内判断，模块顶层不碰 window/document）
   * ------------------------------------------------------------------------ */

  function getIndexedDB() {
    try {
      if (typeof indexedDB !== 'undefined' && indexedDB) return indexedDB;
    } catch (e) { /* ignore */ }
    try {
      if (typeof window !== 'undefined' && window && window.indexedDB) return window.indexedDB;
    } catch (e) { /* ignore */ }
    try {
      if (typeof globalThis !== 'undefined' && globalThis && globalThis.indexedDB) return globalThis.indexedDB;
    } catch (e) { /* ignore */ }
    return null;
  }

  function getNavigator() {
    try {
      if (typeof navigator !== 'undefined' && navigator) return navigator;
    } catch (e) { /* ignore */ }
    try {
      if (typeof window !== 'undefined' && window && window.navigator) return window.navigator;
    } catch (e) { /* ignore */ }
    return null;
  }

  // 定时器在部分受限环境（如 vm/jsdom 某些上下文）可能不存在，做安全包装
  function setTimer(fn, ms) {
    try {
      if (typeof setTimeout === 'function') return setTimeout(fn, ms);
    } catch (e) { /* ignore */ }
    return null;
  }

  function clearTimer(timer) {
    try {
      if (timer !== null && timer !== undefined && typeof clearTimeout === 'function') clearTimeout(timer);
    } catch (e) { /* ignore */ }
  }

  /**
   * IndexedDB 是否可用（同步）。
   * 只做能力判断；隐私模式下 indexedDB 对象可能存在但 open 会失败，那种情况
   * 会在首次读写失败后置 broken，available() 随之为 false。
   */
  function available() {
    if (broken) return false;
    try {
      const idb = getIndexedDB();
      return !!(idb && typeof idb.open === 'function');
    } catch (e) {
      return false;
    }
  }

  /* --------------------------------------------------------------------------
   * 二、打开数据库
   * ------------------------------------------------------------------------ */

  function resetConnection() {
    const db = dbInstance;
    dbInstance = null;
    dbPromise = null;
    try {
      if (db && typeof db.close === 'function') db.close();
    } catch (e) { /* ignore */ }
  }

  function markBroken() {
    broken = true;
    try {
      if (dbInstance && typeof dbInstance.close === 'function') dbInstance.close();
    } catch (e) { /* ignore */ }
    dbInstance = null;
    dbPromise = null;
  }

  /**
   * 打开（必要时创建）数据库，返回 Promise<IDBDatabase|null>。
   * 失败时 resolve(null) 并置 broken，绝不 reject。
   */
  function openDB() {
    if (dbInstance) return Promise.resolve(dbInstance);
    if (dbPromise) return dbPromise;
    if (!available()) return Promise.resolve(null);

    dbPromise = new Promise(function (resolve) {
      let settled = false;
      let timer = null;

      function finish(db) {
        if (settled) return;
        settled = true;
        clearTimer(timer);
        if (db) {
          dbInstance = db;
          try {
            // 其它标签页要升级/删除数据库时主动让路，随后操作会重新打开
            db.onversionchange = function () {
              resetConnection();
            };
          } catch (e) { /* ignore */ }
        }
        resolve(db || null);
      }

      function failOpen() {
        if (settled) return;
        settled = true;
        clearTimer(timer);
        markBroken();
        resolve(null);
      }

      // 某些实现（隐私模式、配额耗尽）可能既不 success 也不 error，超时保护
      timer = setTimer(failOpen, OPEN_TIMEOUT_MS);

      let req;
      try {
        const idb = getIndexedDB();
        if (!idb) { failOpen(); return; }
        req = idb.open(DB_NAME, DB_VERSION);
        if (!req) { failOpen(); return; }
      } catch (e) {
        failOpen();
        return;
      }

      req.onupgradeneeded = function () {
        try {
          const db = req.result;
          if (db && db.objectStoreNames && !db.objectStoreNames.contains(OBJECT_STORE)) {
            db.createObjectStore(OBJECT_STORE);
          }
        } catch (e) {
          // 创建失败交给 onerror / 超时处理
        }
      };
      req.onsuccess = function () {
        finish(req.result);
      };
      req.onerror = function () {
        failOpen();
      };
      req.onblocked = function () {
        // 其它标签页占用旧连接：不立即失败，等待对方释放或超时
      };
    });

    return dbPromise;
  }

  /* --------------------------------------------------------------------------
   * 三、事务执行
   * ------------------------------------------------------------------------ */

  /**
   * 在 kv 上执行一次事务。
   * @param {'readonly'|'readwrite'} mode
   * @param {(store: IDBObjectStore) => IDBRequest|void} action
   * @returns {Promise<{ok:boolean, value?:any}>} 永不 reject
   */
  function runTransaction(mode, action) {
    return openDB()
      .then(function (db) {
        return new Promise(function (resolve) {
          if (!db) {
            resolve({ ok: false, unavailable: true });
            return;
          }

          let tx;
          try {
            tx = db.transaction(OBJECT_STORE, mode);
          } catch (e) {
            resolve({ ok: false }); // 连接可能已关闭，交由上层重置并重试
            return;
          }

          let result;
          let settled = false;
          function finish(ok) {
            if (settled) return;
            settled = true;
            resolve(ok ? { ok: true, value: result } : { ok: false });
          }

          tx.oncomplete = function () { finish(true); };
          tx.onerror = function () { finish(false); };
          tx.onabort = function () { finish(false); };

          let req;
          try {
            req = action(tx.objectStore(OBJECT_STORE));
          } catch (e) {
            try { tx.abort(); } catch (e2) { /* ignore */ }
            finish(false);
            return;
          }
          if (req) {
            req.onsuccess = function () { result = req.result; };
            req.onerror = function () { /* 事务的 onerror/onabort 统一处理 */ };
          }
        });
      })
      .catch(function () {
        return { ok: false };
      });
  }

  /**
   * 执行操作，失败时重建连接并重试一次；返回 Promise<{ok,value}>，永不 reject。
   * 不可用（IDB 不存在 / 已 broken）时立即返回 ok=false。
   */
  function perform(mode, action) {
    if (!available()) return Promise.resolve({ ok: false, unavailable: true });
    return runTransaction(mode, action)
      .then(function (res) {
        if (res.ok || res.unavailable) return res;
        // 失败可能因为浏览器关闭了连接（页面休眠/版本变更）：重置后重试一次
        resetConnection();
        if (!available()) return { ok: false, unavailable: true };
        return runTransaction(mode, action);
      })
      .catch(function () {
        return { ok: false };
      });
  }

  /* --------------------------------------------------------------------------
   * 四、对外 API
   * ------------------------------------------------------------------------ */

  /** 读取；不存在 / 任何失败返回 null。 */
  function get(key) {
    return perform('readonly', function (store) {
      return store.get(key);
    })
      .then(function (res) {
        if (!res || !res.ok) return null;
        return res.value === undefined ? null : res.value;
      })
      .catch(function () {
        return null;
      });
  }

  /** 写入任意可结构化克隆的值；成功 true，失败 false（不 reject）。 */
  function set(key, value) {
    return perform('readwrite', function (store) {
      return store.put(value, key);
    })
      .then(function (res) {
        return !!(res && res.ok);
      })
      .catch(function () {
        return false;
      });
  }

  /** 删除；事务成功即 true（key 不存在也算成功），失败 false。 */
  function del(key) {
    return perform('readwrite', function (store) {
      return store.delete(key);
    })
      .then(function (res) {
        return !!(res && res.ok);
      })
      .catch(function () {
        return false;
      });
  }

  /* ---- 用量估算 ---- */

  // UTF-8 字节长度（不依赖 TextEncoder，Node / 浏览器通用）
  function utf8Length(str) {
    let bytes = 0;
    for (let i = 0; i < str.length; i++) {
      const code = str.codePointAt(i);
      if (code > 0xffff) i++;
      if (code < 0x80) bytes += 1;
      else if (code < 0x800) bytes += 2;
      else if (code < 0x10000) bytes += 3;
      else bytes += 4;
    }
    return bytes;
  }

  // 估算单个值序列化后的字节数（字符串按 UTF-8，对象按 JSON 近似）
  function approximateBytes(value) {
    try {
      if (typeof value === 'string') return utf8Length(value);
      if (value === undefined || value === null) return 0;
      const json = JSON.stringify(value);
      return typeof json === 'string' ? utf8Length(json) : 0;
    } catch (e) {
      return 0;
    }
  }

  // 遍历 kv 统计本模块自身占用的近似字节数（key + value）
  function estimateSelfBytes(db) {
    return new Promise(function (resolve) {
      if (!db) { resolve(0); return; }
      let total = 0;
      let done = false;
      function finish() {
        if (done) return;
        done = true;
        resolve(total);
      }
      try {
        const tx = db.transaction(OBJECT_STORE, 'readonly');
        const store = tx.objectStore(OBJECT_STORE);
        const req = store.openCursor();
        tx.onabort = finish;
        tx.onerror = finish;
        req.onsuccess = function () {
          const cursor = req.result;
          if (!cursor) { finish(); return; }
          try {
            total += approximateBytes(cursor.key) + approximateBytes(cursor.value);
            cursor.continue();
          } catch (e) {
            finish();
          }
        };
        req.onerror = finish;
      } catch (e) {
        finish();
      }
    });
  }

  // 从 navigator.storage.estimate() 取配额/用量；不可用/失败时安全返回 null
  function readEstimate() {
    let promise = null;
    try {
      const nav = getNavigator();
      if (nav && nav.storage && typeof nav.storage.estimate === 'function') {
        promise = Promise.resolve(nav.storage.estimate());
      }
    } catch (e) {
      promise = null;
    }
    if (!promise) return Promise.resolve(null);
    return promise.then(
      function (est) { return est && typeof est === 'object' ? est : null; },
      function () { return null; }
    );
  }

  function nonNegativeNumber(value) {
    const n = Number(value);
    return isFinite(n) && n > 0 ? n : 0;
  }

  /**
   * 用量信息：
   *   idbBytes —— 本模块 kv 中数据（key+value）的近似字节数（自身估算）；
   *   quota/usage —— navigator.storage.estimate() 的配额/已用；环境不支持时 0；
   *   backend —— 固定 'idb'。
   * IndexedDB 不可用（或打开失败）时返回 null，调用方应回退到 localStorage 展示。
   */
  function usage() {
    if (!available()) return Promise.resolve(null);
    return openDB()
      .then(function (db) {
        if (!db) return null; // 打开失败（隐私模式等）→ 不可用
        return Promise.all([estimateSelfBytes(db), readEstimate()]).then(function (results) {
          const selfBytes = results[0] || 0;
          const estimate = results[1] || {};
          return {
            idbBytes: nonNegativeNumber(selfBytes),
            quota: nonNegativeNumber(estimate.quota),
            usage: nonNegativeNumber(estimate.usage),
            backend: 'idb'
          };
        });
      })
      .catch(function () {
        return null;
      });
  }

  /* --------------------------------------------------------------------------
   * 五、导出
   * ------------------------------------------------------------------------ */
  return {
    available: available,
    get: get,
    set: set,
    del: del,
    usage: usage
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = STORE;

/* ==================== 认证与账号（ROUND4：全局账号 + 在线服务端鉴权） ==================== */
/** 手写 UTF-8 编码（不依赖 TextEncoder，jsdom/旧环境也可用） */
function sha256Utf8Bytes(str){
  const s = String(str == null ? '' : str);
  const out = [];
  for(let i = 0; i < s.length; i++){
    let c = s.charCodeAt(i);
    if(c < 0x80){ out.push(c); }
    else if(c < 0x800){ out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
    else if(c >= 0xD800 && c <= 0xDBFF && i + 1 < s.length){
      const c2 = s.charCodeAt(++i);
      const cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    } else { out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
  }
  return Uint8Array.from(out);
}

/* ==========================================================================
 * 10-rich.js — RT：富文本与图片模块（题干 / 选项 / 解析 / 简答参考答案）
 * 契约：docs/CONTRACTS.md §6.1
 *
 * 对外接口（顶层只暴露 RT）：
 *   RT.mount(container)                扫描 [data-rte] → 工具栏 + contenteditable
 *   RT.get(container, name)            取内容 HTML（已 sanitize；空内容返回 ''）
 *   RT.set(container, name, html)      设置内容（会 sanitize）
 *   RT.render(html)                    安全 HTML（展示用；空内容返回 ''）
 *   RT.plain(html)                     纯文本（图片→[图片]，块级换行）
 *   RT.isBlank(html)                   是否为空
 *   RT.compressImage(fileOrBlob, opts) 压缩图片 → dataURL（失败/无 canvas 回退原图）
 *   RT.imageFromUrl(url)               URL 图片下载并压缩 → dataURL（失败抛中文 Error）
 *   RT.sanitize(html)                  内部清洗函数（粘贴复用）
 *   RT.HTML_EMPTY                      ''
 *
 * 图片增强属性（只读渲染/编辑器一致，枚举白名单）：
 *   data-size="sm|md|full|auto"   小 40% / 中 70% / 原图 100% / 自适应（默认 auto）
 *   data-align="left|center|right" 对齐（缺省保持旧文档流；渲染只输出合法值）
 *
 * 约束：本文件会被拼进单个 <script>；顶层不得访问 window/document（只在函数里用），
 *      因此 render/plain/isBlank 可在 Node + jsdom 中直接测试。
 * ========================================================================== */

  'use strict';

  var HTML_EMPTY = '';

  /* ------------------------------------------------------------------ *
   * 白名单与常量
   * ------------------------------------------------------------------ */

    sub: 1, sup: 1, span: 1, div: 1, ul: 1, ol: 1, li: 1, img: 1
  };
  // 危险标签：连同内容一起丢弃（script 等绝不能让文字漏出来）
  var DROP = {
    script: 1, style: 1, iframe: 1, object: 1, embed: 1, noscript: 1, template: 1,
    svg: 1, math: 1, form: 1, input: 1, textarea: 1, select: 1, option: 1, optgroup: 1,
    button: 1, link: 1, meta: 1, base: 1, title: 1, head: 1, frame: 1, frameset: 1,
    applet: 1, audio: 1, video: 1, source: 1, track: 1, canvas: 1, map: 1, area: 1,
    param: 1, marquee: 1, xml: 1, xmp: 1, plaintext: 1, listing: 1
  };
  // 块级（plain 取纯文本时产生换行）
  var BLOCK = {
    p: 1, div: 1, li: 1, ul: 1, ol: 1, blockquote: 1, h1: 1, h2: 1, h3: 1, h4: 1,
    h5: 1, h6: 1, table: 1, tr: 1, td: 1, th: 1, section: 1, article: 1, header: 1,
    footer: 1, pre: 1, figure: 1, figcaption: 1, dl: 1, dt: 1, dd: 1

  var IMG_ALIGNS = { left: 1, center: 1, right: 1 };

  var IMG_ALIGN_LABEL = { left: '左对齐', center: '居中', right: '右对齐' };

    function deleteSelectedImage() {
      var img = state.selectedImg;
      if (!img || !el.contains(img)) {

        return;
      }

      state.selectedImg = null;
      updateImgToolbar();

    function currentRangeOrSaved() {

    function insertImageFile(file) {
      if (!file || !IMAGE_FILE_RE.test(file.type || '')) {

        return Promise.resolve();
      }
      var range = state.savedRange || getRangeInEditor(el);

    function replaceImageFile(file, target) {

        else state.savedRange = getRangeInEditor(el);

        imgs.forEach(function (f) {
          chain = chain.then(function () { return insertImageFile(f); });
        });
        return;
      }
      var html = dt.getData ? dt.getData('text/html') : '';
      if (html && html.trim()) {
        var clean = sanitize(html, { paste: true });
        e.preventDefault();
        if (clean) insertHtmlAt(state, el, clean, getRangeInEditor(el));
      }
    });

    function onPaste(e) {
      var cd = e.clipboardData || (win && win.clipboardData);
      if (!cd) { e.preventDefault(); return; }

      // 1) 剪贴板里的图片文件（截图 / 复制的图片）
      var imgs = [];
      var files = cd.files || [];
      for (var i = 0; i < files.length; i++) {
        if (files[i] && IMAGE_FILE_RE.test(files[i].type || '')) imgs.push(files[i]);
      }
      if (!imgs.length && cd.items) {
        for (var j = 0; j < cd.items.length; j++) {
          var it = cd.items[j];
          if (it && it.kind === 'file' && IMAGE_FILE_RE.test(it.type || '')) {
            var f = it.getAsFile ? it.getAsFile() : null;
            if (f) imgs.push(f);
          }
        }
      }
      if (imgs.length) {
        e.preventDefault();
        var pasteRange = getRangeInEditor(el);
        if (pasteRange) state.savedRange = pasteRange;
        var chain = Promise.resolve();
        imgs.forEach(function (f) {
          chain = chain.then(function () { return insertImageFile(f); });
        });
        return;
      }

      // 2) 富文本 HTML（Word / 网页片段）：清洗后插入；超大内嵌图默认「中」尺寸
      var html = cd.getData ? cd.getData('text/html') : '';
      if (html && html.trim()) {
        var clean = sanitize(html, { paste: true });
        e.preventDefault();
        if (clean) { insertHtmlAt(state, el, clean, getRangeInEditor(el)); return; }
      }

      // 3) 纯文本：转义后保留换行
      var text = cd.getData ? cd.getData('text/plain') : '';
      if (text) {
        e.preventDefault();
        var safe = escHtml(text).replace(/\r\n|\r|\n/g, '<br>');
        insertHtmlAt(state, el, safe, getRangeInEditor(el));
        return;
      }
      e.preventDefault();
    }
  }

    if (!el) return false;

    if (st) {

      st.savedRange = null;
      if (st.hintEl) st.hintEl.className = 'rt-hint';
      if (typeof st.updateImgToolbar === 'function') st.updateImgToolbar();

    return true;
  }

    mount: mount,
    get: get,
    set: set,
    render: render,
